<text x="262.5" y="334.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#6a737b" font-weight="normal">FRIDGE TOP — domed for rigidity</text>
<text x="262.5" y="348.0" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="middle" fill="#8a9199" font-weight="normal">(dome shown 14x exaggerated)</text>
