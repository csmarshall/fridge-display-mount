<text x="290.0" y="572.2" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#8c1070" font-weight="bold">magnet 11.51</text>
<rect x="100.0" y="506.4" width="240" height="10" fill="#5d3600"/>
<text x="220.0" y="500.4" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="middle" fill="#5d3600" font-weight="normal">arm</text>
<text x="220.0" y="670.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#2e9e5b" font-weight="normal">CORRECT — foam bears the load,</text>
<text x="220.0" y="683.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#2e9e5b" font-weight="normal">magnet reaches the steel</text>
<text x="610.0" y="500.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#b00020" font-weight="bold">pad THICKER than magnet</text>
<rect x="480.0" y="620.0" width="260" height="16" fill="#dfe3e6" stroke="#8a9199" stroke-width="1.2"/>
<text x="610.0" y="650.0" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#6a737b" font-weight="normal">fridge steel</text>
