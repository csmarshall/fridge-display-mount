<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940">
<rect width="1280" height="940" fill="#fbfbf9"/>
<rect x="0" y="0" width="1280" height="32" fill="#b00020"/>
<text x="640.0" y="22.0" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">REFERENCE ONLY — why crown, corner radius, foam and arm magnets are one problem</text>
<text x="40.0" y="60.0" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#111" font-weight="bold">The foam has ONE budget, and two things spend it</text>
<text x="40.0" y="82.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#555" font-weight="normal">Side elevation along the fridge's top edge. Horizontal is true scale; VERTICAL IS EXAGGERATED 14x so gaps of a few mm are visible.</text>
<text x="40.0" y="150.0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#111" font-weight="bold">1 — What the foam has to absorb</text>
<text x="40.0" y="168.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#555" font-weight="normal">The arm is rigid. The fridge top is domed. The two cannot touch everywhere, and the foam is what bridges the difference.</text>
