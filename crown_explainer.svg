<text x="413.0" y="304.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#1a5fb4" font-weight="bold">crown rise  0.00 mm</text>
<text x="413.0" y="318.0" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="start" fill="#1a5fb4" font-weight="normal">grows if the arm reaches further inboard</text>
<text x="413.0" y="267.8" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#c0169a" font-weight="bold">corner-radius lift  3.46 mm</text>
<text x="413.0" y="281.8" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="start" fill="#c0169a" font-weight="normal">grows if the fridge corner radius is large</text>
<text x="40.0" y="404.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#111" font-weight="bold">They STACK: 0.00 + 3.46 = 3.46 mm, against a 11.50 mm pad. That is the whole budget.</text>
<text x="40.0" y="442.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#b00020" font-weight="bold">Crown is currently modelled as 0.00 mm — ASSUMED, not measured on the Samsung. Measure before trusting this sum.</text>
<text x="40.0" y="474.0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#111" font-weight="bold">2 — So why not just use thicker foam? Because the arm magnet has to touch steel</text>
<text x="220.0" y="500.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#2e9e5b" font-weight="bold">pad = magnet height</text>
<rect x="90.0" y="620.0" width="260" height="16" fill="#dfe3e6" stroke="#8a9199" stroke-width="1.2"/>
<text x="220.0" y="650.0" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#6a737b" font-weight="normal">fridge steel</text>
<rect x="110.0" y="516.4" width="120" height="103.6" fill="#f2c14e" fill-opacity="0.85" stroke="#a8830f"/>
<text x="170.0" y="572.2" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#6b5008" font-weight="bold">foam 11.51</text>
