<text x="1000.0" y="650.0" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#6a737b" font-weight="normal">fridge steel</text>
<rect x="890.0" y="543.4" width="120" height="76.6" fill="#f2c14e" fill-opacity="0.85" stroke="#a8830f"/>
<text x="950.0" y="585.7" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#6b5008" font-weight="bold">foam 8.51</text>
<rect x="1035.0" y="516.4" width="70" height="103.6" fill="#c0169a" fill-opacity="0.35" stroke="#c0169a"/>
<text x="1070.0" y="572.2" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#8c1070" font-weight="bold">magnet 11.51</text>
<rect x="880.0" y="506.4" width="240" height="10" fill="#5d3600"/>
<text x="1000.0" y="500.4" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="middle" fill="#5d3600" font-weight="normal">arm</text>
<rect x="890.0" y="516.4" width="120" height="27.0" fill="none" stroke="#b00020" stroke-width="1.4" stroke-dasharray="3 2"/>
<text x="1000.0" y="670.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#b00020" font-weight="normal">magnet holds the arm up.</text>
<text x="1000.0" y="683.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#b00020" font-weight="normal">Foam does nothing, and the</text>
<text x="1000.0" y="696.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#b00020" font-weight="normal">rigid magnet line-loads the sheet.</text>
<text x="40.0" y="790.0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#111" font-weight="bold">3 — The way out, if your crown measures ugly</text>
<rect x="60" y="806" width="12" height="12" fill="#5d3600"/>
<text x="82.0" y="817.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#5d3600" font-weight="bold">Keep the arm magnets</text>
<text x="82.0" y="834.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#333" font-weight="normal">pad locked to the stock size that matches the 11.51 mm magnet, currently 11.50 mm  -&gt;  the arm magnets must reach steel</text>
<rect x="60" y="848" width="12" height="12" fill="#2e9e5b"/>
<text x="82.0" y="859.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#2e9e5b" font-weight="bold">Drop the arm magnets</text>
<text x="82.0" y="876.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#333" font-weight="normal">pad thickness becomes free  -&gt;  3/8 in foam tolerates 11.0 mm of crown at 130 mm reach, 8.5 mm at 180 mm</text>
<text x="60.0" y="912.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#555" font-weight="normal">The arm magnets are anti-jostle only — zero credit in the load path. They are costing you crown tolerance, not strength.</text>
<text x="60.0" y="929.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#111" font-weight="bold">Measure the crown first. Under ~4 mm and none of this matters: keep the magnets.</text>
</svg>