<text x="560.0" y="556.5" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#6b5008" font-weight="bold">foam 15.01</text>
<rect x="645.0" y="516.4" width="70" height="103.6" fill="#c0169a" fill-opacity="0.35" stroke="#c0169a"/>
<text x="680.0" y="572.2" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#8c1070" font-weight="bold">magnet 11.51</text>
<rect x="490.0" y="474.9" width="240" height="10" fill="#5d3600"/>
<text x="610.0" y="468.9" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="middle" fill="#5d3600" font-weight="normal">arm</text>
<rect x="645.0" y="484.9" width="70" height="31.5" fill="none" stroke="#b00020" stroke-width="1.4" stroke-dasharray="3 2"/>
<text x="610.0" y="670.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#b00020" font-weight="normal">magnet is held off the steel.</text>
<text x="610.0" y="683.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#b00020" font-weight="normal">It grips nothing.</text>
<text x="1000.0" y="500.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#b00020" font-weight="bold">pad THINNER than magnet</text>
