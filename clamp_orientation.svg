ect x="524.9" y="402.0" width="50.4" height="40" fill="#8f9aa4" stroke="#14181c" stroke-width="1.1"/><line x1="321.6" y1="422.0" x2="550.1" y2="422.0" stroke="#14181c" stroke-width="1.2"/><text x="435.87" y="417.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#14181c" font-weight="bold">STRUTS 187.28 apart</text><text x="1025.06" y="420.00" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="start" fill="#14181c" font-weight="bold">= box 134 + strut 41.27 + 2x6</text><text x="1025.06" y="431.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="start" fill="#6b757e" font-weight="normal">the box has to pass BETWEEN them</text><rect x="354.1" y="458.0" width="163.5" height="40.0" fill="#2b3440" stroke="#14181c" stroke-width="1.1"/><text x="435.87" y="482.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#fff" font-weight="bold">REAR BOX 134</text><text x="1025.06" y="476.00" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="start" fill="#14181c" font-weight="bold">sits between the struts</text><text x="1025.06" y="487.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="start" fill="#6b757e" font-weight="normal">191.9 .. 325.9   (134.00 wide)</text><rect x="237.8" y="520.0" width="396.1" height="40.0" fill="#1d6b4f" stroke="#14181c" stroke-width="1.1"/><text x="435.87" y="544.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#fff" font-weight="bold">PORTRAIT 324.65</text><text x="1025.06" y="538.00" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="start" fill="#0a8f6f" font-weight="bold">FITS</text><text x="1025.06" y="549.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="start" fill="#6b757e" font-weight="normal">96.6 .. 421.2   (324.65 wide)</text><rect x="97.2" y="576.0" width="677.4" height="40" fill="#b00020" fill-opacity="0.30