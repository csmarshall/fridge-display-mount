,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#b00020" font-weight="bold">3</text><text x="84.00" y="796.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#14181c" font-weight="normal">so the clamp bar is 242.28 to span them</text><circle cx="767.0" cy="792.0" r="9" fill="#b00020" fill-opacity="0.15"/><text x="767.00" y="795.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#b00020" font-weight="bold">4</text><text x="784.00" y="796.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#14181c" font-weight="normal">a 242 bar in a 400.0 window, holding 20 off the cover, can sit no further forward than 258.9</text><circle cx="67.0" cy="826.0" r="9" fill="#b00020" fill-opacity="0.15"/><text x="67.00" y="829.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#b00020" font-weight="bold">5</text><text x="84.00" y="830.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#14181c" font-weight="normal">landscape needs its centre at 277.6 or more to clear the rear edge</text><circle cx="767.0" cy="826.0" r="9" fill="#b00020" fill-opacity="0.15"/><text x="767.00" y="829.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#b00020" font-weight="bold">6</text><text x="784.00" y="830.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#b00020" font-weight="bold">258.9 is 18.7 mm short. PORTRAIT only needs 162.3, and has 96.6 mm in hand.</text></svg>