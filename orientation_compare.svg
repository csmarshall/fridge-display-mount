<svg xmlns="http://www.w3.org/2000/svg" width="1006" height="938" viewBox="0 0 1006 938">
<rect width="1006" height="938" fill="#fbfbf9"/>
<rect x="0" y="0" width="1006" height="32" fill="#b00020"/>
<text x="502.9" y="22.0" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">REFERENCE ONLY — orientation study on a counter-depth side panel</text>
<text x="40.0" y="60.0" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#111" font-weight="bold">Landscape vs portrait — looking straight at the side panel</text>
<text x="40.0" y="82.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#555" font-weight="normal">Horizontal axis is the fridge's DEPTH. Samsung RS23A500ASR is COUNTER-DEPTH: the cabinet is only 610 mm front to back.</text>
<text x="40.0" y="99.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#555" font-weight="normal">The door sweeps the front 64 mm when it opens (Samsung's own 2.5 in hinge-side clearance), so that strip is unusable.</text>
<text x="161.4" y="143.0" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#b00020" font-weight="bold">LANDSCAPE</text>
<text x="161.4" y="160.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#555" font-weight="normal">555 mm display in a 546 mm window</text>
<text x="161.4" y="176.0" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#b00020" font-weight="bold">DOES NOT FIT — over by 9 mm</text>
<rect x="70.0" y="205.0" width="182.9" height="522.9" fill="#3a3734" stroke="#1f1d1b" stroke-width="1.4"/>
<text x="161.4" y="665.2" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#6a737b" font-weight="normal">SIDE PANEL</text>
<text x="161.4" y="680.2" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#8a9199" font-weight="normal">610 mm deep x 1743 mm tall</text>
<text x="71.8" y="221.0" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="start" fill="#6a737b" font-weight="bold">FRONT</text>
<text x="251.1" y="221.0" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="end" fill="#6a737b" font-weight="bold">BACK</text>
<rect x="70.0" y="205.0" width="19.1" height="522.9" fill="#b00020" fill-opacity="0.15" stroke="#b00020" stroke-width="1" stroke-dasharray="4 3"/>
<text x="79.5" y="440.3" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="middle" fill="#b00020" font-weight="bold" transform="rotate(-90.0 79.5 440.3)">door sweep 64</text>
<rect x="70.0" y="194.0" width="33.0" height="11.0" fill="#8a9199" stroke="#5c6368" stroke-width="1"/>
<text x="111.0" y="192.0" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="start" fill="#5c6368" font-weight="normal">hinge cover, 37 mm proud</text>
<rect x="142.5" y="197.6" width="57.0" height="4" fill="#9a5b00"/>
<text x="171.0" y="218.0" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="middle" fill="#5d3600" font-weight="bold">arm 190 mm</text>
<rect x="124.5" y="282.1" width="93.0" height="93.0" fill="#9a5b00" fill-opacity="0.45" stroke="#5d3600" stroke-width="1"/>
<rect x="87.7" y="279.9" width="166.6" height="97.4" fill="#2b2b2b" fill-opacity="0.88" stroke="#000" stroke-width="1.2"/>
<text x="171.0" y="328.6" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">555 x 325</text>
<rect x="87.7" y="279.9" width="1.4" height="97.4" fill="#b00020" fill-opacity="0.45" stroke="#b00020" stroke-width="1.4"/>
<text x="93.7" y="328.6" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="start" fill="#b00020" font-weight="bold">into the</text>
<text x="93.7" y="340.6" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="start" fill="#b00020" font-weight="bold">door's path</text>
<rect x="28.0" y="292.9" width="34" height="70.2" fill="#2e9e5b" fill-opacity="0.18"/>
<text x="45.0" y="328.0" font-family="Helvetica,Arial,sans-serif" font-size="8" text-anchor="middle" fill="#2e9e5b" font-weight="bold" transform="rotate(-90.0 45.0 328.0)">comfort</text>
<text x="262.9" y="332.6" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="start" fill="#111" font-weight="normal">screen centre 1331 mm</text>
<text x="262.9" y="283.9" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="start" fill="#666" font-weight="normal">top 1493</text>
<text x="262.9" y="381.3" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="start" fill="#666" font-weight="normal">bottom 1169</text>
<text x="604.3" y="143.0" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#2e9e5b" font-weight="bold">PORTRAIT</text>
<text x="604.3" y="160.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#555" font-weight="normal">325 mm display in a 546 mm window</text>
<text x="604.3" y="176.0" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#2e9e5b" font-weight="bold">FITS — 221 mm spare</text>
<rect x="512.9" y="205.0" width="182.9" height="522.9" fill="#3a3734" stroke="#1f1d1b" stroke-width="1.4"/>
<text x="604.3" y="665.2" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#6a737b" font-weight="normal">SIDE PANEL</text>
<text x="604.3" y="680.2" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#8a9199" font-weight="normal">610 mm deep x 1743 mm tall</text>
<text x="514.7" y="221.0" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="start" fill="#6a737b" font-weight="bold">FRONT</text>
<text x="694.0" y="221.0" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="end" fill="#6a737b" font-weight="bold">BACK</text>
<rect x="512.9" y="205.0" width="19.1" height="522.9" fill="#b00020" fill-opacity="0.15" stroke="#b00020" stroke-width="1" stroke-dasharray="4 3"/>
<text x="522.4" y="440.3" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="middle" fill="#b00020" font-weight="bold" transform="rotate(-90.0 522.4 440.3)">door sweep 64</text>
<rect x="512.9" y="194.0" width="33.0" height="11.0" fill="#8a9199" stroke="#5c6368" stroke-width="1"/>
<text x="553.9" y="192.0" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="start" fill="#5c6368" font-weight="normal">hinge cover, 37 mm proud</text>
<rect x="585.3" y="197.6" width="57.0" height="4" fill="#9a5b00"/>
<text x="613.8" y="218.0" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="middle" fill="#5d3600" font-weight="bold">arm 190 mm</text>
<rect x="567.3" y="282.1" width="93.0" height="93.0" fill="#9a5b00" fill-opacity="0.45" stroke="#5d3600" stroke-width="1"/>
<rect x="565.1" y="245.3" width="97.4" height="166.6" fill="#2b2b2b" fill-opacity="0.88" stroke="#000" stroke-width="1.2"/>
<text x="613.8" y="328.6" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">325 x 555</text>
<rect x="470.9" y="292.9" width="34" height="70.2" fill="#2e9e5b" fill-opacity="0.18"/>
<text x="487.9" y="328.0" font-family="Helvetica,Arial,sans-serif" font-size="8" text-anchor="middle" fill="#2e9e5b" font-weight="bold" transform="rotate(-90.0 487.9 328.0)">comfort</text>
<text x="705.8" y="332.6" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="start" fill="#111" font-weight="normal">screen centre 1331 mm</text>
<text x="705.8" y="249.3" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="start" fill="#666" font-weight="normal">top 1609</text>
<text x="705.8" y="415.9" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="start" fill="#666" font-weight="normal">bottom 1053</text>
<rect x="60" y="764" width="11" height="11" fill="#b00020"/>
<text x="80.0" y="773.9" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">LANDSCAPE does not fit. The 555 mm display is 9 mm wider than the usable window, and centring it puts its front edge inside the arc the door sweeps.</text>
<rect x="60" y="790" width="11" height="11" fill="#2e9e5b"/>
<text x="80.0" y="799.9" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">PORTRAIT fits with 221 mm to spare — and the brief already noted portrait is mechanically better: the touch-torsion arm drops from 278 mm to 162 mm.</text>
<rect x="60" y="816" width="11" height="11" fill="#555"/>
<text x="80.0" y="825.9" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">The 63.5 mm front keep-out is Samsung's own 2.5 in hinge-side clearance figure. VERIFY IT: open the door fully and measure how far it sweeps past the side panel.</text>
<rect x="60" y="842" width="11" height="11" fill="#555"/>
<text x="80.0" y="851.9" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">Hinge cover footprint is drawn indicatively. Measure how far back it extends — it further narrows where the arm can land.</text>
</svg>