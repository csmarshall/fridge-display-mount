<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760"><rect width="1180" height="760" fill="#fbfcfd"/><rect width="1180" height="24" fill="#b8860b"/><text x="590.00" y="16.50" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">FLAT PATTERNS — dimensions derived, bend deduction is an ESTIMATE until SendCutSend's calculator confirms it</text><text x="40.00" y="56.00" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#14181c" font-weight="bold">THE TWO PARTS, FLAT</text><text x="40.00" y="78.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#6b757e" font-weight="normal">Two bent parts, two of each. Formed dimensions in; flat length is the sum of the legs MINUS the bend deduction.</text><rect x="40.0" y="100.0" width="545.0" height="470.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">A — CLAMP  x2</text><rect x="80.0" y="250.0" width="285.1" height="83.1" fill="#b9c2c9" stroke="#14181c" stroke-width="1.4"/><line x1="302.7" y1="236.0" x2="302.7" y2="347.1" stroke="#b00020" stroke-width="1.5" stroke-dasharray="8 5"/><text x="302.67" y="230.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#b00020" font-weight="bold">BEND 90</text><circle cx="204.7" cy="291.6" r="6.0" fill="#fbfcfd" stroke="#14181c" stroke-width="1.1"/><text x="204.69" y="359.13" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#6b757e" font-weight="normal">square hole 8.38 — stops the stud spinning</text><line x1="80.0" y1="385.1" x2="302.7" y2="385.1" stroke="#14181c" stroke-width="0.8"/><text x="191.34" y="380.13" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#14181c" font-weight="bold">150 formed</text><line x1="302.7" y1="385.1" x2="365.1" y2="385.1" stroke="#14181c" stroke-width="0.8"/><text x="333.90" y="380.13" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#14181c" font-weight="bold">44 formed</text><text x="222.57" y="419.13" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#14181c" font-weight="bold">FLAT 188.65 x 55 = 150 + 44 - 5.35</text><text x="56.00" y="154.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">Long leg lies on the fridge top (or under its base). Short leg</text><text x="56.00" y="167.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">drops beside the strut. The SAME part is used at both ends —</text><text x="56.00" y="180.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">the lower one is simply flipped.</text><text x="56.00" y="486.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">Material 3.02 mm (0.119 in). Bend radius 3.02 assumed at about</text><text x="56.00" y="499.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">1T, K = 0.42. Deduction 5.35 mm. Both parts drawn at the SAME</text><text x="56.00" y="512.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">scale.</text><rect x="620.0" y="100.0" width="545.0" height="470.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="636.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">B — FOOT  x2</text><rect x="660.0" y="250.0" width="400.0" height="83.1" fill="#b9c2c9" stroke="#14181c" stroke-width="1.4"/><line x1="882.7" y1="236.0" x2="882.7" y2="347.1" stroke="#b00020" stroke-width="1.5" stroke-dasharray="8 5"/><text x="882.67" y="230.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#b00020" font-weight="bold">BEND 90</text><circle cx="784.7" cy="291.6" r="6.0" fill="#fbfcfd" stroke="#14181c" stroke-width="1.1"/><rect x="763.1" y="286.6" width="43.2" height="10" rx="5" fill="#fbfcfd" stroke="#14181c" stroke-width="1.1"/><text x="784.69" y="359.13" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#6b757e" font-weight="normal">slot 28.6 long — height adjustment lives HERE</text><line x1="660.0" y1="385.1" x2="882.7" y2="385.1" stroke="#14181c" stroke-width="0.8"/><text x="771.34" y="380.13" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#14181c" font-weight="bold">150 formed</text><line x1="882.7" y1="385.1" x2="1060.0" y2="385.1" stroke="#14181c" stroke-width="0.8"/><text x="971.34" y="380.13" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#14181c" font-weight="bold">120 formed</text><text x="860.00" y="419.13" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#14181c" font-weight="bold">FLAT 264.65 x 55 = 150 + 120 - 5.35</text><text x="636.00" y="154.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">Vertical leg carries the elongated slot the stud passes</text><text x="636.00" y="167.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">through. Horizontal leg turns OUTBOARD and the strut stands on</text><text x="636.00" y="180.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">it, so the strut never touches the floor.</text><text x="636.00" y="486.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">Material 3.02 mm (0.119 in). Bend radius 3.02 assumed at about</text><text x="636.00" y="499.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">1T, K = 0.42. Deduction 5.35 mm. Both parts drawn at the SAME</text><text x="636.00" y="512.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">scale.</text><rect x="40.0" y="590.0" width="1085.0" height="130.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="614.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#b8860b" font-weight="bold">WHY THE DEDUCTION MATTERS MORE THAN IT LOOKS</text><text x="56.00" y="640.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">The deduction is 5.35 mm — small, and tempting to ignore. It is not ignorable here because the foot's slot is what absorbs height error, and the slot</text><text x="56.00" y="653.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">is only 28.6 mm long. Getting both bends wrong in the same direction spends 10.7 mm of a 28.6 mm adjustment range before the thing is even on the</text><text x="56.00" y="666.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">fridge. Replace this estimate with SendCutSend's own calculator before ordering.</text></svg>