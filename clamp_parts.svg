<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760"><rect width="1180" height="760" fill="#fbfcfd"/><rect width="1180" height="24" fill="#b8860b"/><text x="590.00" y="16.50" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">FLAT PATTERNS — dimensions derived, bend deduction is an ESTIMATE until SendCutSend's calculator confirms it</text><text x="40.00" y="56.00" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#14181c" font-weight="bold">THE TWO PARTS, FLAT</text><text x="40.00" y="78.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#6b757e" font-weight="normal">Two bent parts: 2 clamps and 2 feet. TWO surfaces are gripped (the fridge top and its underside) but the clamps SPAN both struts, so that is 2 bars, not 4 tabs.</text><rect x="40.0" y="100.0" width="545.0" height="470.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">A — CLAMP BAR  x2</text><rect x="80.0" y="242.0" width="163.2" height="186.0" fill="#b9c2c9" stroke="#14181c" stroke-width="1.4"/><line x1="207.5" y1="228.0" x2="207.5" y2="442.0" stroke="#b00020" stroke-width="1.5" stroke-dasharray="8 5"/><text x="207.45" y="222.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#b00020" font-weight="bold">BEND 90</text><circle cx="151.4" cy="265.8" r="3.4" fill="#fbfcfd" stroke="#14181c" stroke-width="1.1"/><circle cx="151.4" cy="404.2" r="3.4" fill="#fbfcfd" stroke="#14181c" stroke-width="1.1"/><line x1="151.4" y1="265.8" x2="151.4" y2="404.2" stroke="#0a8f6f" stroke-width="1"/><line x1="151.4" y1="335.0" x2="251.2" y2="335.0" stroke="#0a8f6f" stroke-width="0.7" stroke-dasharray="3 3"/><text x="255.21" y="332.00" font-family="Helvetica,Arial,sans-serif" font-size="9.4" text-anchor="start" fill="#0a8f6f" font-weight="bold">160 mm</text><text x="255.21" y="344.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#0a8f6f" font-weight="normal">strut centres</text><text x="161.60" y="452.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#6b757e" font-weight="normal">square holes 8.38 — the stud cannot spin</text><line x1="80.0" y1="476.0" x2="207.5" y2="476.0" stroke="#14181c" stroke-width="0.8"/><text x="143.73" y="471.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#14181c" font-weight="bold">150 formed</text><line x1="207.5" y1="476.0" x2="243.2" y2="476.0" stroke="#14181c" stroke-width="0.8"/><text x="225.33" y="471.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#14181c" font-weight="bold">44 formed</text><text x="161.60" y="502.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#14181c" font-weight="bold">FLAT 188.65 x 215</text><text x="56.00" y="154.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">Spans BOTH struts, so the two legs are tied into a frame</text><text x="56.00" y="167.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">rather than standing independently. Long leg lies on the</text><text x="56.00" y="180.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">fridge top, or under its base. The SAME part does both ends —</text><text x="56.00" y="193.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">the lower one is flipped.</text><text x="56.00" y="524.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">Material 3.02 mm (0.119 in), bend radius 3.02 at about 1T, K =</text><text x="56.00" y="537.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">0.42, deduction 5.35 mm. Both parts drawn at the SAME scale.</text><rect x="620.0" y="100.0" width="545.0" height="470.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="636.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">B — FOOT  x2</text><rect x="660.0" y="311.2" width="229.0" height="47.6" fill="#b9c2c9" stroke="#14181c" stroke-width="1.4"/><line x1="787.5" y1="297.2" x2="787.5" y2="372.8" stroke="#b00020" stroke-width="1.5" stroke-dasharray="8 5"/><text x="787.45" y="291.21" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#b00020" font-weight="bold">BEND 90</text><rect x="719.0" y="331.0" width="24.7" height="8" rx="4" fill="#fbfcfd" stroke="#14181c" stroke-width="1.1"/><text x="774.48" y="382.79" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#6b757e" font-weight="normal">slot 28.6 long — height adjustment lives HERE</text><line x1="660.0" y1="406.8" x2="787.5" y2="406.8" stroke="#14181c" stroke-width="0.8"/><text x="723.73" y="401.79" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#14181c" font-weight="bold">150 formed</text><line x1="787.5" y1="406.8" x2="889.0" y2="406.8" stroke="#14181c" stroke-width="0.8"/><text x="838.20" y="401.79" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#14181c" font-weight="bold">120 formed</text><text x="774.48" y="432.79" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#14181c" font-weight="bold">FLAT 264.65 x 55</text><text x="636.00" y="154.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">One per strut. Vertical leg carries the elongated slot the</text><text x="636.00" y="167.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">stud passes through; horizontal leg turns OUTBOARD and the</text><text x="636.00" y="180.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">strut stands on it, so the strut never touches the floor.</text><text x="636.00" y="524.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">Material 3.02 mm (0.119 in), bend radius 3.02 at about 1T, K =</text><text x="636.00" y="537.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">0.42, deduction 5.35 mm. Both parts drawn at the SAME scale.</text><rect x="40.0" y="590.0" width="1085.0" height="130.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="614.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#b8860b" font-weight="bold">WHAT SPANNING COSTS, AND THE ONE RISK IT CARRIES</text><text x="56.00" y="636.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">Two bars instead of four tabs uses about 2.7x the clamp steel, and the top bar now fixes the 160 mm spacing instead of relying on careful assembly —</text><text x="56.00" y="649.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">which is a gain. The risk is underneath: the LOWER bar has to bear across 215 mm of an underside measured at 10-20 mm and known NOT to be flat. It</text><text x="56.00" y="662.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">therefore bears on TWO PADS inset 40 mm from each strut rather than along a continuous edge, so an uneven surface loads two known points instead of</text><text x="56.00" y="675.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">whichever high spot it finds first.</text></svg>