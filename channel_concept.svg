<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1206" viewBox="0 0 1240 1206"><rect width="1240" height="1206" fill="#fbfcfd"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a8f6f"/></marker></defs><rect width="1240" height="26" fill="#b8860b"/><text x="620.00" y="18.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#fff" font-weight="bold">ALTERNATE CONCEPT — not the design of record</text><text x="40.00" y="58.00" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#14181c" font-weight="bold">STAND IT ON THE FLOOR INSTEAD</text><text x="40.00" y="80.00" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#6b757e" font-weight="normal">A slotted strut channel from the floor up the side panel, with the display on channel nuts. Completely different load path from the hook.</text><rect x="40.0" y="100.0" width="560.0" height="470.0" rx="6" fill="#fff" stroke="#c9d1d8" stroke-width="1.1"/><text x="62.00" y="126.00" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#6b757e" font-weight="bold">THE HOOK — design of record</text><line x1="87.8" y1="552.0" x2="219.0" y2="552.0" stroke="#14181c" stroke-width="2"/><text x="88.62" y="567.00" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="start" fill="#6b757e" font-weight="normal">floor</text><rect x="96.0" y="194.7" width="61.5" height="357.3" fill="#3a3734" stroke="#1f1d1b" stroke-width="1.2"/><text x="126.75" y="444.80" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#b0b6b9" font-weight="normal" transform="rotate(-90.0 126.75 444.80)">fridge</text><path d="M160.8 314.0 L160.8 194.7 L120.6 194.7 L120.6 192.2 L162.8 192.2 L162.8 314.0 Z" fill="#3f4b55" stroke="#14181c" stroke-width="1"/><path d="M139.1 176.2 L139.1 190.6" stroke="#0a8f6f" stroke-width="2.2" marker-end="url(#ar)"/><rect x="163.6" y="222.2" width="4.1" height="113.8" fill="#101820" stroke="#14181c" stroke-width="1"/><text x="168.65" y="328.04" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="start" fill="#6b757e" font-weight="normal">display</text><line x1="185.6" y1="171.0" x2="171.9" y2="171.0" stroke="#c9d1d8" stroke-width="0.8"/><line x1="185.6" y1="275.1" x2="171.9" y2="275.1" stroke="#c9d1d8" stroke-width="0.8"/><text x="175.95" y="174.99" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#0a8f6f" font-weight="bold">the whole load bears on the TOP CORNER</text><text x="175.95" y="279.13" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#c0169a" font-weight="bold">magnets carry NOTHING</text><rect x="620.0" y="100.0" width="580.0" height="470.0" rx="6" fill="#fff" stroke="#c9d1d8" stroke-width="1.1"/><text x="642.00" y="126.00" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#14181c" font-weight="bold">THE STRUT — this concept</text><line x1="667.8" y1="552.0" x2="799.0" y2="552.0" stroke="#14181c" stroke-width="2"/><text x="668.62" y="567.00" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="start" fill="#6b757e" font-weight="normal">floor</text><rect x="676.0" y="194.7" width="61.5" height="357.3" fill="#3a3734" stroke="#1f1d1b" stroke-width="1.2"/><text x="706.75" y="444.80" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#b0b6b9" font-weight="normal" transform="rotate(-90.0 706.75 444.80)">fridge</text><rect x="739.1" y="239.6" width="12.7" height="312.4" fill="#8f9aa4" stroke="#14181c" stroke-width="1"/><rect x="742.9" y="529.5" width="5.1" height="5" fill="#14181c" fill-opacity="0.5"/><rect x="742.9" y="503.2" width="5.1" height="5" fill="#14181c" fill-opacity="0.5"/><rect x="742.9" y="477.0" width="5.1" height="5" fill="#14181c" fill-opacity="0.5"/><rect x="742.9" y="450.7" width="5.1" height="5" fill="#14181c" fill-opacity="0.5"/><rect x="742.9" y="424.5" width="5.1" height="5" fill="#14181c" fill-opacity="0.5"/><rect x="742.9" y="398.2" width="5.1" height="5" fill="#14181c" fill-opacity="0.5"/><rect x="742.9" y="372.0" width="5.1" height="5" fill="#14181c" fill-opacity="0.5"/><rect x="742.9" y="345.8" width="5.1" height="5" fill="#14181c" fill-opacity="0.5"/><rect x="742.9" y="319.5" width="5.1" height="5" fill="#14181c" fill-opacity="0.5"/><rect x="742.9" y="293.3" width="5.1" height="5" fill="#14181c" fill-opacity="0.5"/><rect x="742.9" y="267.1" width="5.1" height="5" fill="#14181c" fill-opacity="0.5"/><rect x="742.9" y="240.8" width="5.1" height="5" fill="#14181c" fill-opacity="0.5"/><rect x="717.0" y="548.7" width="23.4" height="3.3" fill="#8f9aa4" stroke="#14181c" stroke-width="1"/><path d="M725.2 513.0 L725.2 543.8" stroke="#0a8f6f" stroke-width="2.2" marker-end="url(#ar)"/><rect x="735.0" y="302.1" width="4.1" height="7.4" fill="#e7b6dd" stroke="#c0169a" stroke-width="1"/><rect x="735.0" y="248.8" width="4.1" height="7.4" fill="#e7b6dd" stroke="#c0169a" stroke-width="1"/><rect x="753.5" y="222.2" width="4.1" height="113.8" fill="#101820" stroke="#14181c" stroke-width="1"/><text x="758.47" y="328.04" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="start" fill="#6b757e" font-weight="normal">display</text><line x1="775.5" y1="244.4" x2="761.8" y2="244.4" stroke="#c9d1d8" stroke-width="0.8"/><line x1="775.5" y1="283.3" x2="761.8" y2="283.3" stroke="#c9d1d8" stroke-width="0.8"/><line x1="775.5" y1="507.0" x2="761.8" y2="507.0" stroke="#c9d1d8" stroke-width="0.8"/><line x1="775.5" y1="539.8" x2="761.8" y2="539.8" stroke="#c9d1d8" stroke-width="0.8"/><text x="765.77" y="248.38" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#c0169a" font-weight="bold">magnets PROP it — in PULL</text><text x="765.77" y="287.33" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#6b757e" font-weight="bold">strut drawn 3x deep to be visible</text><text x="765.77" y="511.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#0a8f6f" font-weight="bold">229 lb of fridge anchors the foot</text><text x="765.77" y="543.80" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#0a8f6f" font-weight="bold">weight goes into the FLOOR</text><rect x="40.0" y="596.0" width="560.0" height="300.0" rx="6" fill="#fff" stroke="#c9d1d8" stroke-width="1.1"/><text x="62.00" y="622.00" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#14181c" font-weight="bold">DOES IT STAND UP?</text><text x="62.00" y="652.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">Strength at the base</text><text x="62.00" y="667.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">29.6 N·m from a 5 lb press</text><text x="578.00" y="652.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end" fill="#0a8f6f" font-weight="bold">SF 6.1</text><text x="62.00" y="696.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">Sway, UNPROPPED</text><text x="62.00" y="711.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">9.4 mm at the screen</text><text x="578.00" y="696.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end" fill="#b00020" font-weight="bold">the hook flexes 0.016</text><text x="62.00" y="740.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">Free-standing, 400 mm base</text><text x="62.00" y="755.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">SF 0.33</text><text x="578.00" y="740.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end" fill="#b00020" font-weight="bold">IT FALLS OVER</text><text x="62.00" y="784.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">Foot 100 mm under the fridge</text><text x="62.00" y="799.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">SF 3.4</text><text x="578.00" y="784.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end" fill="#0a8f6f" font-weight="bold">anchored</text><text x="62.00" y="828.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">Pull on the props, propped</text><text x="62.00" y="843.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">5.3 lb shared</text><text x="578.00" y="828.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end" fill="#0a8f6f" font-weight="bold">vs 61.2 lb each</text><rect x="620.0" y="596.0" width="580.0" height="300.0" rx="6" fill="#fff" stroke="#c9d1d8" stroke-width="1.1"/><text x="642.00" y="622.00" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#14181c" font-weight="bold">WHAT IT COSTS AND BUYS</text><text x="642.00" y="650.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#14181c" font-weight="normal">Channel 3310T791, black powder-coated, 5 ft: $30.26 and 1.94 kg —</text><text x="642.00" y="664.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#14181c" font-weight="normal">against $197.07 for the bracket.</text><text x="642.00" y="686.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#14181c" font-weight="normal">The finish is BLACK, which is what the side panel is.</text><text x="642.00" y="708.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#14181c" font-weight="normal">Screen height becomes ADJUSTABLE after the fact — slide it in the</text><text x="642.00" y="722.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#14181c" font-weight="normal">slot. The hook's neck length is fixed at manufacture, and the height</text><text x="642.00" y="736.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#14181c" font-weight="normal">is currently a judgement call.</text><text x="642.00" y="758.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#14181c" font-weight="normal">Nothing touches the fridge top: no hinge cover, no corner radius, no</text><text x="642.00" y="772.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#14181c" font-weight="normal">arm, no pad budget. Four of the open pre-order measurements stop</text><text x="642.00" y="786.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#14181c" font-weight="normal">mattering.</text><text x="642.00" y="808.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#b00020" font-weight="normal">But the column is visible floor to screen, it stands in the room</text><text x="642.00" y="822.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#b00020" font-weight="normal">beside the fridge, and its foot goes under an appliance that has to</text><text x="642.00" y="836.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#b00020" font-weight="normal">come out to be cleaned.</text><rect x="40" y="928.0" width="1160.0" height="238" rx="6" fill="#fff" stroke="#b8860b" stroke-width="1.6"/><text x="62.00" y="956.00" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="start" fill="#b8860b" font-weight="bold">THE TRADE</text><text x="62.00" y="982.00" font-family="Helvetica,Arial,sans-serif" font-size="11.2" text-anchor="start" fill="#14181c" font-weight="bold">The strut is not stiff enough on its own.</text><text x="62.00" y="997.00" font-family="Helvetica,Arial,sans-serif" font-size="11.2" text-anchor="start" fill="#6b757e" font-weight="normal">Unpropped it sways 9.4 mm when you touch the screen — 585x the hook design. Low-profile channel is shallow and McMaster say outright</text><text x="62.00" y="1012.00" font-family="Helvetica,Arial,sans-serif" font-size="11.2" text-anchor="start" fill="#6b757e" font-weight="normal">it is not as strong as standard. Magnets at screen height fix it, and they take the press in PULL, their strong direction.</text><text x="62.00" y="1027.00" font-family="Helvetica,Arial,sans-serif" font-size="11.2" text-anchor="start" fill="#14181c" font-weight="bold">Free-standing is not an option.</text><text x="62.00" y="1042.00" font-family="Helvetica,Arial,sans-serif" font-size="11.2" text-anchor="start" fill="#6b757e" font-weight="normal">A 4 kg screen at 1.3 m tips the column under a touch press at every base depth a kitchen would tolerate — a 400 mm base still only</text><text x="62.00" y="1057.00" font-family="Helvetica,Arial,sans-serif" font-size="11.2" text-anchor="start" fill="#6b757e" font-weight="normal">reaches SF 0.33. Something has to hold it.</text><text x="62.00" y="1072.00" font-family="Helvetica,Arial,sans-serif" font-size="11.2" text-anchor="start" fill="#14181c" font-weight="bold">Putting the foot under the fridge is what rescues it.</text><text x="62.00" y="1087.00" font-family="Helvetica,Arial,sans-serif" font-size="11.2" text-anchor="start" fill="#6b757e" font-weight="normal">100 mm of foot under 229 lb of appliance gives SF 3.4, and the magnets go back to carrying nothing structural — the same invariant</text><text x="62.00" y="1102.00" font-family="Helvetica,Arial,sans-serif" font-size="11.2" text-anchor="start" fill="#6b757e" font-weight="normal">the hook is built on, reached from the other end.</text><text x="62.00" y="1117.00" font-family="Helvetica,Arial,sans-serif" font-size="11.2" text-anchor="start" fill="#14181c" font-weight="bold">What it really buys is ADJUSTABILITY, and what it really costs is presence.</text><text x="62.00" y="1132.00" font-family="Helvetica,Arial,sans-serif" font-size="11.2" text-anchor="start" fill="#6b757e" font-weight="normal">Screen height stops being a guess frozen at manufacture. In exchange there is a 1.5 m column standing in the kitchen where there is</text><text x="62.00" y="1147.00" font-family="Helvetica,Arial,sans-serif" font-size="11.2" text-anchor="start" fill="#6b757e" font-weight="normal">currently nothing visible at all.</text></svg>