<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1160" viewBox="0 0 1300 1160"><rect width="1300" height="1160" fill="#fbfcfd"/><rect width="1300" height="26" fill="#b8860b"/><text x="650.00" y="18.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#fff" font-weight="bold">CONCEPT — superseding the hook, pending the fridge base</text><text x="40.00" y="58.00" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#14181c" font-weight="bold">TWO STRUTS ON A BENT FOOT</text><text x="40.00" y="80.00" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#6b757e" font-weight="normal">A pair of 6 ft slotted struts up the side panel, tied at the base by one bent foot that slides under the fridge and is wedged so the appliance's own weight holds it down.</text><rect x="40.0" y="100.0" width="640.0" height="620.0" rx="6" fill="#fff" stroke="#c9d1d8" stroke-width="1.1"/><text x="62.00" y="126.00" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#14181c" font-weight="bold">SIDE — the load path</text><line x1="75.0" y1="690.0" x2="300.0" y2="690.0" stroke="#14181c" stroke-width="2"/><rect x="120.0" y="167.1" width="90.0" height="495.9" fill="#3a3734" stroke="#1f1d1b" stroke-width="1.2"/><text x="165.00" y="512.21" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#b0b6b9" font-weight="normal" transform="rotate(-90.0 165.00 512.21)">fridge</text><text x="165.00" y="676.20" font-family="Helvetica,Arial,sans-serif" font-size="7.5" text-anchor="middle" fill="#6b757e" font-weight="normal">base recess</text><rect x="211.8" y="141.3" width="18.6" height="548.7" fill="#8f9aa4" stroke="#14181c" stroke-width="1"/><rect x="217.7" y="661.2" width="6.7" height="4" fill="#14181c" fill-opacity="0.5"/><rect x="217.7" y="621.6" width="6.7" height="4" fill="#14181c" fill-opacity="0.5"/><rect x="217.7" y="582.0" width="6.7" height="4" fill="#14181c" fill-opacity="0.5"/><rect x="217.7" y="542.4" width="6.7" height="4" fill="#14181c" fill-opacity="0.5"/><rect x="217.7" y="502.8" width="6.7" height="4" fill="#14181c" fill-opacity="0.5"/><rect x="217.7" y="463.2" width="6.7" height="4" fill="#14181c" fill-opacity="0.5"/><rect x="217.7" y="423.6" width="6.7" height="4" fill="#14181c" fill-opacity="0.5"/><rect x="217.7" y="384.0" width="6.7" height="4" fill="#14181c" fill-opacity="0.5"/><rect x="217.7" y="344.4" width="6.7" height="4" fill="#14181c" fill-opacity="0.5"/><rect x="217.7" y="304.8" width="6.7" height="4" fill="#14181c" fill-opacity="0.5"/><rect x="217.7" y="265.2" width="6.7" height="4" fill="#14181c" fill-opacity="0.5"/><rect x="217.7" y="225.6" width="6.7" height="4" fill="#14181c" fill-opacity="0.5"/><rect x="217.7" y="186.0" width="6.7" height="4" fill="#14181c" fill-opacity="0.5"/><path d="M230.4 645.0 L230.4 685.8 L150.0 685.8 L150.0 690.0 L234.6 690.0 L234.6 645.0 Z" fill="#3f4b55" stroke="#14181c" stroke-width="1.2"/><path d="M159.0 685.2 L180.0 685.2 L180.0 673.2 Z" fill="#b8860b" fill-opacity="0.8" stroke="#7a5c00" stroke-width="0.9"/><path d="M183.0 685.2 L204.0 685.2 L204.0 673.2 Z" fill="#b8860b" fill-opacity="0.8" stroke="#7a5c00" stroke-width="0.9"/><rect x="206.4" y="329.7" width="5.4" height="12.0" fill="#e7b6dd" stroke="#c0169a" stroke-width="1"/><rect x="206.4" y="239.7" width="5.4" height="12.0" fill="#e7b6dd" stroke="#c0169a" stroke-width="1"/><rect x="206.4" y="474.0" width="5.4" height="12.0" fill="#e7b6dd" stroke="#c0169a" stroke-width="1"/><rect x="230.4" y="244.2" width="1.5" height="93.0" fill="#b9c2c9" stroke="#14181c" stroke-width="1"/><rect x="237.0" y="207.4" width="6.0" height="166.6" fill="#101820" stroke="#14181c" stroke-width="1"/><line x1="244.2" y1="207.4" x2="247.4" y2="207.4" stroke="#c9d1d8" stroke-width="0.8"/><line x1="244.2" y1="286.7" x2="247.4" y2="286.7" stroke="#c9d1d8" stroke-width="0.8"/><line x1="244.2" y1="331.7" x2="247.4" y2="331.7" stroke="#c9d1d8" stroke-width="0.8"/><line x1="244.2" y1="458.0" x2="247.4" y2="458.0" stroke="#c9d1d8" stroke-width="0.8"/><line x1="244.2" y1="641.0" x2="247.4" y2="641.0" stroke="#c9d1d8" stroke-width="0.8"/><line x1="244.2" y1="668.0" x2="247.4" y2="668.0" stroke="#c9d1d8" stroke-width="0.8"/><text x="251.37" y="211.39" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#6b757e" font-weight="bold">display</text><text x="251.37" y="290.68" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#14181c" font-weight="bold">plate — the SAME part</text><text x="251.37" y="335.68" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#c0169a" font-weight="bold">magnets, in PULL</text><text x="251.37" y="462.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#14181c" font-weight="bold">6 ft slotted strut x2</text><text x="251.37" y="645.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#0a8f6f" font-weight="bold">BENT FOOT ties both struts</text><text x="251.37" y="672.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#b8860b" font-weight="bold">wedges load the fridge onto it</text><rect x="700.0" y="100.0" width="560.0" height="620.0" rx="6" fill="#fff" stroke="#c9d1d8" stroke-width="1.1"/><text x="722.00" y="126.00" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#14181c" font-weight="bold">FRONT — looking at the side panel</text><line x1="845.0" y1="690.0" x2="1070.0" y2="690.0" stroke="#14181c" stroke-width="2"/><rect x="848.0" y="167.1" width="174.0" height="495.9" fill="#3a3734" stroke="#1f1d1b" stroke-width="1.2"/><rect x="883.8" y="141.3" width="12.4" height="548.7" fill="#8f9aa4" stroke="#14181c" stroke-width="1"/><rect x="957.6" y="141.3" width="12.4" height="548.7" fill="#8f9aa4" stroke="#14181c" stroke-width="1"/><rect x="880.4" y="645.0" width="93.0" height="45.0" fill="#3f4b55" stroke="#14181c" stroke-width="1.2"/><rect x="880.4" y="244.2" width="93.0" height="93.0" fill="#b9c2c9" fill-opacity="0.55" stroke="#14181c" stroke-width="1.2"/><text x="926.90" y="290.68" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#14181c" font-weight="bold">plate 310 x 310</text><text x="926.90" y="303.68" font-family="Helvetica,Arial,sans-serif" font-size="8" text-anchor="middle" fill="#6b757e" font-weight="normal">bolts at its 4 magnet holes</text><text x="926.90" y="666.00" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="bold">one bent foot, both struts</text><text x="926.90" y="240.00" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="middle" fill="#b0b6b9" font-weight="normal">246 mm apart</text><rect x="40.0" y="746.0" width="640.0" height="380.0" rx="6" fill="#fff" stroke="#c9d1d8" stroke-width="1.1"/><text x="62.00" y="772.00" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#14181c" font-weight="bold">THE NUMBERS</text><text x="64.00" y="804.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">Strength, foot</text><text x="64.00" y="819.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">29.6 N·m over a 310 mm foot</text><text x="656.00" y="804.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end" fill="#0a8f6f" font-weight="bold">SF 10</text><text x="64.00" y="850.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">Strength, strut</text><text x="64.00" y="865.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">41 MPa in the pull direction</text><text x="656.00" y="850.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end" fill="#0a8f6f" font-weight="bold">SF 6.1</text><text x="64.00" y="896.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">Torsion, edge press</text><text x="64.00" y="911.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">812 lb·mm over 246 mm spacing</text><text x="656.00" y="896.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end" fill="#0a8f6f" font-weight="bold">3.3 lb per strut</text><text x="64.00" y="942.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">Magnets, propping</text><text x="64.00" y="957.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">5 lb of PULL shared over 4</text><text x="656.00" y="942.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end" fill="#0a8f6f" font-weight="bold">1.25 lb each</text><text x="64.00" y="988.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">Sway if UNPROPPED</text><text x="64.00" y="1003.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">4.7 mm at the screen</text><text x="656.00" y="988.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end" fill="#b00020" font-weight="bold">magnets fix this, not the foot</text><text x="64.00" y="1042.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#b8860b" font-weight="bold">THE WEDGE — what it actually has to do</text><text x="84.00" y="1062.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#6b757e" font-weight="normal">wedge 100 mm inboard  -&gt;   66.6 lb on the foot, 29% of the appliance</text><text x="84.00" y="1077.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#6b757e" font-weight="normal">wedge 150 mm inboard  -&gt;   44.4 lb on the foot, 19% of the appliance</text><text x="84.00" y="1092.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#6b757e" font-weight="normal">wedge 200 mm inboard  -&gt;   33.3 lb on the foot, 15% of the appliance</text><text x="84.00" y="1107.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#6b757e" font-weight="normal">wedge 250 mm inboard  -&gt;   26.6 lb on the foot, 12% of the appliance</text><rect x="700.0" y="746.0" width="560.0" height="380.0" rx="6" fill="#fff" stroke="#c9d1d8" stroke-width="1.1"/><text x="722.00" y="772.00" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#14181c" font-weight="bold">WHAT IS SETTLED AND WHAT IS NOT</text><text x="724.00" y="800.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">SETTLED by geometry</text><text x="736.00" y="818.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">Strut orientation is forced: flat back on the panel, slots</text><text x="736.00" y="831.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">out. That is also the good one — a wide flat magnet bearing.</text><text x="736.00" y="849.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">The plate bolts on UNMODIFIED. Its four O8.5 magnet holes are</text><text x="736.00" y="862.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">246 mm apart, which is the strut spacing, and O8.5 clears a</text><text x="736.00" y="875.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">5/16 channel bolt.</text><text x="736.00" y="893.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">The foot is the same process as the hook: laser plus ONE 90</text><text x="736.00" y="906.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">degree bend, same material, same supplier.</text><text x="724.00" y="932.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#b00020" font-weight="bold">OPEN — needs the fridge</text><text x="736.00" y="950.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">How high the cabinet base sits off the floor: that is the foot</text><text x="736.00" y="963.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">plus wedge budget.</text><text x="736.00" y="981.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">Whether wedging a fifth of the appliance onto the foot rocks</text><text x="736.00" y="994.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">it or dents the base pan. Wedging is uncontrolled by nature —</text><text x="736.00" y="1007.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">how hard someone drove it is not a designable quantity.</text><text x="736.00" y="1025.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">So the wedge is BACKUP. The magnets carry the case on their</text><text x="736.00" y="1038.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">own, in pull, at 49x.</text></svg>