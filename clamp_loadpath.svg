<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700"><rect width="1180" height="700" fill="#fbfcfd"/><rect width="1180" height="24" fill="#b8860b"/><text x="590.00" y="16.50" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">LOAD PATH — the whole argument for this design in one drawing</text><text x="40.00" y="56.00" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#14181c" font-weight="bold">WHERE THE WEIGHT ACTUALLY GOES</text><text x="40.00" y="78.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#6b757e" font-weight="normal">Straight down the strut, into the foot, into the floor. The clamps do not carry it — they only stop the top falling away from the wall.</text><rect x="40.0" y="100.0" width="700.0" height="500.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">SIDE VIEW, TO SCALE</text><rect x="250.0" y="145.5" width="81.6" height="440.7" fill="#3a3734"/><rect x="341.6" y="123.7" width="14" height="466.3" fill="#8f9aa4" stroke="#14181c"/><line x1="160.0" y1="590.0" x2="531.6" y2="590.0" stroke="#14181c" stroke-width="2.5"/><rect x="387.6" y="179.8" width="26.0" height="141.6" fill="#101820" fill-opacity="0.10" stroke="#14181c" stroke-width="1.4" stroke-dasharray="7 4"/><text x="400.60" y="250.60" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#6b757e" font-weight="bold">display</text><line x1="348.6" y1="250.6" x2="348.6" y2="294.6" stroke="#0a8f6f" stroke-width="3"/><path d="M343.6 288.6 L348.6 298.6 L353.6 288.6" fill="#0a8f6f"/><line x1="348.6" y1="310.6" x2="348.6" y2="354.6" stroke="#0a8f6f" stroke-width="3"/><path d="M343.6 348.6 L348.6 358.6 L353.6 348.6" fill="#0a8f6f"/><line x1="348.6" y1="370.6" x2="348.6" y2="414.6" stroke="#0a8f6f" stroke-width="3"/><path d="M343.6 408.6 L348.6 418.6 L353.6 408.6" fill="#0a8f6f"/><line x1="348.6" y1="430.6" x2="348.6" y2="474.6" stroke="#0a8f6f" stroke-width="3"/><path d="M343.6 468.6 L348.6 478.6 L353.6 468.6" fill="#0a8f6f"/><line x1="348.6" y1="490.6" x2="348.6" y2="534.6" stroke="#0a8f6f" stroke-width="3"/><path d="M343.6 528.6 L348.6 538.6 L353.6 528.6" fill="#0a8f6f"/><text x="401.60" y="411.50" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">the load runs DOWN the strut</text><text x="401.60" y="421.70" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#0a8f6f" font-weight="normal">and into the floor, not the fridge</text><path d="M311.6 145.5 L337.6 145.5" stroke="#b8860b" stroke-width="2.5"/><path d="M331.6 140.5 L339.6 145.5 L331.6 150.5" fill="#b8860b"/><text x="363.60" y="137.52" font-family="Helvetica,Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#b8860b" font-weight="bold">top clamp — HOLDS IN, carries nothing</text><path d="M311.6 586.2 L337.6 586.2" stroke="#b8860b" stroke-width="2.5"/><path d="M331.6 581.2 L339.6 586.2 L331.6 591.2" fill="#b8860b"/><text x="363.60" y="578.17" font-family="Helvetica,Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#b8860b" font-weight="bold">lower clamp — HOLDS IN, carries nothing</text><rect x="335.6" y="583.0" width="74" height="7" fill="#4a545e" stroke="#14181c" stroke-width="0.9"/><text x="415.60" y="578.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#0a8f6f" font-weight="bold">FOOT</text><text x="310.00" y="572.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#14181c" font-weight="bold">FLOOR — takes all 154 N</text><rect x="760.0" y="100.0" width="380.0" height="500.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="776.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">WHAT THAT BUYS</text><text x="776.00" y="146.00" font-family="Helvetica,Arial,sans-serif" font-size="11.0" text-anchor="start" fill="#0a8f6f" font-weight="bold">No magnets at all</text><text x="776.00" y="163.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">the derate chain, the fastener stack, the</text><text x="776.00" y="175.50" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">peel failure mode and the dependency on a</text><text x="776.00" y="188.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">magnetic panel all vanish together.</text><text x="776.00" y="238.00" font-family="Helvetica,Arial,sans-serif" font-size="11.0" text-anchor="start" fill="#0a8f6f" font-weight="bold">A non-magnetic panel stops mattering</text><text x="776.00" y="255.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">stainless, plastic, painted — the clamp does</text><text x="776.00" y="267.50" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">not care what the fridge is made of.</text><text x="776.00" y="330.00" font-family="Helvetica,Arial,sans-serif" font-size="11.0" text-anchor="start" fill="#0a8f6f" font-weight="bold">Nothing creeps</text><text x="776.00" y="347.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">sustained shear on paint was the slow</text><text x="776.00" y="359.50" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">failure the magnets had. There is no</text><text x="776.00" y="372.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">sustained shear here.</text><text x="776.00" y="422.00" font-family="Helvetica,Arial,sans-serif" font-size="11.0" text-anchor="start" fill="#0a8f6f" font-weight="bold">Height became adjustable</text><text x="776.00" y="439.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">the foot's slot sets it, after the thing is</text><text x="776.00" y="451.50" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">built, against a real person standing there.</text><text x="776.00" y="514.00" font-family="Helvetica,Arial,sans-serif" font-size="11.0" text-anchor="start" fill="#0a8f6f" font-weight="bold">The failure mode changed</text><text x="776.00" y="531.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">the magnet design's worst case was bonded</text><text x="776.00" y="543.50" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">glass on the floor. This one's is a wobble.</text></svg>