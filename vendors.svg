<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="590" viewBox="0 0 1180 590"><rect width="1180" height="590" fill="#f7f8fa"/><rect width="1180" height="26" fill="#8a1c1c"/><text x="590.0" y="18.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">REFERENCE ONLY — dated instant quotes on the SAME file, qty 1. Nothing is in a cart.</text><text x="40.0" y="62.0" font-family="Helvetica, Arial, sans-serif" font-size="21" text-anchor="start" fill="#111" font-weight="bold">COMPARISON SHOP — strut/dxf/H_hook_plate.dxf, 310 x 742.03 mm, 0.119 in steel</text><text x="40.0" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#5b6166" font-weight="normal">Running totals as each service is added, the way the configurators show them. The part the design needs is the bent, coated one; a vendor that cannot bend from a DXF is not a complete option.</text><text x="40.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="bold">VENDOR</text><text x="190.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="bold">MATERIAL</text><text x="470.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="bold">CUT + DEBURR</text><text x="560.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="bold">+ 1 BEND</text><text x="650.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="bold">+ BLACK COAT</text><text x="750.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="bold">LEAD TIME</text><line x1="40" y1="128" x2="1140" y2="128" stroke="#d0d4d8"/><rect x="30" y="136" width="1120" height="70" rx="6" fill="#0b7a4b" fill-opacity="0.08"/><text x="40.0" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#111" font-weight="bold">SendCutSend</text><text x="190.0" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">A36/1008 mild steel 0.119 in CRS</text><text x="470.0" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111" font-weight="bold">$104.82</text><text x="560.0" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111" font-weight="bold">$116.59</text><text x="650.0" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111" font-weight="bold">$187.20</text><text x="750.0" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="9.4" text-anchor="start" fill="#111" font-weight="normal">arrives Sep 10 bent, Sep 14 coated</text><text x="190.0" y="174.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" text-anchor="start" fill="#5b6166" font-weight="normal">2026-09-02: dashed bend line in the DXF read as 1 bend; all powder colours priced the same; $132.60 ea at qty 2; deburring included</text><text x="40.0" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#111" font-weight="bold">OSH Cut</text><text x="190.0" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">A36 HR P&amp;O 0.12 in</text><text x="470.0" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111" font-weight="bold">$110.76</text><text x="560.0" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111" font-weight="bold">$110.76</text><text x="650.0" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111" font-weight="bold">$204.26</text><text x="750.0" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="9.4" text-anchor="start" fill="#111" font-weight="normal">4 business days; 8 with coat; STANDBY tier</text><text x="750.0" y="260.0" font-family="Helvetica, Arial, sans-serif" font-size="9.4" text-anchor="start" fill="#111" font-weight="normal">$60.93 bent (no promised date)</text><text x="190.0" y="280.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" text-anchor="start" fill="#5b6166" font-weight="normal">2026-09-02: bend priced INTO the cut figure (bend line drawn in their app, not from the DXF); Black Satin Texture; bend spec inner R 0.105 in, deduction 0.200 in, K</text><text x="190.0" y="293.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" text-anchor="start" fill="#5b6166" font-weight="normal">0.45 — differs from SendCutSend&#x27;s 0.1955 in, so the flat pattern would be regenerated for them</text><text x="40.0" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#111" font-weight="bold">Fabworks</text><text x="190.0" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">Steel 1008 0.119 in</text><text x="470.0" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111" font-weight="bold">$90.63</text><text x="560.0" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#5b6166" font-weight="bold">cannot</text><text x="650.0" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#5b6166" font-weight="bold">$112.12 (flat)</text><text x="750.0" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="9.4" text-anchor="start" fill="#111" font-weight="normal">not read — guest quote #26-09-5704</text><text x="190.0" y="358.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" text-anchor="start" fill="#5b6166" font-weight="normal">2026-09-02: FLAT ONLY from a DXF: their bending needs a STEP model, and a DXF with the dashed bend line is rejected as an open contour. $112.12 is the flat coated</text><text x="190.0" y="371.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" text-anchor="start" fill="#5b6166" font-weight="normal">plate (Textured Black); the bend would be yours to do — not an option on 0.119 in steel at 310 mm wide</text><text x="40.0" y="440.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="bold">NOT QUOTED</text><text x="52.0" y="456.0" font-family="Helvetica, Arial, sans-serif" font-size="9.4" text-anchor="start" fill="#111" font-weight="normal">Xometry — account wall before a price; sheet-metal quotes reported 2-5x OSH Cut for one-offs</text><text x="52.0" y="472.0" font-family="Helvetica, Arial, sans-serif" font-size="9.4" text-anchor="start" fill="#111" font-weight="normal">Protolabs Network (Hubs) — account wall; minimum-order oriented, no instant DXF-with-bend flow</text><text x="52.0" y="488.0" font-family="Helvetica, Arial, sans-serif" font-size="9.4" text-anchor="start" fill="#111" font-weight="normal">Fictiv — account wall; production-oriented</text><text x="52.0" y="504.0" font-family="Helvetica, Arial, sans-serif" font-size="9.4" text-anchor="start" fill="#111" font-weight="normal">eMachineShop — needs its own CAD app for a quote; no DXF instant path</text><text x="40.0" y="534.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#111" font-weight="normal">Bent + coated: SendCutSend $187.20 vs OSH Cut $204.26 standard ($17.06 apart). Bent, bare: OSH Cut $110.76 vs SendCutSend $116.59.</text><text x="40.0" y="550.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#111" font-weight="normal">OSH Cut&#x27;s standby tier at $60.93 bent is the cheapest complete part anywhere, at the cost of no promised date.</text><text x="40.0" y="568.0" font-family="Helvetica, Arial, sans-serif" font-size="9.6" text-anchor="start" fill="#5b6166" font-weight="normal">The clamp parts (design 2) and the strut plate were not re-shopped; they were only ever quoted at SendCutSend and would follow the same pattern.</text></svg>