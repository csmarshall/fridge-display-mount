<text x="40.00" y="78.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#555" font-weight="normal">5052-H32. Strength is never the limit — safety factors stay above 15x across the whole range. Stiffness is what you feel, and it scales as 1/t³.</text>
