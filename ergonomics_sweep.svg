<text x="40.00" y="791.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#333" font-weight="normal">Solid black = landscape. Dashed red = portrait. Green band = heights comfortable for BOTH statures (taller person's elbow to shorter person's eye).</text>
<text x="40.00" y="807.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#333" font-weight="normal">Screen centre = VESA centre = body centre, so it does not move between orientations — one drop serves both. Portrait simply extends further above and below it.</text>
<text x="40.00" y="823.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#777" font-weight="normal">Eye/elbow heights derived from stature (eye 0.936, elbow 0.630). Fridge height is the published LG figure — measure yours before committing.</text>
