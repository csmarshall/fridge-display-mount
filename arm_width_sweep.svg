<text x="40.00" y="621.38" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#333" font-weight="normal">Clear window between keep-outs is 621 mm on a 851 mm deep top — both keep-outs are ESTIMATES and are on the pre-order measurement checklist.</text>
<text x="40.00" y="636.38" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#333" font-weight="normal">With working magnets on the body this case never arises — they carry the torsion. This is the fallback: 304 stainless panel, or a magnet that lets go.</text>
<text x="40.00" y="651.38" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#777" font-weight="normal">Arm magnet hold-down assumed 4.6 lbf (one magnet, already derated 35% for thin painted sheet). Arm width does not widen the sheet: the body is already 310 mm.</text>
