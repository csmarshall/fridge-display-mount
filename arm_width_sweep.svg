<text x="40.00" y="520.03" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#333" font-weight="normal">Clear window between keep-outs is 296 mm on a 610 mm deep counter-depth top — the hinge cover is MEASURED; the rear step-down is still an ESTIMATE and is on the pre-order measurement checklist.</text>
<text x="40.00" y="535.03" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#333" font-weight="normal">With working magnets on the body this case never arises — they carry the torsion. This is the fallback: 304 stainless panel, or a magnet that lets go.</text>
<text x="40.00" y="550.03" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#777" font-weight="normal">Arm magnet hold-down assumed 4.6 lbf (one magnet, already derated 35% for thin painted sheet). Arm width does not widen the sheet: the body is already 310 mm.</text>
