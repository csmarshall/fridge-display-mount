<text x="650.00" y="21.00" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">REFERENCE ONLY — arm width study, not a fabrication drawing</text>
<text x="40.00" y="54.00" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="start" fill="#111" font-weight="bold">Arm / neck width — plan view, looking DOWN on the fridge top</text>
<text x="40.00" y="72.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#555" font-weight="normal">Touch press 5 lbf at 162 mm = 32.0 in·lbf about the vertical spine. At the hook that is a couple across the arm width: one end lifts, the other presses in.</text>
<text x="40.00" y="88.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#555" font-weight="normal">Lift demand = 32.0 in·lbf / arm width. Hold-down = half the assembly weight + one arm retention magnet. Governing case is a NON-MAGNETIC panel, where the body magnets contribute nothing.</text>
