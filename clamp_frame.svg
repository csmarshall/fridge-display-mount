rect x="204.5" y="793.0" width="26.8" height="7" fill="#4a545e" stroke="#14181c" stroke-width="1"/><rect x="353.1" y="152.7" width="24.8" height="647.3" fill="#8f9aa4" stroke="#14181c" stroke-width="1.2"/><rect x="362.9" y="776.2" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="362.9" y="745.7" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="362.9" y="715.2" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="362.9" y="684.7" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="362.9" y="647.1" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="362.9" y="616.6" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="362.9" y="586.1" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="362.9" y="555.6" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="362.9" y="525.1" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="362.9" y="494.7" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="362.9" y="464.2" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="362.9" y="433.7" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="362.9" y="403.2" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="362.9" y="372.7" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="362.9" y="342.3" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="362.9" y="311.8" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="362.9" y="281.3" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="362.9" y="250.8" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="362.9" y="220.3" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="362.9" y="189.9" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="362.9" y="159.4" width="5.2" height="17.2" fill="#14181c" fill-opacity="0.4"/><rect x="352.1" y="793.0" width="26.8" height="7" fill="#4a545e" stroke="#14181c" stroke-width="1"/><rect x="201.4" y="197.2" width="180.6" height="14" rx="2" fill="#4a545e" stroke="#14181c" stroke-width="1.3"/><text x="291.66" y="208.16" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">TOP BAR</text><circle cx="217.9" cy="204.2" r="3.1" fill="#fbfcfd" stroke="#14181c" stroke-width="1"/><circle cx="365.5" cy="204.2" r="3.1" fill="#fbfcfd" stroke="#14181c" stroke-width="1"/><rect x="201.4" y="784.0" width="180.6" height="14" rx="2" fill="#4a545e" stroke="#14181c" stroke-width="1.3"/><text x="291.66" y="795.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">BOTTOM BAR</text><circle cx="217.9" cy="791.0" r="3.1" fill="#fbfcfd" stroke="#14181c" stroke-width="1"/><circle cx="365.5" cy="791.0" r="3.1" fill="#fbfcfd" stroke="#14181c" stroke-width="1"/><rect x="194.3" y="284.8" width="194.8" height="333.1" fill="#101820" fill-opacity="0.10" stroke="#14181c" stroke-width="1.4" stroke-dasharray="7 4"/><text x="291.66" y="451.40" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#6b757e" font-weight="bold"></text><text x="529.76" y="621.97" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">display 324.65 wide</text><text x="529.76" y="632.97" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="start" fill="#6b757e" font-weight="normal">dashed, true scale</text><path d="M126.0 686.0 L332.9 672.0 L539.8 686.0" fill="none" stroke="#fbfcfd" stroke-width="9"/><path d="M126.0 686.0 L332.9 672.0 L539.8 686.0" fill="none" stroke="#b00020" stroke-width="1.5"/><text x="544.56" y="682.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="start" fill="#b00020" font-weight="bold">BREAK — 750 mm</text><line x1="217.9" y1="834.0" x2="365.5" y2="834.0" stroke="#0a8f6f" stroke-width="1.1"/><line x1="217.9" y1="830.0" x2="217.9" y2="838.0" stroke="#0a8f6f" stroke-width="1.1"/><line x1="365.5" y1="830.0" x2="365.5" y2="838.0" stroke="#0a8f6f" stroke-width="1.1"/><text x="291.66" y="828.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#0a8f6f" font-weight="bold">246 strut centres</text><line x1="201.4" y1="866.0" x2="382.0" y2="866.0" stroke="#14181c" stroke-width="1.1"/><line x1="201.4" y1="862.0" x2="201.4" y2="870.0" stroke="#14181c" stroke-width="1.1"/><line x1="382.0" y1="862.0" x2="382.0" y2="870.0" stroke="#14181c" stroke-width="1.1"/><text x="291.66" y="860.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#14181c" font-weight="bold">301 bar</text><text x="291.66" y="888.00" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="middle" fill="#6b757e" font-weight="normal">both bars are the SAME part — the lower one is flipped</text><rect x="690.0" y="100.0" width="240.0" height="800.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="706.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#b8860b" font-weight="bold">TRUE SCALE</text><text x="706.00" y="146.00" font-family="Helvetica,Arial,sans-serif" font-size="9.4" text-anchor="start" fill="#6b757e" font-weight="normal">The strut IS taller. It stands</text><text x="706.00" y="157.50" font-family="Helvetica,Arial,sans-serif" font-size="9.4" text-anchor="start" fill="#6b757e" font-weight="normal">85.7 mm above the case and 49.2</text><text x="706.00" y="169.00" font-family="Helvetica,Arial,sans-serif" font-size="9.4" text-anchor="start" fill="#6b757e" font-weight="normal">mm above the hinge covers —</text><text x="706.00" y="180.50" font-family="Helvetica,Arial,sans-serif" font-size="9.4" text-anchor="start" fill="#6b757e" font-weight="normal">about 1.9 in of channel showing</text><text x="706.00" y="192.00" font-family="Helvetica,Arial,sans-serif" font-size="9.4" text-anchor="start" fill="#6b757e" font-weight="normal">over the top.</text><line x1="723.0" y1="866.0" x2="895.0" y2="866.0" stroke="#14181c" stroke-width="2"/><rect x="745.0" y="284.6" width="58" height="581.4" fill="#3a3734" stroke="#2b2926"/><rect x="751.0" y="272.4" width="26" height="12.2" fill="#5c574f" stroke="#2b2926"/><text x="774.00" y="852.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#e8e2d8" font-weight="bold">FRIDGE</text><rect x="819.0" y="256.0" width="15" height="610.0" fill="#8f9aa4" stroke="#14181c"/><text x="826.00" y="852.00" font-family="Helvetica,Arial,sans-serif" font-size="8.0" text-anchor="middle" fill="#14181c" font-weight="bold" transform="rotate(-90.0 826.00 852.00)">STRUT</text><line x1="725.0" y1="284.6" x2="841.0" y2="284.6" stroke="#2b2926" stroke-width="1" stroke-dasharray="4 3"/><text x="845.00" y="287.59" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="start" fill="#2b2926" font-weight="bold">case 1743.1</text><line x1="725.0" y1="272.4" x2="841.0" y2="272.4" stroke="#5c574f" stroke-width="1" stroke-dasharray="4 3"/><text x="845.00" y="275.42" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="start" fill="#5c574f" font-weight="bold">covers 1779.6</text><line x1="725.0" y1="256.0" x2="841.0" y2="256.0" stroke="#0a8f6f" stroke-width="1" stroke-dasharray="4 3"/><text x="845.00" y="259.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="start" fill="#0a8f6f" font-weight="bold">strut 1828.8</text><line x1="815.0" y1="284.6" x2="815.0" y2="256.0" stroke="#0a8f6f" stroke-width="2"/><rect x="945.0" y="100.0" width="435.0" height="390.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="961.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">WHY THIS VIEW EXISTS</text><text x="961.00" y="146.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">Every other sheet is a side elevation, a plan or a</text><text x="961.00" y="159.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">flat pattern. A side view shows ONE strut, so none of</text><text x="961.00" y="172.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">them can show the two struts tied together — which is</text><text x="961.00" y="185.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">the whole structural idea. This is that view.</text><text x="961.00" y="226.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">The two bars are the SAME part, 301 mm across,</text><text x="961.00" y="239.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">reaching past both struts by 27.5 mm each side for</text><text x="961.00" y="252.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">edge margin. That is what turns two independent legs</text><text x="961.00" y="265.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">into a frame. Widening the individual parts instead</text><text x="961.00" y="278.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">would add steel that is not joined to anything at its</text><text x="961.00" y="291.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">far end, and the couple arm would stay the strut</text><text x="961.00" y="304.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">spacing regardless.</text><text x="961.00" y="350.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">The plate is 297 x 152 and reaches 25.3 mm past each</text><text x="961.00" y="363.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">strut. It is no longer square: it was, only so it</text><text x="961.00" y="376.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">could hide behind the display in EITHER orientation,</text><text x="961.00" y="389.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">and landscape is impossible on this cabinet.</text><rect x="945.0" y="510.0" width="435.0" height="390.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="961.00" y="534.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">THE NUMBERS IN THIS VIEW</text><rect x="957" y="533.0" width="411" height="26" fill="#f2f5f7"/><text x="969.00" y="550.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="normal">strut centres</text><text x="1356.00" y="550.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="end" fill="#14181c" font-weight="bold">246 mm</text><text x="969.00" y="579.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="normal">bar across</text><text x="1356.00" y="579.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="end" fill="#14181c" font-weight="bold">301 mm</text><rect x="957" y="591.0" width="411" height="26" fill="#f2f5f7"/><text x="969.00" y="608.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="normal">bar overhang past each strut</text><text x="1356.00" y="608.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="end" fill="#14181c" font-weight="bold">27.5 mm</text><text x="969.00" y="637.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="normal">plate</text><text x="1356.00" y="637.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="end" fill="#14181c" font-weight="bold">297 x 152 mm</text><rect x="957" y="649.0" width="411" height="26" fill="#f2f5f7"/><text x="969.00" y="666.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="normal">plate past each strut</text><text x="1356.00" y="666.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="end" fill="#14181c" font-weight="bold">25.3 mm</text><text x="969.00" y="695.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="normal">display, portrait</text><text x="1356.00" y="695.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="end" fill="#14181c" font-weight="bold">324.65 x 555 mm</text><rect x="957" y="707.0" width="411" height="26" fill="#f2f5f7"/><text x="969.00" y="724.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="normal">bars (identical parts)</text><text x="1356.00" y="724.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="end" fill="#14181c" font-weight="bold">2</text><text x="969.00" y="753.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="normal">feet</text><text x="1356.00" y="753.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="end" fill="#14181c" font-weight="bold">2</text><rect x="957" y="765.0" width="411" height="26" fill="#f2f5f7"/><text x="969.00" y="782.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="normal">strut proud of the case</text><text x="1356.00" y="782.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="end" fill="#14181c" font-weight="bold">85.7 mm</text><text x="969.00" y="811.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="normal">strut proud of the covers</text><text x="1356.00" y="811.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="end" fill="#14181c" font-weight="bold">49.2 mm</text><rect x="957" y="823.0" width="411" height="26" fill="#f2f5f7"/><text x="969.00" y="840.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="normal">clear window on the top</text><text x="1356.00" y="840.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="end" fill="#14181c" font-weight="bold">406.6 mm</text><text x="969.00" y="869.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="normal">bar to hinge cover</text><text x="1356.00" y="869.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="end" fill="#14181c" font-weight="bold">20.0 mm</text></svg>