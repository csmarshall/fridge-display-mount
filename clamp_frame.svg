<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="940" viewBox="0 0 1420 940"><rect width="1420" height="940" fill="#fbfcfd"/><rect width="1420" height="24" fill="#b8860b"/><text x="710.00" y="16.50" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">FRONT ELEVATION — the assembly as a whole</text><text x="40.00" y="56.00" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#14181c" font-weight="bold">THE FRAME, SEEN FROM THE FRONT</text><text x="40.00" y="78.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#6b757e" font-weight="normal">Looking straight at the fridge's side panel. Two struts, tied top and bottom by IDENTICAL bars. This is the only view that shows it as one frame.</text><rect x="40.0" y="100.0" width="620.0" height="800.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">LOOKING AT THE SIDE PANEL</text><line x1="108.0" y1="800.0" x2="564.0" y2="800.0" stroke="#14181c" stroke-width="2.5"/><rect x="150.0" y="204.2" width="365.8" height="586.8" fill="#3a3734" stroke="#2b2926" stroke-width="1.2"/><rect x="394.0" y="182.6" width="121.8" height="21.6" fill="#5c574f" stroke="#2b2926" stroke-width="0.9"/><text x="454.86" y="188.16" font-family="Helvetica,Arial,sans-serif" font-size="7.6" text-anchor="middle" fill="#bdb6ab" font-weight="normal">hinge cover</text><text x="168.00" y="350.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#8d867d" font-weight="normal" transform="rotate(-90.0 168.00 350.00)">FRIDGE SIDE PANEL</text><rect x="202.7" y="405.7" width="178.0" height="91.3" fill="#b9c2c9" fill-opacity="0.9" stroke="#14181c" stroke-width="1.1"/><text x="291.66" y="393.80" font-family="Helvetica,Arial,sans-serif" font-size="9.2" text-anchor