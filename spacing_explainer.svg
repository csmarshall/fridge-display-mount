<text x="80.0" y="531.8" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#14181c" font-weight="normal">Spacing is centre-to-centre between opposite corner magnets. A bigger disc needs a bigger inset from the edge,</text>
<text x="80.0" y="550.8" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#14181c" font-weight="normal">so BOTH spacings shrink as the disc grows. The plate is 310 wide but only 310 tall, so Y always runs out first.</text>
