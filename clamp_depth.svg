<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="880" viewBox="0 0 1420 880"><rect width="1420" height="880" fill="#fbfcfd"/><rect width="1420" height="24" fill="#b8860b"/><text x="710.00" y="16.50" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">DEPTH STUDY — the same parts, arranged two ways</text><text x="40.00" y="56.00" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#14181c" font-weight="bold">COULD THE STRUTS SIT BESIDE THE BOX, NOT BEHIND IT?</text><text x="40.00" y="78.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#6b757e" font-weight="normal">Plan view — looking DOWN at the fridge from above. Depth runs left to right; front-to-back along the fridge runs up the page.</text><rect x="40.0" y="100.0" width="620.0" height="480.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">A — AS BUILT: strut BEHIND the box, depths ADD</text><rect x="84.0" y="179.0" width="16" height="306.0" fill="#3a3734"/><text x="76.00" y="332.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="end" fill="#6b757e" font-weight="normal" transform="rotate(-90.0 76.00 332.00)">FRIDGE</text><rect x="100.0" y="270.8" width="36.2" height="122.4" fill="#f8e2a4" stroke="#c9a227" stroke-width="0.8"/><rect x="136.2" y="392.5" width="82.5" height="42.1" fill="#8f9aa4" stroke="#14181c" stroke-width="1.2"/><rect x="136.2" y="229.3" width="82.5" height="42.1" fill="#8f9aa4" stroke="#14181c" stroke-width="1.2"/><text x="177.46" y="235.40" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="middle" fill="#14181c" font-weight="bold">STRUT</text><rect x="218.7" y="224.6" width="12.1" height="214.8" fill="#b9c2c9" stroke="#14181c" stroke-width="1"/><line x1="224.8" y1="224.6" x2="224.8" y2="180.0" stroke="#14181c" stroke-width="0.7"/><text x="224.78" y="176.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="middle" fill="#14181c" font-weight="bold">PLATE — in front of the struts</text><rect x="230.8" y="263.7" width="100.0" height="136.7" fill="#2b3440" stroke="#14181c" stroke-width="1.2"/><text x="280.82" y="336.00" font-family="Helvetica,Arial,sans-serif" font-size="8.0" text-anchor="middle" fill="#fff" font-weight="bold">BOX</text><rect x="330.8" y="166.4" width="72.0" height="331.1" fill="#101820" stroke="#14181c" stroke-width="1.2"/><text x="366.82" y="332.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold" transform="rotate(-90.0 366.82 332.00)">DISPLAY</text><line x1="100.0" y1="527.6" x2="402.8" y2="527.6" stroke="#14181c" stroke-width="1.6"/><line x1="100.0" y1="522.6" x2="100.0" y2="532.6" stroke="#14181c" stroke-width="1.6"/><line x1="402.8" y1="522.6" x2="402.8" y2="532.6" stroke="#14181c" stroke-width="1.6"/><text x="251.41" y="518.57" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#14181c" font-weight="bold">75.7 mm off the fridge</text><text x="350.00" y="562.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#6b757e" font-weight="normal">depth exaggerated 4x; front-to-back true scale</text><rect x="700.0" y="100.0" width="620.0" height="480.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="716.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">B — NESTED: strut BESIDE the box, depths SHARE</text><rect x="744.0" y="179.0" width="16" height="306.0" fill="#3a3734"/><text x="736.00" y="332.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="end" fill="#6b757e" font-weight="normal" transform="rotate(-90.0 736.00 332.00)">FRIDGE</text><rect x="760.0" y="270.8" width="36.2" height="122.4" fill="#f8e2a4" stroke="#c9a227" stroke-width="0.8"/><rect x="784.1" y="211.6" width="12.1" height="240.7" fill="#b9c2c9" stroke="#14181c" stroke-width="1"/><line x1="790.1" y1="207.6" x2="790.1" y2="180.0" stroke="#14181c" stroke-width="0.7"/><text x="796.18" y="176.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="middle" fill="#14181c" font-weight="bold">PLATE — behind the struts</text><rect x="796.2" y="403.4" width="82.5" height="42.1" fill="#8f9aa4" stroke="#14181c" stroke-width="1.2"/><rect x="796.2" y="218.5" width="82.5" height="42.1" fill="#8f9aa4" stroke="#14181c" stroke-width="1.2"/><text x="837.46" y="224.55" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="middle" fill="#14181c" font-weight="bold">STRUT</text><rect x="796.2" y="263.7" width="100.0" height="136.7" fill="#2b3440" stroke="#14181c" stroke-width="1.2"/><text x="846.18" y="336.00" font-family="Helvetica,Arial,sans-serif" font-size="8.0" text-anchor="middle" fill="#fff" font-weight="bold">BOX</text><rect x="896.2" y="166.4" width="72.0" height="331.1" fill="#101820" stroke="#14181c" stroke-width="1.2"/><text x="932.18" y="332.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold" transform="rotate(-90.0 932.18 332.00)">DISPLAY</text><line x1="760.0" y1="527.6" x2="968.2" y2="527.6" stroke="#0a8f6f" stroke-width="1.6"/><line x1="760.0" y1="522.6" x2="760.0" y2="532.6" stroke="#0a8f6f" stroke-width="1.6"/><line x1="968.2" y1="522.6" x2="968.2" y2="532.6" stroke="#0a8f6f" stroke-width="1.6"/><text x="864.09" y="518.57" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#0a8f6f" font-weight="bold">52.0 mm off the fridge</text><text x="1010.00" y="562.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#6b757e" font-weight="normal">depth exaggerated 4x; front-to-back true scale</text><rect x="40.0" y="600.0" width="1340.0" height="250.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="624.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">WHAT THE TWO DRAWINGS DIFFER BY</text><rect x="52" y="624.0" width="1316" height="36" fill="#f2f5f7"/><text x="64.00" y="642.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="bold">depth off the fridge</text><text x="300.00" y="642.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">75.7 mm</text><text x="640.00" y="642.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#0a8f6f" font-weight="normal">52.0 mm</text><text x="980.00" y="642.00" font-family="Helvetica,Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#6b757e" font-weight="normal">23.7 mm closer — exactly the strut depth: the strut leaves the stack</text><text x="64.00" y="682.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="bold">strut spacing</text><text x="300.00" y="682.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">160 mm</text><text x="640.00" y="682.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#0a8f6f" font-weight="normal">181.3 mm</text><text x="980.00" y="682.00" font-family="Helvetica,Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#6b757e" font-weight="normal">the 134 mm box must PASS BETWEEN the struts, so they open up</text><rect x="52" y="704.0" width="1316" height="36" fill="#f2f5f7"/><text x="64.00" y="722.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="bold">plate</text><text x="300.00" y="722.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">211 wide, in front of the struts</text><text x="640.00" y="722.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#0a8f6f" font-weight="normal">232 wide, BEHIND them</text><text x="980.00" y="722.00" font-family="Helvetica,Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#6b757e" font-weight="normal">VESA is inside the box footprint, so a plate clearing the box cannot reach it</text><text x="64.00" y="762.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="bold">screen off case centre</text><text x="300.00" y="762.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">25.7 mm</text><text x="640.00" y="762.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#0a8f6f" font-weight="normal">36.3 mm</text><text x="980.00" y="762.00" font-family="Helvetica,Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#6b757e" font-weight="normal">wider spacing lengthens the clamp bar, pushing the struts back again</text><rect x="52" y="784.0" width="1316" height="36" fill="#f2f5f7"/><text x="64.00" y="802.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="bold">hardware behind the plate</text><text x="300.00" y="802.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">n/a</text><text x="640.00" y="802.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#0a8f6f" font-weight="normal">6.02 mm of room</text><text x="980.00" y="802.00" font-family="Helvetica,Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#6b757e" font-weight="normal">M4 button 2.2, pan 3.1, cap 4.0 and the 2.78 elevator head all FIT; only a hex nut does not</text><text x="64.00" y="842.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="bold">servicing</text><text x="300.00" y="842.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">display comes off in place</text><text x="640.00" y="842.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#0a8f6f" font-weight="normal">whole frame lifts off the clamps first</text><text x="980.00" y="842.00" font-family="Helvetica,Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#6b757e" font-weight="normal">the display cannot be unbolted in situ — but the frame was always removable</text></svg>