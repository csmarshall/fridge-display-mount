<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="776" viewBox="0 0 1200 776"><rect width="1200" height="776" fill="#fbfcfd"/><text x="40.00" y="46.00" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#14181c" font-weight="bold">THE FASTENER SANDWICH AT ONE MAGNET</text><text x="40.00" y="70.00" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#6b757e" font-weight="normal">True section through one magnet position, drawn at one scale on both axes - 4.6 px/mm across AND through. One drawing per distinct stack shape.</text><text x="40.00" y="90.00" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#6b757e" font-weight="normal">Plate 4.75 mm (0.187 in), hole O7.0 mm, stud a fixed 9.53 mm (0.375 in). Change any of those and every panel here changes with it.</text><text x="40.00" y="112.00" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#8a5a00" font-weight="bold">The orange band is where that part actually touches the plate. M6 nut and washer heights are DIN nominal; McMaster part numbers are NOT VERIFIED (2026-09-02).</text><text x="40.00" y="132.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#6b757e" font-weight="normal">Washer thickness is the MAX of the range it is sold to - every stack is checked against the thickest one that might ship.</text><text x="40.00" y="154.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#6b757e" font-weight="normal">Showing the 2 stack shapes that fit or are marginal, out of 24 permutations. Threadlocker changes locking, not geometry, so it has no separate panel - see fastener_matrix.svg for all of them.</text><rect x="40.0" y="190.0" width="548.0" height="30" rx="4" fill="#eef7f2" stroke="#0a8f6f" stroke-width="2.2"/><text x="52.00" y="210.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">THIN hex jam nut, 18-8 (McMaster 91847A029, 100/pk $6.75)</text><text x="576.00" y="210.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end" fill="#0a8f6f" font-weight="bold">+0.81 mm to spare</text><rect x="74.00" y="242.00" width="7.14" height="128.80" fill="#3a3734" stroke="#14181c" stroke-width="0.9"/><line x1="72.00" y1="246.00" x2="83.14" y2="240.00" stroke="#fbfcfd" stroke-width="3.2"/><line x1="72.00" y1="247.00" x2="83.14" y2="241.00" stroke="#6b757e" stroke-width="0.8"/><line x1="72.00" y1="243.00" x2="83.14" y2="237.00" stroke="#6b757e" stroke-width="0.8"/><rect x="74.00" y="370.80" width="7.14" height="128.80" fill="#3a3734" stroke="#14181c" stroke-width="0.9"/><line x1="72.00" y1="495.60" x2="83.14" y2="501.60" stroke="#fbfcfd" stroke-width="3.2"/><line x1="72.00" y1="494.60" x2="83.14" y2="500.60" stroke="#6b757e" stroke-width="0.8"/><line x1="72.00" y1="498.60" x2="83.14" y2="504.60" stroke="#6b757e" stroke-width="0.8"/><rect x="81.14" y="296.85" width="36.52" height="57.84" fill="#e7b6dd" stroke="#14181c" stroke-width="0.9"/><rect x="81.14" y="386.90" width="36.52" height="57.84" fill="#e7b6dd" stroke="#14181c" stroke-width="0.9"/><rect x="117.66" y="242.00" width="21.85" height="112.70" fill="#b9c2c9" stroke="#14181c" stroke-width="0.9"/><line x1="115.66" y1="246.00" x2="141.51" y2="240.00" stroke="#fbfcfd" stroke-width="3.2"/><line x1="115.66" y1="247.00" x2="141.51" y2="241.00" stroke="#6b757e" stroke-width="0.8"/><line x1="115.66" y1="243.00" x2="141.51" y2="237.00" stroke="#6b757e" stroke-width="0.8"/><rect x="117.66" y="386.90" width="21.85" height="112.70" fill="#b9c2c9" stroke="#14181c" stroke-width="0.9"/><line x1="115.66" y1="495.60" x2="141.51" y2="501.60" stroke="#fbfcfd" stroke-width="3.2"/><line x1="115.66" y1="494.60" x2="141.51" y2="500.60" stroke="#6b757e" stroke-width="0.8"/><line x1="115.66" y1="498.60" x2="141.51" y2="504.60" stroke="#6b757e" stroke-width="0.8"/><rect x