<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800"><rect width="1180" height="800" fill="#fbfcfd"/><text x="40.00" y="46.00" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#14181c" font-weight="bold">THE FASTENER SANDWICH AT ONE MAGNET</text><text x="40.00" y="70.00" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#6b757e" font-weight="normal">Section through a single magnet position. The stud is a fixed 12.70 mm (0.500 in); everything it passes through is not.</text><text x="40.00" y="92.00" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#6b757e" font-weight="normal">Plate is 4.75 mm (0.187 in). Change the plate thickness and this drawing changes with it — that is the point of it.</text><rect x="300.0" y="210.0" width="14.0" height="92.0" fill="#dfe3e6" stroke="#14181c" stroke-width="1.2"/><line x1="307.0" y1="304.0" x2="307.0" y2="315.0" stroke="#6b757e" stroke-width="0.8"/><text x="307.00" y="318.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="end" fill="#14181c" font-weight="bold" transform="rotate(-45.0 307.00 318.00)">FRIDGE</text><text x="319.00" y="330.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="end" fill="#6b757e" font-weight="normal" transform="rotate(-45.0 319.00 330.00)">panel</text><rect x="314.0" y="210.0" width="149.6" height="92.0" fill="#e7b6dd" stroke="#14181c" stroke-width="1.2"/><line x1="388.8" y1="304.0" x2="388.8" y2="315.0" stroke="#6b757e" stroke-width="0.8"/><text x="388.81" y="318.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="end" fill="#14181c" font-weight="bold" transform="rotate(-45.0 388.81 318.00)">MAGNET</text><text x="400.81" y="330.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="end" fill="#6b757e" font-weight="normal" transform="rotate(-45.0 400.81 330.00)">11.51 mm</text><rect x="463.6" y="210.0" width="61.7" height="92.0" fill="#b9c2c9" stroke="#14181c" stroke-width="1.2"/><line x1="494.5" y1="304.0" x2="494.5" y2="315.0" stroke="#6b757e" stroke-width="0.8"/><text x="494.50" y="318.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="end" fill="#14181c" font-weight="bold" transform="rotate(-45.0 494.50 318.00)">PLATE</text><text x="506.50" y="330.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="end" fill="#6b757e" font-weight="normal" transform="rotate(-45.0 506.50 330.00)">4.75 mm</text><rect x="525.4" y="210.0" width="16.5" height="92.0" fill="#cdd5db" stroke="#14181c" stroke-width="1.2"/><line x1="533.6" y1="304.0" x2="533.6" y2="315.0" stroke="#6b757e" stroke-width="0.8"/><text x="533.62" y="318.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="end" fill="#14181c" font-weight="bold" transform="rotate(-45.0 533.62 318.00)">washer</text><text x="545.62" y="330.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="end" fill="#6b757e" font-weight="normal" transform="rotate(-45.0 545.62 330.00)">1.27 mm</text><rect x="541.9" y="210.0" width="109.0" height="92.0" fill="#9aa6ae" stroke="#14181c" stroke-width="1.2"/><line x1="596.4" y1="304.0" x2="596.4" y2="315.0" stroke="#6b757e" stroke-width="0.8"/><text x="596.36" y="318.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="end" fill="#14181c" font-weight="bold" transform="rotate(-45.0 596.36 318.00)">nut</text><text x="608.36" y="330.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="end" fill="#6b757e" font-weight="normal" transform="rotate(-45.0 608.36 330.00)">8.38 mm</text><rect x="461.3" y="247.0" width="165.1" height="18" fill="#8a6a10" fill-opacity="0.55" stroke="#5d3600" stroke-width="1.4"/><text x="543.87" y="261.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#3d2b00" font-weight="bold">STUD 12.70 mm</text><line x1="626.4" y1="188.0" x2="626.4" y2="346.0" stroke="#b00020" stroke-width="1.6" stroke-dasharray="6 4"/><text x="620.42" y="180.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="end" fill="#b00020" font-weight="bold">stud ends here</text><line x1="650.8" y1="188.0" x2="650.8" y2="346.0" stroke="#14181c" stroke-width="1.2" stroke-dasharray="3 3"/><text x="656.85" y="198.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#14181c" font-weight="normal">stack ends here</text><text x="40.00" y="434.00" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="start" fill="#14181c" font-weight="bold">WILL THE NUT FULLY ENGAGE?</text><text x="40.00" y="454.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#6b757e" font-weight="normal">The stud has to pass the plate and still fill the nut. Anything negative means it does not.</text><rect x="40" y="469.0" width="1100.0" height="26" fill="#fdf0f1" rx="3"/><text x="56.00" y="486.00" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#14181c" font-weight="normal">washer + nylon-insert locknut</text><text x="560.00" y="486.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="end" fill="#6b757e" font-weight="normal">needs 14.40 mm</text><text x="700.00" y="486.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="end" fill="#b00020" font-weight="bold">-1.70 mm</text><text x="720.00" y="486.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#b00020" font-weight="bold">STUD TOO SHORT</text><rect x="40" y="499.0" width="1100.0" height="26" fill="#fdf0f1" rx="3"/><text x="56.00" y="516.00" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#14181c" font-weight="normal">nylon-insert locknut, no washer</text><text x="560.00" y="516.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="end" fill="#6b757e" font-weight="normal">needs 13.13 mm</text><text x="700.00" y="516.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="end" fill="#b00020" font-weight="bold">-0.43 mm</text><text x="720.00" y="516.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#b00020" font-weight="bold">STUD TOO SHORT</text><rect x="40" y="529.0" width="1100.0" height="26" fill="#fdf0f1" rx="3"/><text x="56.00" y="546.00" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#14181c" font-weight="normal">washer + standard hex nut</text><text x="560.00" y="546.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="end" fill="#6b757e" font-weight="normal">needs 12.78 mm</text><text x="700.00" y="546.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="end" fill="#b00020" font-weight="bold">-0.08 mm</text><text x="720.00" y="546.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#b00020" font-weight="bold">STUD TOO SHORT</text><rect x="40" y="559.0" width="1100.0" height="26" fill="#eef7f2" rx="3"/><text x="56.00" y="576.00" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#14181c" font-weight="bold">standard hex nut, no washer</text><text x="560.00" y="576.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="end" fill="#6b757e" font-weight="normal">needs 11.51 mm</text><text x="700.00" y="576.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="end" fill="#0a8f6f" font-weight="bold">+1.19 mm</text><text x="720.00" y="576.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">engages fully</text><rect x="40" y="614.0" width="1100.0" height="54" fill="#fff" stroke="#0a8f6f" stroke-width="1.6" rx="4"/><text x="56.00" y="634.00" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#0a8f6f" font-weight="bold">USE: standard hex nut, no washer</text><text x="56.00" y="654.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#6b757e" font-weight="normal">The stud is fixed at 12.70 mm, so every millimetre of plate comes straight off the thread available to the nut.</text></svg>