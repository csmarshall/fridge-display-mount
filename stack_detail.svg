amily="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="end" fill="#14181c" font-weight="bold">locking: mechanical</text><rect x="40" y="636.0" width="1120.0" height="152" fill="#fff" stroke="#0a8f6f" stroke-width="1.6" rx="4"/><text x="56.00" y="656.00" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">USE: THIN hex jam nut, 18-8 (McMaster 91847A029, 100/pk $6.75)</text><text x="56.00" y="678.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#6b757e" font-weight="normal">4.75 + 0.00 + 3.97 = 8.72 mm against a 9.53 mm stud: +0.81 mm to spare, 59 mm2 of bearing, locking none.</text><text x="56.00" y="698.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#6b757e" font-weight="normal">The stud length is an ESTIMATE (10 mm from two vendors' 32 x 18 mm overall figure; K&amp;J do not print it). A washer costs 1.6 mm here, which is why the specified stack has none.</text><text x="56.00" y="718.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#6b757e" font-weight="normal">No other mechanical-locking stack fits.</text><text x="56.00" y="736.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#6b757e" font-weight="normal">Bearing is harmless at every one of these: the plate is 36 ksi steel. The choice is thread length and locking, nothing else.</text><text x="56.00" y="756.00" font-family="Helvetica,Arial,sans-serif" font-size="11.0" text-anchor="start" fill="#6b757e" font-weight="normal">Fasteners are BLACK OXIDE where stocked - only the ARM nuts are visible, facing up against a textured-black arm.</text></svg>