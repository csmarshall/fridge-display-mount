<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1408" viewBox="0 0 1180 1408"><rect width="1180" height="1408" fill="#fbfcfd"/><text x="40.0" y="48.0" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#14181c" font-weight="bold">WHY NOT JUST MAGNETS?</text><text x="40.0" y="75.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="start" fill="#6b757e" font-weight="normal" font-style="italic">"Amazon has magnets that can handle that weight fine, and are cheap — why can't we just use those?"</text><text x="40.0" y="96.0" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#6b757e" font-weight="normal">A fair question, and the answer is arithmetic, not opinion. It takes three steps: what a rating measures, what the fridge actually does to it, and what a lever does to whatever is left.</text><rect x="40.0" y="122.0" width="353.3" height="240.0" rx="6" fill="#ffffff" stroke="#c9d1d8" stroke-width="1.2"/><text x="56.0" y="148.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">PULL — what the box quotes</text><rect x="84.0" y="170.0" width="10" height="108.0" fill="#3a3734" stroke="#14181c" stroke-width="1.0"/><rect x="94.0" y="209.0" width="34" height="26" fill="#e7b6dd" stroke="#14181c" stroke-width="1.0"/><line x1="136.0" y1="222.0" x2="210.0" y2="222.0" stroke="#0a8f6f" stroke-width="2.6"/><path d="M210.0 222.0 L200.1 226.9 L200.1 217.1 Z" fill="#0a8f6f"/><text x="144.0" y="210.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#0a8f6f" font-weight="bold">tension</text><text x="56.0" y="298.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">Straight away from the surface. Ratings are measured</text><text x="56.0" y="313.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">THIS way, on thick ground steel at zero gap. Strongest</text><text x="56.0" y="328.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">direction by far.</text><rect x="413.3" y="122.0" width="353.3" height="240.0" rx="6" fill="#ffffff" stroke="#c9d1d8" stroke-width="1.2"/><text x="429.3" y="148.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="start" fill="#b8860b" font-weight="bold">SHEAR — what gravity applies</text><rect x="457.3" y="170.0" width="10" height="108.0" fill="#3a3734" stroke="#14181c" stroke-width="1.0"/><rect x="467.3" y="209.0" width="34" height="26" fill="#e7b6dd" stroke="#14181c" stroke-width="1.0"/><line x1="484.3" y1="242.0" x2="484.3" y2="284.0" stroke="#b8860b" stroke-width="2.6"/><path d="M484.3 284.0 L479.4 274.1 L489.2 274.1 Z" fill="#b8860b"/><text x="497.3" y="268.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#b8860b" font-weight="bold">gravity</text><text x="429.3" y="298.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">Sliding DOWN the panel. The magnet only resists through</text><text x="429.3" y="313.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">friction: grip = pull x mu, and mu is tiny on smooth</text><text x="429.3" y="328.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">paint. Weakest direction.</text><rect x="786.7" y="122.0" width="353.3" height="240.0" rx="6" fill="#ffffff" stroke="#c9d1d8" stroke-width="1.2"/><text x="802.7" y="148.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="start" fill="#b00020" font-weight="bold">PEEL — what a bump applies</text><rect x="830.7" y="170.0" width="10" height="108.0" fill="#3a3734" stroke="#14181c" stroke-width="1.0"/><rect x="840.7" y="209.0" width="34" height="26" fill="#e7b6dd" stroke="#14181c" stroke-width="1.0"/><rect x="840.7" y="209.0" width="34" height="26" fill="#e7b6dd" fill-opacity="0.45" stroke="#6b757e" stroke-width="1.0" stroke-dasharray="3 3" transform="rotate(-16 840.7 235.0)"/><line x1="876.7" y1="200.0" x2="926.7" y2="170.0" stroke="#b00020" stroke-width="2.6"/><path d="M926.7 170.0 L920.7 179.3 L915.7 170.9 Z" fill="#b00020"/><text x="892.7" y="170.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#b00020" font-weight="bold">pry</text><text x="802.7" y="298.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">Levering one edge away. The prying force is multiplied</text><text x="802.7" y="313.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">by the lever, and it lands on ONE magnet at a time —</text><text x="802.7" y="328.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">never on the total.</text><rect x="40.0" y="386.0" width="1100.0" height="396.0" rx="6" fill="#ffffff" stroke="#c9d1d8" stroke-width="1.2"/><text x="56.0" y="412.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="start" fill="#14181c" font-weight="bold">WATCH THE NUMBER ON THE BOX COLLAPSE</text><text x="56.0" y="432.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#6b757e" font-weight="normal">The as-built magnet is a 48 mm (1.89 in) pot magnet, and its catalogue rating is honest — for the test it describes. The fridge is not that test.</text><rect x="76.0" y="452.0" width="620.0" height="34.0" fill="#f2f5f7"/><rect x="76.0" y="452.0" width="620.0" height="34.0" fill="#14181c" fill-opacity="0.82"/><text x="712.0" y="467.0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#14181c" font-weight="bold">RATED   175 lbf (778 N)</text><text x="712.0" y="483.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#6b757e" font-weight="normal">measured on THICK ground steel, ZERO gap, pulling STRAIGHT OFF</text><rect x="76.0" y="526.0" width="620.0" height="34.0" fill="#f2f5f7"/><rect x="76.0" y="526.0" width="217.0" height="34.0" fill="#b8860b" fill-opacity="0.82"/><text x="712.0" y="541.0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#b8860b" font-weight="bold">x 0.35 on the fridge  =  61.2 lbf (272 N)  PULL</text><text x="712.0" y="557.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#6b757e" font-weight="normal">0.6-0.9 mm painted sheet: thin steel saturates, paint holds the magnet off the metal</text><line x1="102.0" y1="500.0" x2="102.0" y2="522.0" stroke="#6b757e" stroke-width="1.8"/><path d="M102.0 522.0 L97.1 512.1 L106.9 512.1 Z" fill="#6b757e"/><rect x="76.0" y="600.0" width="620.0" height="34.0" fill="#f2f5f7"/><rect x="76.0" y="600.0" width="43.4" height="34.0" fill="#b00020" fill-opacity="0.82"/><text x="712.0" y="615.0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#b00020" font-weight="bold">x mu 0.2 friction  =  12.2 lbf (54 N)  SHEAR</text><text x="712.0" y="631.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#6b757e" font-weight="normal">the load is SLIDING, not pulling — bare nickel on smooth paint barely grips</text><line x1="102.0" y1="574.0" x2="102.0" y2="596.0" stroke="#6b757e" stroke-width="1.8"/><path d="M102.0 596.0 L97.1 586.1 L106.9 586.1 Z" fill="#6b757e"/><text x="76.0" y="668.0" font-family="Helvetica,Arial,sans-serif" font-size="14.5" text-anchor="start" fill="#b00020" font-weight="bold">12.2 lbf (54 N) is 7% of the number on the box — in the direction the fridge actually loads it.</text><rect x="76.0" y="688.0" width="1028.0" height="62" rx="5" fill="#f2f5f7" stroke="#c9d1d8" stroke-width="1.0"/><text x="92.0" y="712.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#14181c" font-weight="bold">Not our theory — the vendors publish the drop themselves.</text><text x="92.0" y="732.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">totalElement rate their 43 mm rubber pot magnet at 33.5 lbf (149 N) vertical pull but only 7.0 lbf (31 N) horizontal — 21% of the headline, from their own catalogue.</text><rect x="40.0" y="806.0" width="540.0" height="262.0" rx="6" fill="#ffffff" stroke="#c9d1d8" stroke-width="1.2"/><text x="56.0" y="832.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="start" fill="#b00020" font-weight="bold">PEEL: YOU NEVER FIGHT THE TOTAL</text><text x="56.0" y="862.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">Four magnets at 61 lbf (272 N) each sounds like 245 lbf</text><text x="56.0" y="877.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">(1090 N) of holding. It is not. Bump the screen's top edge</text><text x="56.0" y="893.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">and the plate rotates about its bottom — the prying force is</text><text x="56.0" y="908.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">multiplied by the lever ratio, and the whole moment lands on</text><text x="56.0" y="924.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">the TOP magnet alone, at its own 61 lbf. The instant it lets</text><text x="56.0" y="939.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">go, its share dumps onto the next one down. Magnet mounts do</text><text x="56.0" y="955.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">not fail by being overpowered; they fail by unzipping, one</text><text x="56.0" y="970.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">magnet at a time.</text><rect x="432.0" y="880.0" width="10" height="150.0" fill="#3a3734" stroke="#14181c" stroke-width="1.0"/><rect x="442.0" y="897.0" width="34" height="26" fill="#e7b6dd" stroke="#14181c" stroke-width="1.0"/><rect x="442.0" y="987.0" width="34" height="26" fill="#e7b6dd" stroke="#14181c" stroke-width="1.0"/><rect x="476.0" y="886.0" width="9" height="138" fill="#b9c2c9" stroke="#14181c" stroke-width="1.0"/><line x1="490.0" y1="888.0" x2="550.0" y2="862.0" stroke="#b00020" stroke-width="2.6"/><path d="M550.0 862.0 L542.9 870.4 L539.0 861.4 Z" fill="#b00020"/><text x="466.0" y="850.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#b00020" font-weight="bold">small pry,</text><text x="466.0" y="862.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#b00020" font-weight="bold">long lever</text><circle cx="480.0" cy="1024.0" r="5" fill="none" stroke="#6b757e" stroke-width="1.6"/><text x="494.0" y="1028.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#6b757e" font-weight="normal">pivot</text><text x="494.0" y="922.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#b00020" font-weight="normal">fails first</text><rect x="600.0" y="806.0" width="540.0" height="262.0" rx="6" fill="#ffffff" stroke="#c9d1d8" stroke-width="1.2"/><text x="616.0" y="832.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="start" fill="#14181c" font-weight="bold">WHAT MAGNET-ONLY WOULD ACTUALLY NEED</text><text x="616.0" y="860.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">Hanging load: display 8.7 lbf (39 N) + bracket 12.8 lbf (57 N)</text><text x="616.0" y="875.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">= 21.5 lbf (96 N)</text><text x="616.0" y="899.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">Rated pull needed per pound held, in shear: 1 / (0.35 x 0.2)</text><text x="616.0" y="914.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#b8860b" font-weight="bold">= 14 lbf rated per lbf held</text><text x="616.0" y="938.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">So holding 21.5 lbf (96 N) in shear needs</text><text x="616.0" y="953.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#b00020" font-weight="bold">~307 lbf (1.4 kN) RATED — 14x whatever it holds, before any</text><text x="616.0" y="969.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#b00020" font-weight="bold">safety factor</text><line x1="616.0" y1="989.0" x2="1124.0" y2="989.0" stroke="#c9d1d8" stroke-width="0.8"/><text x="616.0" y="1009.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b757e" font-weight="normal">And if the panel is 304 stainless (many are), every magnet contributes</text><text x="616.0" y="1025.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#b00020" font-weight="bold">exactly ZERO. This one measured magnetic — the design still must not care.</text><rect x="40.0" y="1092.0" width="1100.0" height="280.0" rx="6" fill="#ffffff" stroke="#c9d1d8" stroke-width="1.2"/><text x="56.0" y="1118.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">THE ANSWER: DON'T FIGHT THE PHYSICS — HOOK OVER THE TOP</text><rect x="168.0" y="1170.0" width="200" height="132" fill="#3a3734" stroke="#14181c" stroke-width="1.0"/><text x="274.0" y="1244.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#6b757e" font-weight="normal">fridge</text><path d="M148.0 1294.0 L148.0 1156.0 L264.0 1156.0 L264.0 1164.0 L156.0 1164.0 L156.0 1294.0 Z" fill="#b9c2c9" stroke="#14181c" stroke-width="1.1"/><line x1="152.0" y1="1300.0" x2="152.0" y2="1342.0" stroke="#14181c" stroke-width="2.6"/><path d="M152.0 1342.0 L147.1 1332.1 L156.9 1332.1 Z" fill="#14181c"/><text x="164.0" y="1332.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#14181c" font-weight="bold">all 21.5 lbf (96 N) of it</text><line x1="208.0" y1="1130.0" x2="208.0" y2="1154.0" stroke="#0a8f6f" stroke-width="2.6"/><path d="M208.0 1154.0 L203.1 1144.1 L212.9 1144.1 Z" fill="#0a8f6f"/><text x="220.0" y="1138.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">bearing: the fridge TOP carries the weight</text><rect x="114.0" y="1187.0" width="34" height="26" fill="#e7b6dd" stroke="#14181c" stroke-width="1.0"/><rect x="114.0" y="1253.0" width="34" height="26" fill="#e7b6dd" stroke="#14181c" stroke-width="1.0"/><text x="110.0" y="1236.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="end" fill="#6b757e" font-weight="normal">magnets</text><text x="470.0" y="1148.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#14181c" font-weight="normal">The arm rests ON the fridge top. The vertical load goes into bearing at the corner — compression on painted</text><text x="470.0" y="1163.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#14181c" font-weight="normal">steel over a sponge pad.</text><text x="470.0" y="1188.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#0a8f6f" font-weight="bold">The magnets carry ZERO vertical load. They only stop swing and rattle, and that duty is TENSION — their</text><text x="470.0" y="1203.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#0a8f6f" font-weight="bold">strong direction.</text><text x="470.0" y="1228.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#6b757e" font-weight="normal">Demand on a magnet: 1.6 lbf (7 N) from a firm 5 lbf (22 N) touch press, 2.1 lbf (9 N) of total peel —</text><text x="470.0" y="1243.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#6b757e" font-weight="normal">against 61 lbf (272 N) of derated capacity each: 37x in hand.</text><text x="470.0" y="1268.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#6b757e" font-weight="normal">A non-magnetic panel no longer matters: the hook still carries everything, and the arm's width still resists</text><text x="470.0" y="1283.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#6b757e" font-weight="normal">the twist.</text><text x="470.0" y="1308.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#b00020" font-weight="bold">The stakes: 3.94 kg (8.7 lb) of optically bonded glass over a kitchen floor. "Probably strong enough" is not</text><text x="470.0" y="1323.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#b00020" font-weight="bold">a spec — a hook is.</text></svg>