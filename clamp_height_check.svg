ect x="258.0" y="199.0" width="10" height="6.1" fill="#14181c" fill-opacity="0.45"/><rect x="258.0" y="188.2" width="10" height="6.1" fill="#14181c" fill-opacity="0.45"/><rect x="258.0" y="177.4" width="10" height="6.1" fill="#14181c" fill-opacity="0.45"/><rect x="258.0" y="166.6" width="10" height="6.1" fill="#14181c" fill-opacity="0.45"/><line x1="100.0" y1="182.5" x2="400.0" y2="182.5" stroke="#2b2926" stroke-width="1.2"/><rect x="100.0" y="182.5" width="150" height="366.4" fill="#3a3734"/><text x="175.00" y="367.23" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#cfc9c2" font-weight="normal" transform="rotate(-90.0 175.00 367.23)">fridge</text><line x1="276.0" y1="182.5" x2="420.0" y2="182.5" stroke="#0a8f6f" stroke-width="1.5"/><text x="426.00" y="170.47" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">TOP CLAMP wants 1743.1</text><text x="426.00" y="183.47" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#0a8f6f" font-weight="normal">nearest slot 1752.6, off by +9.5</text><text x="426.00" y="195.47" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#0a8f6f" font-weight="bold">INSIDE the 14.3 half-slot</text><line x1="276.0" y1="548.8" x2="420.0" y2="548.8" stroke="#0a8f6f" stroke-width="1.5"/><text x="426.00" y="536.82" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">LOWER CLAMP wants 15.0</text><text x="426.00" y="549.82" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#0a8f6f" font-weight="normal">nearest slot 25.4, off by +10.4</text><text x="426.00" y="561.82" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#0a8f6f" font-weight="bold">INSIDE the 14.3 half-slot</text><line x1="263.0" y1="164.3" x2="263.0" y2="182.5" stroke="#b8860b" stroke-width="2"/><text x="290.00" y="168.47" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#b8860b" font-weight="bold">85.7 mm proud of the top</text><rect x="760.0" y="100.0" width="380.0" height="470.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="776.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">WHAT THE NUMBERS SAY</text><rect x="770" y="125.0" width="360" height="30" fill="#f2f5f7"/><text x="782.00" y="142.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="normal">strut length</text><text x="1035.00" y="142.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="end" fill="#14181c" font-weight="bold">1828.8</text><text x="1048.00" y="142.00" font-family="Helvetica,Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#6b757e" font-weight="normal">6 ft stock</text><text x="782.00" y="176.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="normal">fridge case height</text><text x="1035.00" y="176.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="end" fill="#14181c" font-weight="bold">1743.1</text><text x="1048.00" y="176.00" font-family="Helvetica,Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#6b757e" font-weight="normal">published</text><rect x="770" y="193.0" width="360" height="30" fill="#f2f5f7"/><text x="782.00" y="210.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="normal">strut stands proud by</text><text x="1035.00" y="210.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="end" fill="#14181c" font-weight="bold">85.7</text><text x="1048.00" y="210.00" font-family="Helvetica,Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#6b757e" font-weight="normal">derived</text><text x="782.00" y="244.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="normal">slot pitch</text><text x="1035.00" y="244.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="end" fill="#14181c" font-weight="bold">50.8</text><text x="1048.00" y="244.00" font-family="Helvetica,Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#6b757e" font-weight="normal">McMaster table</text><rect x="770" y="261.0" width="360" height="30" fill="#f2f5f7"/><text x="782.00" y="278.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="normal">slot length</text><text x="1035.00" y="278.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="end" fill="#14181c" font-weight="bold">28.6</text><text x="1048.00" y="278.00" font-family="Helvetica,Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#6b757e" font-weight="normal">McMaster table</text><text x="782.00" y="312.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="normal">adjustment either way</text><text x="1035.00" y="312.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="end" fill="#14181c" font-weight="bold">±14.3</text><text x="1048.00" y="312.00" font-family="Helvetica,Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#6b757e" font-weight="normal">half a slot</text><rect x="770" y="329.0" width="360" height="30" fill="#f2f5f7"/><text x="782.00" y="346.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="normal">top clamp error</text><text x="1035.00" y="346.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="end" fill="#14181c" font-weight="bold">+9.5</text><text x="1048.00" y="346.00" font-family="Helvetica,Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#0a8f6f" font-weight="bold">PASS</text><text x="782.00" y="380.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="normal">lower clamp error</text><text x="1035.00" y="380.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="end" fill="#14181c" font-weight="bold">+10.4</text><text x="1048.00" y="380.00" font-family="Helvetica,Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#0a8f6f" font-weight="bold">PASS</text><rect x="40.0" y="590.0" width="1100.0" height="110.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="614.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">THE POINT</text><text x="56.00" y="640.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">A 6 ft strut against a 68.6 in fridge leaves 85.7 mm standing proud of the top, and the pitch happens to put a slot 9.5 mm from where the top clamp</text><text x="56.00" y="653.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">wants one — well inside the half-slot. This is luck, not design: the strut is stock and the fridge is what it is. It is checked here precisely BECAUSE</text><text x="56.00" y="666.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">nothing made it come out right, and a different fridge or a different strut length would need this recomputed.</text></svg>