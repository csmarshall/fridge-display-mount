<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720"><rect width="1180" height="720" fill="#fbfcfd"/><rect width="1180" height="24" fill="#b8860b"/><text x="590.00" y="16.50" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">VALIDATION — the check that the strut can actually be bolted where it must be</text><text x="40.00" y="56.00" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#14181c" font-weight="bold">DOES A SLOT LAND WHERE EACH CLAMP NEEDS ONE?</text><text x="40.00" y="78.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#6b757e" font-weight="normal">The strut is slotted on a fixed 50.8 mm pitch. The fridge is whatever height it is. Those two facts have to meet.</text><rect x="40.0" y="100.0" width="700.0" height="470.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">STRUT SLOTS vs THE TWO CLAMP HEIGHTS</text><rect x="250.0" y="164.3" width="26" height="387.7" fill="#8f9aa4" stroke="#14181c" stroke-width="1.1"/><rect x="258.0" y="543.6" width="10" height="6.1" fill="#14181c" fill-opacity="0.45"/><rect x="258.0" y="532.8" width="10" height="6.1" fill="#14181c" fill-opacity="0.45"/><rect x="258.0" y="522.0" width="10" height="6.1" fill="#14181c" fill-opacity="0.45"/><rect x="258.0" y="511.3" width="10" height="6.1" fill="#14181c" fill-opacity="0.45"/><rect x="258.0" y="500.5" width="10" height="6.1" fill="#14181c" fill-opacity="0.45"/><rect x="258.0" y="489.7" width="10" height="6.1" fill="#14181c" fill-opacity="0.45"/><rect x="258.0" y="479.0" width="10" height="6.1" fill="#14181c" fill-opacity="0.45"/><rect x="258.0" y="468.2" width="10" height="6.1" fill="#14181c" fill-opacity="0.45"/><rect x="258.0" y="457.4" width="10" height="6.1" fill="#14181c" f