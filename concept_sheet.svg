<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1212" viewBox="0 0 1300 1212"><rect width="1300" height="1212" fill="#fbfcfd"/><rect width="1300" height="26" fill="#b8860b"/><text x="650.00" y="18.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#fff" font-weight="bold">CONCEPT — the assembly as decided, nothing built yet</text><text x="40.00" y="58.00" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#14181c" font-weight="bold">TWO STRUTS, TWO CLAMPS, TWO FEET, NO MAGNETS</text><text x="40.00" y="80.00" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#6b757e" font-weight="normal">Clamped to the side panel top and bottom, standing on the floor. The clamps grip; the floor carries; nothing magnetic is involved.</text><rect x="40.0" y="100.0" width="700.0" height="700.0" rx="6" fill="#fff" stroke="#c9d1d8" stroke-width="1.1"/><text x="60.00" y="125.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">SIDE ELEVATION</text><line x1="71.8" y1="760.0" x2="313.0" y2="760.0" stroke="#14181c" stroke-width="2"/><rect x="112.0" y="176.1" width="87.1" height="560.5" fill="#3a3734" stroke="#1f1d1b" stroke-width="1.2"/><text x="155.55" y="555.62" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#b0b6b9" font-weight="normal" transform="rotate(-90.0 155.55 555.62)">fridge</text><rect x="211.2" y="145.3" width="27.7" height="612.6" fill="#8f9aa4" stroke="#14181c" stroke-width="1"/><rect x="219.5" y="746.8" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="729.8" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="712.8" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="695.7" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="678.7" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="661.7" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="644.7" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="627.7" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="610.7" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="593.6" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="576.6" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="559.6" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="542.6" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="525.6" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="508.5" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="491.5" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="474.5" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="457.5" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="440.5" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="423.5" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="406.4" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="389.4" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="372.4" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="355.4" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="338.4" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="321.4" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="304.3" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="287.3" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="270.3" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="253.3" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="236.3" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="219.2" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="202.2" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="185.2" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="168.2" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><rect x="219.5" y="151.2" width="11.1" height="9.6" fill="#14181c" fill-opacity="0.45"/><path d="M207.2 659.5 L207.2 759.0 L289.1 759.0 L289.1 760.0 L207.2 760.0 Z" fill="#4a545e" stroke="#14181c" stroke-width="1.1"/><path d="M199.1 176.1 L148.8 176.1 L148.8 175.1 L207.2 175.1 L207.2 190.8 L199.1 190.8 Z" fill="#4a545e" stroke="#14181c" stroke-width="1.1"/><rect x="148.8" y="175.1" width="50.2" height="4.0" fill="#f2c14e" stroke="#a8830f" stroke-width="0.7"/><rect x="204.2" y="182.5" width="45.7" height="3.4" fill="#b8860b" stroke="#6d5300" stroke-width="0.9"/><path d="M199.1 719.8 L148.8 719.8 L148.8 720.8 L207.2 720.8 L207.2 705.1 L199.1 705.1 Z" fill="#4a545e" stroke="#14181c" stroke-width="1.1"/><rect x="148.8" y="719.8" width="50.2" height="4.0" fill="#f2c14e" stroke="#a8830f" stroke-width="0.7"/><rect x="204.2" y="710.0" width="45.7" height="3.4" fill="#b8860b" stroke="#6d5300" stroke-width="0.9"/><rect x="238.9" y="262.2" width="4.1" height="103.9" fill="#b9c2c9" stroke="#14181c" stroke-width="1"/><rect x="242.9" y="221.1" width="14.4" height="186.0" fill="#101820" stroke="#14181c" stroke-width="1"/><line x1="261.3" y1="162.1" x2="279.3" y2="162.1" stroke="#c9d1d8" stroke-width="0.8"/><line x1="261.3" y1="211.1" x2="279.3" y2="211.1" stroke="#c9d1d8" stroke-width="0.8"/><line x1="261.3" y1="310.1" x2="279.3" y2="310.1" stroke="#c9d1d8" stroke-width="0.8"/><line x1="261.3" y1="501.4" x2="279.3" y2="501.4" stroke="#c9d1d8" stroke-width="0.8"/><line x1="261.3" y1="702.4" x2="279.3" y2="702.4" stroke="#c9d1d8" stroke-width="0.8"/><line x1="261.3" y1="746.0" x2="279.3" y2="746.0" stroke="#c9d1d8" stroke-width="0.8"/><text x="283.33" y="166.07" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#0a8f6f" font-weight="bold">TOP CLAMP — hooks the top, holds 3.8 lb</text><text x="283.33" y="215.11" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#6b757e" font-weight="bold">display</text><text x="283.33" y="314.11" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#14181c" font-weight="bold">plate — the SAME part, 246 mm centres</text><text x="283.33" y="505.40" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#14181c" font-weight="bold">2 x 6 ft low-profile strut</text><text x="283.33" y="706.40" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#0a8f6f" font-weight="bold">LOWER CLAMP — slides up to grip</text><text x="283.33" y="749.95" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#0a8f6f" font-weight="bold">FOOT — outboard, strut stands on it</text><text x="73.14" y="168.07" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="start" fill="#6b757e" font-weight="normal">thin layers drawn 4x to be visible</text><rect x="760.0" y="100.0" width="500.0" height="330.0" rx="6" fill="#fff" stroke="#c9d1d8" stroke-width="1.1"/><text x="780.00" y="125.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">WHAT HOLDS IT</text><text x="784.00" y="146.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">Weight</text><text x="784.00" y="161.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#6b757e" font-weight="normal">into the FLOOR through the foot</text><text x="1238.00" y="146.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end" fill="#0a8f6f" font-weight="bold">154 N</text><text x="784.00" y="200.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">Tipping</text><text x="784.00" y="215.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#6b757e" font-weight="normal">the two clamps, gripping vertically</text><text x="1238.00" y="200.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end" fill="#0a8f6f" font-weight="bold">3.8 lb at the top</text><text x="784.00" y="254.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">Sway</text><text x="784.00" y="269.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#6b757e" font-weight="normal">clamped top and bottom, so it is a BEAM</text><text x="1238.00" y="254.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end" fill="#0a8f6f" font-weight="bold">0.34 mm</text><text x="784.00" y="308.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">Sliding</text><text x="784.00" y="323.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#6b757e" font-weight="normal">captured in the 406 mm clear window</text><text x="1238.00" y="308.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end" fill="#0a8f6f" font-weight="bold">geometric</text><text x="784.00" y="362.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">Magnets</text><text x="784.00" y="377.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#6b757e" font-weight="normal">none — the clamp does what they did</text><text x="1238.00" y="362.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end" fill="#0a8f6f" font-weight="bold">-$191</text><rect x="760.0" y="450.0" width="500.0" height="350.0" rx="6" fill="#fff" stroke="#c9d1d8" stroke-width="1.1"/><text x="780.00" y="475.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">THE TWO PARTS</text><text x="784.00" y="496.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">A — studded clamp  x2</text><text x="796.00" y="513.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">L bracket. Long leg on the fridge top, or under its base.</text><text x="796.00" y="526.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">Short leg down the side. A CARRIAGE BOLT through a square</text><text x="796.00" y="539.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">laser-cut hole is the stud: the square shoulder stops it</text><text x="796.00" y="552.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">spinning, so no welding and no second operation. Foam inside</text><text x="796.00" y="565.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">the L. The lower one is the same part, flipped.</text><text x="784.00" y="590.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">B — slotted foot  x2</text><text x="796.00" y="607.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">L bracket. Vertical leg carries the elongated slot the stud</text><text x="796.00" y="620.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">passes through; horizontal leg turns OUTBOARD and the strut</text><text x="796.00" y="633.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">stands on it, so the strut never touches the floor. The</text><text x="796.00" y="646.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">inboard foot was deleted as redundant.</text><rect x="40.0" y="820.0" width="1220.0" height="200.0" rx="6" fill="#fff" stroke="#c9d1d8" stroke-width="1.1"/><text x="60.00" y="845.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold"></text><text x="72.00" y="830.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">THE STACK, PANEL TO SCREEN — true scale</text><rect x="72.0" y="856.0" width="42.3" height="76" fill="#3a3734" stroke="#14181c" stroke-width="0.9"/><line x1="93.1" y1="934.0" x2="93.1" y2="939.0" stroke="#6b757e" stroke-width="0.7"/><text x="93.13" y="948.00" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="middle" fill="#14181c" font-weight="bold">fridge panel</text><rect x="114.3" y="856.0" width="15.9" height="76" fill="#f2c14e" stroke="#14181c" stroke-width="0.9"/><line x1="122.2" y1="934.0" x2="122.2" y2="954.0" stroke="#6b757e" stroke-width="0.7"/><text x="122.19" y="963.00" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="middle" fill="#14181c" font-weight="bold">foam 3.00</text><rect x="130.1" y="856.0" width="16.0" height="76" fill="#4a545e" stroke="#14181c" stroke-width="0.9"/><line x1="138.1" y1="934.0" x2="138.1" y2="969.0" stroke="#6b757e" stroke-width="0.7"/><text x="138.11" y="978.00" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="middle" fill="#14181c" font-weight="bold">clamp leg 3.02</text><rect x="146.1" y="856.0" width="16.0" height="76" fill="#4a545e" stroke="#14181c" stroke-width="0.9"/><line x1="154.1" y1="934.0" x2="154.1" y2="984.0" stroke="#6b757e" stroke-width="0.7"/><text x="154.08" y="993.00" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="middle" fill="#14181c" font-weight="bold">foot leg 3.02</text><rect x="162.1" y="856.0" width="109.0" height="76" fill="#8f9aa4" stroke="#14181c" stroke-width="0.9"/><line x1="216.6" y1="934.0" x2="216.6" y2="939.0" stroke="#6b757e" stroke-width="0.7"/><text x="216.58" y="948.00" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="middle" fill="#14181c" font-weight="bold">STRUT 20.64</text><rect x="271.1" y="856.0" width="16.0" height="76" fill="#b9c2c9" stroke="#14181c" stroke-width="0.9"/><line x1="279.1" y1="934.0" x2="279.1" y2="954.0" stroke="#6b757e" stroke-width="0.7"/><text x="279.09" y="963.00" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="middle" fill="#14181c" font-weight="bold">plate 3.02</text><rect x="287.1" y="856.0" width="132.1" height="76" fill="#2b3138" stroke="#14181c" stroke-width="0.9"/><line x1="353.1" y1="934.0" x2="353.1" y2="969.0" stroke="#6b757e" stroke-width="0.7"/><text x="353.12" y="978.00" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="middle" fill="#14181c" font-weight="bold">rear box 25.00</text><rect x="419.2" y="856.0" width="95.1" height="76" fill="#101820" stroke="#14181c" stroke-width="0.9"/><line x1="466.7" y1="934.0" x2="466.7" y2="984.0" stroke="#6b757e" stroke-width="0.7"/><text x="466.72" y="993.00" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="middle" fill="#14181c" font-weight="bold">panel 18.00</text><line x1="114.3" y1="844.0" x2="514.3" y2="844.0" stroke="#14181c" stroke-width="1.1"/><text x="314.27" y="840.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#14181c" font-weight="bold">75.7 mm — and 66.7 of it cannot be designed away</text><text x="800.00" y="882.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">Assembly</text><text x="812.00" y="900.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#6b757e" font-weight="normal">1. Stand the struts on the feet; stud through foot slot and strut slot, nut loose.</text><text x="812.00" y="914.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#6b757e" font-weight="normal">2. Hook the top clamps over the fridge top; washers behind the strut; nut loose.</text><text x="812.00" y="928.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#6b757e" font-weight="normal">3. Slide the lower clamps UP their slots until they engage under the appliance.</text><text x="812.00" y="942.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#6b757e" font-weight="normal">4. Lock everything. The struts go into tension and the fridge is gripped.</text><rect x="40.0" y="1036.0" width="1220.0" height="152.0" rx="6" fill="#fff" stroke="#c9d1d8" stroke-width="1.1"/><text x="60.00" y="1061.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#b00020" font-weight="bold">STILL OPEN — both need a torch under the fridge</text><text x="64.00" y="1076.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#6b757e" font-weight="normal">- Does a 150-250 mm clamp reach foul anything under there? Compressor, tubing, insulation, cross-members. It sets how far the</text><text x="64.00" y="1089.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#6b757e" font-weight="normal">  lower clamp can go in, and nothing else can answer it.</text><text x="64.00" y="1110.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#6b757e" font-weight="normal">- Is there a downward-facing rib or lip within reach? If so, HOOKING it beats bearing on it — a hook has no compliance at all,</text><text x="64.00" y="1123.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#6b757e" font-weight="normal">  where foam has a little.</text><text x="64.00" y="1144.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#6b757e" font-weight="normal">- The gap under the side measured 10-20 mm and the underside is NOT flat, so the lower clamp's short leg plus its foam has to live</text><text x="64.00" y="1157.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#6b757e" font-weight="normal">  inside that, at its tightest.</text></svg>