nchor="middle" fill="#cfd8de" font-weight="normal">190 × 180</text><rect x="607.7" y="150.0" width="8.4" height="133.1" fill="#2e9e5b" fill-opacity="0.22" stroke="#2e9e5b" stroke-width="1.8" stroke-dasharray="7 4"/><line x1="607.7" y1="116.7" x2="607.7" y2="636.4" stroke="#14181c" stroke-width="1" stroke-dasharray="6 4" opacity="0.85"/><line x1="616.2" y1="116.7" x2="616.2" y2="636.4" stroke="#2b3036" stroke-width="1" stroke-dasharray="6 4" opacity="0.85"/><line x1="96.0" y1="605.6" x2="364.5" y2="605.6" stroke="#0a8f6f" stroke-width="0.9"/><line x1="96.0" y1="600.6" x2="96.0" y2="610.6" stroke="#0a8f6f" stroke-width="0.9"/><line x1="364.5" y1="600.6" x2="364.5" y2="610.6" stroke="#0a8f6f" stroke-width="0.9"/><text x="230.27" y="598.60" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#0a8f6f" font-weight="bold">ARM set back 210</text><line x1="364.5" y1="605.6" x2="607.7" y2="605.6" stroke="#14181c" stroke-width="0.9"/><line x1="364.5" y1="600.6" x2="364.5" y2="610.6" stroke="#14181c" stroke-width="0.9"/><line x1="607.7" y1="600.6" x2="607.7" y2="610.6" stroke="#14181c" stroke-width="0.9"/><text x="486.14" y="598.60" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#14181c" font-weight="bold">arm width 190</text><line x1="607.7" y1="639.6" x2="616.2" y2="639.6" stroke="#2e9e5b" stroke-width="0.9"/><line x1="607.7" y1="634.6" x2="607.7" y2="644.6" stroke="#2e9e5b" stroke-width="0.9"/><line x1="616.2" y1="634.6" x2="616.2" y2="644.6" stroke="#2e9e5b" stroke-width="0.9"/><line x1="616.2" y1="639.6" x2="642.2" y2="639.6" stroke="#2e9e5b" stroke-width="0.9"/><text x="647.19" y="643.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#2e9e5b" font-weight="bold">gap 6.6</text><line x1="96.0" y1="673.6" x2="616.2" y2="673.6" stroke="#0a8f6f" stroke-width="0.9"/><line x1="96.0" y1="668.6" x2="96.0" y2="678.6" stroke="#0a8f6f" stroke-width="0.9"/><line x1="616.2" y1="668.6" x2="616.2" y2="678.6" stroke="#0a8f6f" stroke-width="0.9"/><text x="356.10" y="666.60" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#0a8f6f" font-weight="bold">clear window 406</text><line x1="96.0" y1="707.6" x2="876.3" y2="707.6" stroke="#0a8f6f" stroke-width="0.9"/><line x1="96.0" y1="702.6" x2="96.0" y2="712.6" stroke="#0a8f6f" stroke-width="0.9"/><line x1="876.3" y1="702.6" x2="876.3" y2="712.6" stroke="#0a8f6f" stroke-width="0.9"/><text x="486.14" y="700.60" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#0a8f6f" font-weight="bold">case depth 610 / 24 in</text><text x="96.00" y="745.60" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">The arm is 190 mm in a 203 mm column: 13.2 mm of total slack, 6.6 mm each side. That is the whole margin — it is arithmetic, not an allowance.</text><rect x="96.0" y="717.6" width="1194.7" height="56" fill="#fff" stroke="#2e9e5b" stroke-width="1.6" rx="4"/><text x="112.00" y="747.60" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#2e9e5b" font-weight="bold">NO INTERSECTION — 6.6 mm of clear air between them</text><text x="112.00" y="765.60" font-family="Helvetica,Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#6b757e" font-weight="normal">plate_from_rear = 150 mm. Every 7 mm forward from here starts an overlap; the cover lifts off, so it is recoverable either way.</text></svg>