<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1120" viewBox="0 0 1560 1120"><rect width="1560" height="1120" fill="#fbfcfd"/><rect width="1560" height="26" fill="#1b6ea8"/><rect x="780" width="780" height="26" fill="#c8791a"/><text x="390.00" y="18.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">BUY NOW — the arm + magnets design</text><text x="1170.00" y="18.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">BUY ONLY IF THAT IS TOO LIVELY — the support</text><text x="40.00" y="60.00" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#14181c" font-weight="bold">THE THIRD DESIGN — ONE PLATE, TWO WAYS TO HOLD IT UP</text><text x="40.00" y="82.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#6b757e" font-weight="normal">The arm hooks over the fridge top and the magnets hold it flat. If that is not steady enough in use, struts drop from the same plate to the floor. Nothing about the plate changes.</text><rect x="40.0" y="104.0" width="640.0" height="906.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="128.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">THE WHOLE THING — looking at the side panel, true scale</text><line x1="192.2" y1="952.0" x2="566.0" y2="952.0" stroke="#14181c" stroke-width="2"/><rect x="192.2" y="952.0" width="373.8" height="26" fill="#b9a184" opacity="0.32"/><rect x="272.0" y="219.9" width="256.0" height="732.1" fill="#3a3734"/><rect x="440.0" y="204.6" width="88.0" height="15.3" fill="#4c4842"/><text x="522.15" y="251.91" font-family="Helvetica,Arial,sans-serif" font-size="9.6" text-anchor="end" fill="#cfd4d8" font-weight="bold">SAMSUNG RS23A500ASR</text><text x="522.15" y="264.91" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="end" fill="#9aa1a7" font-weight="normal">counter-depth, 610 deep</text><text x="484.03" y="198.58" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#6b757e" font-weight="normal">hinge cover</text><rect x="332.7" y="439.9" width="17.3" height="512.1" fill="#e8dcc9" stroke="#c8791a" stroke-width="1.4"/><rect x="329.9" y="944.0" width="23.1" height="8" fill="#c8791a"/><rect x="411.4" y="439.9" width="17.3" height="512.1" fill="#e8dcc9" stroke="#c8791a" stroke-width="1.4"/><rect x="408.5" y="944.0" width="23.1" height="8" fill="#c8791a"/><rect x="329.9" y="940.7" width="101.8" height="9" fill="#c8791a"/><rect x="340.8" y="216.4" width="79.8" height="3.5" fill="#1b6ea8"/><rect x="340.8" y="219.9" width="79.8" height="107.9" fill="#1b6ea8" opacity="0.55"/><rect x="315.6" y="327.9" width="130.2" height="130.2" fill="#1b6ea8" opacity="0.30" stroke="#1b6ea8" stroke-width="1.4"/><rect x="312.6" y="276.4" width="136.4" height="233.2" rx="3" fill="none" stroke="#14181c" stroke-width="1.2" stroke-dasharray="7 5"/><text x="380.74" y="396.98" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#14181c" font-weight="normal">display, 24 in portrait</text><line x1="192.2" y1="219.9" x2="578.4" y2="219.9" stroke="#6b757e" stroke-width="0.6" stroke-dasharray="4 4"/><text x="193.04" y="214.91" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="start" fill="#6b757e" font-weight="normal">fridge top 1743</text><line x1="192.2" y1="458.1" x2="578.4" y2="458.1" stroke="#1b6ea8" stroke-width="0.6" stroke-dasharray="4 4"/><text x="193.04" y="453.05" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="start" fill="#1b6ea8" font-weight="normal">plate bottom 1176</text><line x1="192.2" y1="439.9" x2="578.4" y2="439.9" stroke="#c8791a" stroke-width="0.6" stroke-dasharray="4 4"/><text x="577.59" y="451.94" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="end" fill="#c8791a" font-weight="normal">strut top 1219 — 4 ft stock</text><rect x="432.7" y="439.9" width="9" height="18.1" fill="#b00020" opacity="0.5"/><path d="M434.4 449.0 L528.8 492.1" fill="none" stroke="#b00020" stroke-width="0.9"/><text x="534.75" y="495.05" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#b00020" font-weight="bold">43.1 mm overlap</text><text x="534.75" y="507.05" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#b00020" font-weight="normal">the only place the bolts</text><text x="534.75" y="518.05" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#b00020" font-weight="normal">can go, and one slot lands</text><text x="534.75" y="529.05" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#b00020" font-weight="normal">in it</text><rect x="700.0" y="104.0" width="820.0" height="470.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="716.00" y="128.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">WHAT YOU BUY, AND WHEN</text><text x="716.00" y="148.00" font-family="Helvetica,Arial,sans-serif" font-size="12.0" text-anchor="start" fill="#1b6ea8" font-weight="bold">IN THE FIRST ORDER</text><text x="716.00" y="163.00" font-family="Helvetica,Arial,sans-serif" font-size="9.4" text-anchor="start" fill="#6b757e" font-weight="normal">the plate is cut once and cannot be changed afterwards</text><text x="730.00" y="182.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">HOOK PLATE x1</text><text x="1160.00" y="182.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#14181c" font-weight="bold">$177.77</text><text x="1180.00" y="179.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">0.119 CRS, 1 bend, matte black. NOT the</text><text x="1180.00" y="189.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">archived $197.07 figure, which was 0.187</text><text x="730.00" y="216.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">Elevator bolts, pack of 25</text><text x="1160.00" y="216.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#14181c" font-weight="bold">$9.63</text><text x="1180.00" y="213.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">square neck, includes nuts; one pack covers</text><text x="1180.00" y="223.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">everything</text><text x="730.00" y="250.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">MAGNETS x8</text><text x="1160.00" y="250.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#6b757e" font-weight="bold">optional</text><text x="1180.00" y="247.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">$191 if fitted. The design does not need</text><text x="1180.00" y="257.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">them.</text><line x1="716" y1="272.0" x2="1500" y2="272.0" stroke="#c9d1d8" stroke-width="0.8"/><text x="730.00" y="290.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#1b6ea8" font-weight="bold">subtotal</text><text x="1160.00" y="290.00" font-family="Helvetica,Arial,sans-serif" font-size="12.0" text-anchor="end" fill="#1b6ea8" font-weight="bold">$187.40</text><text x="716.00" y="328.00" font-family="Helvetica,Arial,sans-serif" font-size="12.0" text-anchor="start" fill="#c8791a" font-weight="bold">ONLY IF THE ARM IS TOO LIVELY</text><text x="716.00" y="343.00" font-family="Helvetica,Arial,sans-serif" font-size="9.4" text-anchor="start" fill="#6b757e" font-weight="normal">ordinary stock and two cut parts, orderable any time later</text><text x="730.00" y="362.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">FOOT x2</text><text x="1160.00" y="362.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#14181c" font-weight="bold">$59.38</text><text x="1180.00" y="359.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">one per strut, unchanged part, matte black</text><text x="730.00" y="396.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">LOWER CLAMP x1</text><text x="1160.00" y="396.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#14181c" font-weight="bold">$77.95</text><text x="1180.00" y="393.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">clamp design's part at QTY 1 ($77.95, not</text><text x="1180.00" y="403.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">the $59.74 qty-2 rate)</text><text x="730.00" y="430.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">STRUT 4 ft x2</text><text x="1160.00" y="430.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#14181c" font-weight="bold">$50.96</text><text x="1180.00" y="427.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">already black powder-coated</text><line x1="716" y1="452.0" x2="1500" y2="452.0" stroke="#c9d1d8" stroke-width="0.8"/><text x="730.00" y="470.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#c8791a" font-weight="bold">subtotal</text><text x="1160.00" y="470.00" font-family="Helvetica,Arial,sans-serif" font-size="12.0" text-anchor="end" fill="#c8791a" font-weight="bold">$188.29</text><rect x="700.0" y="596.0" width="820.0" height="408.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="716.00" y="620.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#b00020" font-weight="bold">THE ONE THING THE FIRST ORDER HAS TO GET RIGHT</text><text x="716.00" y="644.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#14181c" font-weight="normal">Two Ø8.5 holes in the plate at 187.28 centres, 17.73 above its bottom edge. If the</text><text x="716.00" y="658.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#14181c" font-weight="normal">struts are never bought they are two unused holes hidden behind the display. If they are</text><text x="716.00" y="672.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#14181c" font-weight="normal">bought and the holes are not there, the plate is scrap.</text><text x="716.00" y="718.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">They are NOT at the hook's 246 mm magnet spacing. At 246 a bolt centre lands 14.27 mm</text><text x="716.00" y="732.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">from a magnet centre against a 24.01 mm disc — the bolts would sit UNDER the magnets and</text><text x="716.00" y="746.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">the plate could do one job or the other, never both. At 187.28 the clearance is 32.65 mm</text><text x="716.00" y="760.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">against 30.26 needed.</text><text x="716.00" y="806.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">The strut length is luck, not design. A 4 ft stick reaches 43.1 mm past the plate's</text><text x="716.00" y="820.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">bottom edge and exactly one of its slots falls in that overlap. 3 ft is 262 short, 5 ft</text><text x="716.00" y="834.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">overshoots by 348. If the mounting height ever moves, this has to be rechecked.</text><text x="716.00" y="894.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#0a8f6f" font-weight="normal">The foot and lower clamp are the clamped-strut design's parts, unchanged — nothing new</text><text x="716.00" y="908.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#0a8f6f" font-weight="normal">gets designed for the fallback, only cut.</text></svg>