vetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#1b6ea8" font-weight="bold">J4   DISPLAY to PLATE</text><rect x="810.0" y="670.0" width="33.0" height="104.0" fill="#4a545e" stroke="#14181c" stroke-width="1.1"/><rect x="843.0" y="670.0" width="45.3" height="104.0" fill="#b9c2c9" stroke="#14181c" stroke-width="1.1"/><rect x="888.3" y="670.0" width="120.0" height="104.0" fill="#2b3440" stroke="#14181c" stroke-width="1.1"/><path d="M826.5 667.0 L826.5 636.0 L843.1 630.0" fill="none" stroke="#c9d1d8" stroke-width="0.8"/><text x="843.06" y="624.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#14181c" font-weight="bold">M4 button head</text><text x="843.06" y="635.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="middle" fill="#6b757e" font-weight="normal">2.20</text><path d="M865.7 667.0 L865.7 651.0 L909.2 645.0" fill="none" stroke="#c9d1d8" stroke-width="0.8"/><text x="909.17" y="639.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#14181c" font-weight="bold">PLATE</text><text x="909.17" y="650.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="middle" fill="#6b757e" font-weight="normal">3.02</text><path d="M948.3 667.0 L948.3 636.0 L975.3 630.0" fill="none" stroke="#c9d1d8" stroke-width="0.8"/><text x="975.28" y="624.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#14181c" font-weight="bold">VESA insert</text><text x="975.28" y="635.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="middle" fill="#6b757e" font-weight="normal">8.00</text><line x1="843.0" y1="814.0" x2="888.3" y2="814.0" stroke="#1b6ea8" stroke-width="1.6"/><line x1="843.0" y1="809.0" x2="843.0" y2="819.0" stroke="#1b6ea8" stroke-width="1.6"/><line x1="888.3" y1="809.0" x2="888.3" y2="819.0" stroke="#1b6ea8" stroke-width="1.6"/><text x="865.67" y="808.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="middle" fill="#1b6ea8" font-weight="bold">GRIP 3.02</text><text x="786.00" y="870.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">threads into the display's own inserts — depth unverified, on the pre-order</text><text x="786.00" y="883.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">list</text></svg>