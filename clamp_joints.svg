serif" font-size="8.2" text-anchor="middle" fill="#6b757e" font-weight="normal">1.78</text><path d="M1019.3 227.0 L1019.3 196.0 L1043.6 190.0" fill="none" stroke="#c9d1d8" stroke-width="0.8"/><text x="1043.59" y="184.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#14181c" font-weight="bold">channel nut</text><text x="1043.59" y="195.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="middle" fill="#6b757e" font-weight="normal">6.70</text><line x1="851.7" y1="374.0" x2="969.0" y2="374.0" stroke="#0a8f6f" stroke-width="1.6"/><line x1="851.7" y1="369.0" x2="851.7" y2="379.0" stroke="#0a8f6f" stroke-width="1.6"/><line x1="969.0" y1="369.0" x2="969.0" y2="379.0" stroke="#0a8f6f" stroke-width="1.6"/><text x="910.37" y="368.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="middle" fill="#0a8f6f" font-weight="bold">GRIP 7.82</text><text x="810.00" y="408.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#0a8f6f" font-weight="bold">bolt: grip 7.82 + nut 6.70 + 3 run-out = 17.52  -&gt;  0.75 in (19.05)</text><text x="786.00" y="430.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">NOT two joints. The clamp's square hole locks the shoulder, the bolt then</text><text x="786.00" y="443.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">passes through the foot's SLOT — that slot is the height adjustment — and</text><text x="786.00" y="456.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">nuts inside the channel. Same grip as J1, so ONE bolt length does the whole</text><text x="786.00" y="469.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">base</text><rect x="40.0" y="540.0" width="700.0" height="420.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="564.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#b00020" font-weight="bold">J3   PLATE to STRUT — SANDWICHED</text><rect x="80.0" y="670.0" width="41.7" height="104.0" fill="#4a545e" stroke="#14181c" stroke-width="1.1"/><rect x="121.7" y="670.0" width="45.3" height="104.0" fill="#b9c2c9" stroke="#14181c" stroke-width="1.1"/><rect x="167.0" y="670.0" width="26.7" height="104.0" fill="#8f9aa4" stroke="#14181c" stroke-width="1.1"/><rect x="193.7" y="670.0" width="45.3" height="104.0" fill="#b8860b" stroke="#14181c" stroke-width="1.1"/><rect x="239.0" y="670.0" width="100.5" height="104.0" fill="#4a545e" stroke="#14181c" stroke-width="1.1"/><path d="M100.8 667.0 L100.8 636.0 L106.0 630.0" fill="none" stroke="#c9d1d8" stroke-width="0.8"/><text x="105.95" y="624.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#14181c" font-weight="bold">elevator head</text><text x="105.95" y="635.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="middle" fill="#6b757e" font-weight="normal">2.78</text><path d="M144.4 667.0 L144.4 651.0 L157.9 645.0" fill="none" stroke="#c9d1d8" stroke-width="0.8"/><text x="157.86" y="639.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#14181c" font-weight="bold">PLATE</text><text x="157.86" y="650.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="middle" fill="#6b757e" font-weight="normal">3.02</text><path d="M180.4 667.0 L180.4 636.0 L209.8 630.0" fill="none" stroke="#c9d1d8" stroke-width="0.8"/><text x="209.77" y="624.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#14181c" font-weight="bold">strut web</text><text x="209.77" y="635.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="middle" fill="#6b757e" font-weight="normal">1.78</text><p