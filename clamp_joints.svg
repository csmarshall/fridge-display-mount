<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000"><rect width="1500" height="1000" fill="#fbfcfd"/><rect width="1500" height="24" fill="#b8860b"/><text x="750.00" y="16.50" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">FASTENER SANDWICHES — one per joint</text><text x="40.00" y="56.00" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#14181c" font-weight="bold">EVERY JOINT, AS A STACK</text><text x="40.00" y="78.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#6b757e" font-weight="normal">Each bolted joint in the mount, layer by layer, at 6x. The grip decides the bolt length, and the bolt length is the thing most often got wrong.</text><rect x="40.0" y="100.0" width="700.0" height="420.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">J1   TOP CLAMP to STRUT</text><rect x="80.0" y="230.0" width="41.7" height="104.0" fill="#4a545e" stroke="#14181c" stroke-width="1.1"/><rect x="121.7" y="230.0" width="45.3" height="104.0" fill="#b9c2c9" stroke="#14181c" stroke-width="1.1"/><rect x="167.0" y="230.0" width="22.8" height="104.0" fill="#8a949e" stroke="#14181c" stroke-width="1.1"/><rect x="189.8" y="230.0" width="22.8" height="104.0" fill="#8a949e" stroke="#14181c" stroke-width="1.1"/><rect x="212.6" y="230.0" width="26.7" height="104.0" fill="#8f9aa4" stroke="#14181c" stroke-width="1.1"/><rect x="239.3" y="230.0" width="100.5" height="104.0" fill="#4a545e" stroke="#14181c" stroke-width="1.1"/><path d="M100.8 227.0 L100.8 196.0 L101.7 190.0" fill="none" stroke="#c9d1d8" stroke-width="0.8"/><text x="101.65" y="184.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#14181c" font-weight="bold">elevator head</text><text x="101.65" y="195.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="middle" fill="#6b757e" font-weight="normal">2.78</text><path d="M144.4 227.0 L144.4 211.0 L145.0 205.0" fill="none" stroke="#c9d1d8" stroke-width="0.8"/><text x="144.95" y="199.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#14181c" font-weight="bold">CLAMP leg</text><text x="144.95" y="210.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="middle" fill="#6b757e" font-weight="normal">3.02</text><path d="M178.4 227.0 L178.4 196.0 L188.3 190.0" fill="none" stroke="#c9d1d8" stroke-width="0.8"/><text x="188.25" y="184.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#14181c" font-weight="bold">washer</text><text x="188.25" y="195.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="middle" fill="#6b757e" font-weight="normal">1.52</text><path d="M201.2 227.0 L201.2 211.0 L231.6 205.0" fill="none" stroke="#c9d1d8" stroke-width="0.8"/><text x="231.56" y="199.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#14181c" font-weight="bold">washer</text><text x="231.56" y="210.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="middle" fill="#6b757e" font-weight="normal">1.52</text><path d="M226.0 227.0 L226.0 196.0 L274.9 190.0" fill="none" stroke="#c9d1d8" stroke-width="0.8"/><text x="274.86" y="184.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#14181c" font-weight="bold">strut web</text><text x="274.86" y="195.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="middle" fill="#6b757e" font-weight="normal">1.78</text><path d="M289.6 227.0 L289.6 211.0 L318.2 205.0" fill="none" stroke="#c9d1d8" stroke-width="0.8"/><text x="318.16" y="199.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#14181c" font-weight="bold">channel nut</text><text x="318.16" y="210.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="middle" fill="#6b757e" font-weight="normal">6.70</text><line x1="121.7" y1="374.0" x2="239.3" y2="374.0" stroke="#0a8f6f" stroke-width="1.6"/><line x1="121.7" y1="369.0" x2="121.7" y2="379.0" stroke="#0a8f6f" stroke-width="1.6"/><line x1="239.3" y1="369.0" x2="239.3" y2="379.0" stroke="#0a8f6f" stroke-width="1.6"/><text x="180.50" y="368.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="middle" fill="#0a8f6f" font-weight="bold">GRIP 7.84</text><text x="80.00" y="408.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#0a8f6f" font-weight="bold">bolt: grip 7.84 + nut 6.70 + 3 run-out = 17.54  -&gt;  0.75 in (19.05)</text><text x="56.00" y="430.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">square shoulder in the clamp's square hole, so the bolt cannot spin. The TWO</text><text x="56.00" y="443.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">washers stand in for the foot leg that is not here — without them the strut</text><text x="56.00" y="456.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">is held off at the bottom and hard against the panel at the top, and it</text><text x="56.00" y="469.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">leans</text><rect x="770.0" y="100.0" width="700.0" height="420.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="786.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">J2   LOWER CLAMP + FOOT to STRUT — ONE BOLT</text><rect x="810.0" y="230.0" width="41.7" height="104.0" fill="#4a545e" st