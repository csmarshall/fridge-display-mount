<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700"><rect width="1180" height="700" fill="#fbfcfd"/><rect width="1180" height="24" fill="#b8860b"/><text x="590.00" y="16.50" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">ASSEMBLY — order matters; tightening early is the way to get this wrong</text><text x="40.00" y="56.00" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#14181c" font-weight="bold">HOW IT GOES TOGETHER</text><text x="40.00" y="78.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#6b757e" font-weight="normal">Four steps. Everything stays loose until the last one, because the fridge is what squares it up.</text><rect x="40.0" y="100.0" width="540.0" height="185.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#b8860b" font-weight="bold">1  STAND THE STRUTS ON THE FEET</text><text x="56.00" y="150.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">Stud through the foot's slot and the strut's bottom slot. Nut</text><text x="56.00" y="163.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">FINGER TIGHT. The slot is the height adjustment, so leaving it</text><text x="56.00" y="176.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">loose is the whole point.</text><rect x="56.0" y="240.0" width="92" height="22" rx="11" fill="#b8860b" fill-opacity="0.14"/><text x="66.00" y="255.00" font-family="Helvetica,Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#b8860b" font-weight="bold">leave it loose</text><rect x="610.0" y="100.0" width="540.0" height="185.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="626.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#b8860b" font-weight="bold">2  HOOK THE TOP CLAMP BAR OVER</text><text x="626.00" y="150.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">ONE bar across both struts. Long leg on the fridge top, short</text><text x="626.00" y="163.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">leg down beside them, washers behind. Nuts on, still loose.</text><text x="626.00" y="176.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">Because it reaches both struts it SETS the spacing for you</text><text x="626.00" y="189.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">rather than needing it measured.</text><rect x="626.0" y="240.0" width="92" height="22" rx="11" fill="#b8860b" fill-opacity="0.14"/><text x="636.00" y="255.00" font-family="Helvetica,Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#b8860b" font-weight="bold">leave it loose</text><rect x="40.0" y="310.0" width="540.0" height="185.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="334.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#b8860b" font-weight="bold">3  SLIDE THE LOWER BAR UP</text><text x="56.00" y="360.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">Up until its two pads engage under the appliance. Pads, not a</text><text x="56.00" y="373.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">continuous edge, because the underside is not flat. This is</text><text x="56.00" y="386.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">the step that needs a torch and the one with an open question</text><text x="56.00" y="399.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">against it.</text><rect x="56.0" y="450.0" width="92" height="22" rx="11" fill="#b8860b" fill-opacity="0.14"/><text x="66.00" y="465.00" font-family="Helvetica,Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#b8860b" font-weight="bold">leave it loose</text><rect x="610.0" y="310.0" width="540.0" height="185.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="626.00" y="334.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">4  PLATE ON, THEN THE DISPLAY — IN THAT ORDER</text><text x="626.00" y="360.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">The plate-to-strut bolt heads sit on the display side. Once</text><text x="626.00" y="373.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">the display is mounted they cannot be reached, so the plate</text><text x="626.00" y="386.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">goes on first and the display last.</text><rect x="626.0" y="450.0" width="92" height="22" rx="11" fill="#0a8f6f" fill-opacity="0.14"/><text x="636.00" y="465.00" font-family="Helvetica,Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#0a8f6f" font-weight="bold">leave it TIGHT</text><rect x="40.0" y="520.0" width="540.0" height="185.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="544.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">5  LOCK EVERYTHING</text><text x="56.00" y="570.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">Top first, then bottom, then the feet. The struts go into</text><text x="56.00" y="583.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">tension between the two clamps and the fridge is gripped</text><text x="56.00" y="596.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">rather than leaned on.</text><rect x="56.0" y="660.0" width="92" height="22" rx="11" fill="#0a8f6f" fill-opacity="0.14"/><text x="66.00" y="675.00" font-family="Helvetica,Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#0a8f6f" font-weight="bold">leave it TIGHT</text><rect x="40.0" y="530.0" width="1100.0" height="140.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="554.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#b00020" font-weight="bold">THE ONE THING THAT WILL BITE</text><text x="56.00" y="580.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">Tightening the top bar before the lower one is engaged pulls the struts against the panel at an angle and they will not then slide. The struts are</text><text x="56.00" y="593.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">1829 mm of stiff channel; there is no compliance in them to take that out afterwards. If a lower clamp will not move, slacken the top and start again</text><text x="56.00" y="606.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">rather than forcing it. Only the 3 mm foam has any give at all, and it has 3 mm of it.</text></svg>