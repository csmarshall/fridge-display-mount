<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="940" viewBox="0 0 1420 940"><rect width="1420" height="940" fill="#fbfcfd"/><rect width="1420" height="24" fill="#b8860b"/><text x="710.00" y="16.50" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">PLATE — the link that was dimensioned but never drawn</text><text x="40.00" y="56.00" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#14181c" font-weight="bold">WHAT HOLDS THE MONITOR</text><text x="40.00" y="78.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#6b757e" font-weight="normal">Part C, the plate. The display bolts to it, it bolts to the struts, and the struts stand on the floor. The fridge carries none of the weight.</text><rect x="40.0" y="100.0" width="600.0" height="800.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">PLATE — 310 x 310 x 3.02, x1</text><rect x="88.9" y="278.9" width="502.2" height="502.2" rx="4" fill="#b9c2c9" stroke="#14181c" stroke-width="1.5"/><rect x="431.5" y="512.2" width="100.4" height="35.6" rx="17.8" fill="#fbfcfd" stroke="#14181c" stroke-width="1.2"/><rect x="322.2" y="338.0" width="35.6" height="100.4" rx="17.8" fill="#fbfcfd" stroke="#14181c" stroke-width="1.2"/><rect x="148.0" y="512.2" width="100.4" height="35.6" rx="17.8" fill="#fbfcfd" stroke="#14181c" stroke-width="1.2"/><rect x="322.2" y="621.5" width="35.6" height="100.4" rx="17.8" fill="#fbfcfd" stroke="#14181c" stroke-width="1.2"/><circle cx="340.0" cy="530.0" r="141.8" fill="none" stroke="#b8860b" stroke-width="0.9" stroke-dasharray="5 4"/><text x="340.00" y="380.25" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#b8860b" font-weight="bold">vents on R87.5</text><circle cx="259.0" cy="449.0" r="3.6" fill="#fbfcfd" stroke="#14181c" stroke-width="1.2"/><circle cx="259.0" cy="611.0" r="3.6" fill="#fbfcfd" stroke="#14181c" stroke-width="1.2"/><circle cx="421.0" cy="449.0" r="3.6" fill="#fbfcfd" stroke="#14181c" stroke-width="1.2"/><circle cx="421.0" cy="611.0" r="3.6" fill="#fbfcfd" stroke="#14181c" stroke-width="1.2"/><rect x="259.0" y="449.0" width="162.0" height="162.0" fill="none" stroke="#0a8f6f" stroke-width="0.9" stroke-dasharray="4 3"/><text x="340.00" y="535.00" font-family="Helvetica,Arial,sans-serif" font-size="9.4" text-anchor="middle" fill="#0a8f6f" font-weight="bold">VESA 100</text><circle cx="140.7" cy="406.6" r="6.9" fill="#fbfcfd" stroke="#b00020" stroke-width="1.4"/><circle cx="140.7" cy="653.4" r="6.9" fill="#fbfcfd" stroke="#b00020" stroke-width="1.4"/><circle cx="539.3" cy="406.6" r="6.9" fill="#fbfcfd" stroke="#b00020" stroke-width="1.4"/><circle cx="539.3" cy="653.4" r="6.9" fill="#fbfcfd" stroke="#b00020" stroke-width="1.4"/><line x1="140.7" y1="264.9" x2="140.7" y2="795.1" stroke="#b00020" stroke-width="0.7" stroke-dasharray="3 4"/><line x1="539.3" y1="264.9" x2="539.3" y2="795.1" stroke="#b00020" stroke-width="0.7" stroke-dasharray="3 4"/><text x="340.00" y="256.90" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#b00020" font-weight="bold">strut centres 246</text><text x="581.10" y="526.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="end" fill="#b00020" font-weight="bold">152.4 apart</text><text x="581.10" y="538.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="end" fill="#b00020" font-weight="normal">= 3 slot pitches</text><text x="340.00" y="807.10" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#6b757e" font-weight="normal">310 square — hides behind the display in BOTH orientations</text><rect x="660.0" y="100.0" width="340.0" height="800.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="676.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">THE CHAIN</text><rect x="682" y="150.0" width="296" height="46" rx="6" fill="#b9c2c9" fill-opacity="0.9" stroke="#14181c" stroke-width="1.1"/><text x="700.00" y="171.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">THE DISPLAY</text><text x="960.00" y="171.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#6b757e" font-weight="normal">3.94 kg</text><line x1="830" y1="196.0" x2="830" y2="218.0" stroke="#14181c" stroke-width="2"/><path d="M825 212.0 L830 220.0 L835 212.0" fill="#14181c"/><text x="844.00" y="208.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="start" fill="#6b757e" font-weight="normal">4 x M4 into the VESA inserts, on SPACERS</text><rect x="682" y="226.0" width="296" height="46" rx="6" fill="#b9c2c9" fill-opacity="0.9" stroke="#14181c" stroke-width="1.1"/><text x="700.00" y="247.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">THE PLATE</text><text x="960.00" y="247.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#6b757e" font-weight="normal">310 sq</text><line x1="830" y1="272.0" x2="830" y2="294.0" stroke="#14181c" stroke-width="2"/><path d="M825 288.0 L830 296.0 L835 288.0" fill="#14181c"/><text x="844.00" y="284.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="start" fill="#6b757e" font-weight="normal">4 bolts at 246 x 152.4 into the strut</text><text x="844.00" y="295.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="start" fill="#6b757e" font-weight="normal">slots</text><rect x="682" y="313.0" width="296" height="46" rx="6" fill="#8f9aa4" fill-opacity="0.9" stroke="#14181c" stroke-width="1.1"/><text x="700.00" y="334.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#fff" font-weight="bold">THE STRUTS</text><text x="960.00" y="334.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#fff" font-weight="normal">x2</text><line x1="830" y1="359.0" x2="830" y2="381.0" stroke="#14181c" stroke-width="2"/><path d="M825 375.0 L830 383.0 L835 375.0" fill="#14181c"/><text x="844.00" y="371.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="start" fill="#6b757e" font-weight="normal">stand on</text><rect x="682" y="389.0" width="296" height="46" rx="6" fill="#4a545e" fill-opacity="0.9" stroke="#14181c" stroke-width="1.1"/><text x="700.00" y="410.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#fff" font-weight="bold">THE FEET</text><text x="960.00" y="410.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#fff" font-weight="normal">x2</text><line x1="830" y1="435.0" x2="830" y2="457.0" stroke="#14181c" stroke-width="2"/><path d="M825 451.0 L830 459.0 L835 451.0" fill="#14181c"/><text x="844.00" y="447.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="start" fill="#6b757e" font-weight="normal">rest on</text><rect x="682" y="465.0" width="296" height="46" rx="6" fill="#2f6f4f" fill-opacity="0.9" stroke="#14181c" stroke-width="1.1"/><text x="700.00" y="486.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#fff" font-weight="bold">THE FLOOR</text><text x="960.00" y="486.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#fff" font-weight="normal">154 N</text><rect x="682" y="535.0" width="296" height="112" rx="6" fill="#fff" stroke="#b8860b" stroke-width="1.4"/><text x="700.00" y="557.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#b8860b" font-weight="bold">THE CLAMP BARS x2</text><text x="700.00" y="575.00" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="start" fill="#6b757e" font-weight="normal">Grip the fridge top and its underside.</text><text x="700.00" y="587.00" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="start" fill="#6b757e" font-weight="normal">They carry ZERO weight — they only</text><text x="700.00" y="599.00" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="start" fill="#6b757e" font-weight="normal">stop the frame falling away from the</text><text x="700.00" y="611.00" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="start" fill="#6b757e" font-weight="normal">panel.</text><rect x="1020.0" y="100.0" width="360.0" height="800.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="1036.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">SO, WHAT HOLDS IT?</text><text x="1036.00" y="146.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">Nothing holds it TO the fridge. The FLOOR</text><text x="1036.00" y="159.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">holds it up, the way a bookcase stands on</text><text x="1036.00" y="172.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">the floor and leans on a wall. The fridge</text><text x="1036.00" y="185.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">only stops it tipping away.</text><text x="1036.00" y="226.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">That is the whole point of the change. The</text><text x="1036.00" y="239.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">magnet design really did hang off the</text><text x="1036.00" y="252.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">fridge, so every question was about how</text><text x="1036.00" y="265.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">hard it gripped. Here the grip carries</text><text x="1036.00" y="278.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">nothing, so a non-magnetic panel, paint</text><text x="1036.00" y="291.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">creep and peel all stop mattering.</text><text x="1036.00" y="340.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">The vent windows are not decoration. They</text><text x="1036.00" y="353.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">sit on R87.5 rather than a margin from the</text><text x="1036.00" y="366.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">edge, so one lands over the Pi's fan and</text><text x="1036.00" y="379.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">GPIO opening in EVERY 90 degree rotation</text><text x="1036.00" y="392.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">of the plate. A solid plate there cooks</text><text x="1036.00" y="405.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">the Pi.</text><text x="1036.00" y="460.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">The bolt rows are 152.4 apart because that</text><text x="1036.00" y="473.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">is exactly three slot pitches. Both rows</text><text x="1036.00" y="486.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">then sit identically in their slots; a</text><text x="1036.00" y="499.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">round 150 would put one row mid-slot and</text><text x="1036.00" y="512.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">the other near its end, and the plate</text><text x="1036.00" y="525.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">would only mount at certain heights.</text><text x="1036.00" y="590.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#b8860b" font-weight="normal">ORIENTATION IS FORCED. Portrait spans 74</text><text x="1036.00" y="603.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#b8860b" font-weight="normal">to 398 on a 610 deep case and fits.</text><text x="1036.00" y="616.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#b8860b" font-weight="normal">LANDSCAPE would hang 41.5 mm off the REAR</text><text x="1036.00" y="629.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#b8860b" font-weight="normal">edge, and cannot be slid forward to fix</text><text x="1036.00" y="642.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#b8860b" font-weight="normal">it: the clamp must stay inside the 406.6</text><text x="1036.00" y="655.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#b8860b" font-weight="normal">mm window. Centring landscape needs a</text><text x="1036.00" y="668.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#b8860b" font-weight="normal">strut centre of 304.8, which is 48.7 mm</text><text x="1036.00" y="681.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#b8860b" font-weight="normal">into the cover.</text><text x="1036.00" y="700.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#b00020" font-weight="normal">STILL OPEN: the bolt heads sit between the</text><text x="1036.00" y="713.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#b00020" font-weight="normal">plate and the strut, so they must clear</text><text x="1036.00" y="726.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#b00020" font-weight="normal">the display's rear box. The box is 260 x</text><text x="1036.00" y="739.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#b00020" font-weight="normal">134 and the bolts are 246 apart, so they</text><text x="1036.00" y="752.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#b00020" font-weight="normal">fall just outside it — worth confirming</text><text x="1036.00" y="765.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#b00020" font-weight="normal">against the real panel.</text></svg>