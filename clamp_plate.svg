<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="940" viewBox="0 0 1420 940"><rect width="1420" height="940" fill="#fbfcfd"/><rect width="1420" height="24" fill="#b8860b"/><text x="710.00" y="16.50" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">PLATE — the link that was dimensioned but never drawn</text><text x="40.00" y="56.00" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#14181c" font-weight="bold">WHAT HOLDS THE MONITOR</text><text x="40.00" y="78.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#6b757e" font-weight="normal">Part C, the plate. The display bolts to it, it bolts to the struts, and the struts stand on the floor. The fridge carries none of the weight.</text><rect x="40.0" y="100.0" width="600.0" height="800.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">PLATE — 297 x 152 x 3.02, x1</text><path d="M99.8 406.7 L299.5 406.7 L299.5 428.8 L380.5 428.8 L380.5 406.7 L580.2 406.7 L580.2 653.3 L380.5 653.3 L380.5 631.2 L299.5 631.2 L299.5 653.3 L99.8 653.3 Z" fill="#b9c2c9" stroke="#14181c" stroke-width="1.5"/><line x1="273.5" y1="428.8" x2="295.5" y2="428.8" stroke="#b8860b" stroke-width="1"/><line x1="273.5" y1="631.2" x2="295.5" y2="631.2" stroke="#b8860b" stroke-width="1"/><text x="269.50" y="432.75" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="end" fill="#b8860b" font-weight="bold">notch 13.6 deep</text><line x1="280.0" y1="388.2" x2="400.0" y2="388.2" stroke="#b00020" stroke-width="1.1" stroke-dasharray="5 4"/><rect x="280.0" y="380.1" width="120" height="16.2" fill="#b00020" fill-opacity="0.10"/><line x1="280.0" y1="671.8" x2="400.0" y2="671.8" stroke="#b00020" stroke-width="1.1" stroke-dasharray="5 4"/><rect x="280.0" y="663.6" width="120" height="16.2" fill="#b00020" fill-opacity="0.10"/><text x="404.00" y="384.25" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="start" fill="#b00020" font-weight="bold">Pi opening</text><text x="404.00" y="395.25" font-family="Helvetica,Arial,sans-serif" font-size="8.0" text-anchor="start" fill="#b00020" font-weight="normal">R87.5 +/-5, SCALED</text><circle cx="259.0" cy="449.0" r="3.6" fill="#fbfcfd" stroke="#14181c" stroke-width="1.2"/><circle cx="259.0" cy="611.0" r="3.6" fill="#fbfcfd" stroke="#14181c" stroke-width="1.2"/><circle cx="421.0" cy="449.0" r="3.6" fill="#fbfcfd" stroke="#14181c" stroke-width="1.2"/><circle cx="421.0" cy="611.0" r="3.6" fill="#fbfcfd" stroke="#14181c" stroke-width="1.2"/><rect x="259.0" y="449.0" width="162.0" height="162.0" fill="none" stroke="#0a8f6f" stroke-width="0.9" stroke-dasharray="4 3"/><text x="340.00" y="535.00" font-family="Helvetica,Arial,sans-serif" font-size="9.4" text-anchor="middle" fill="#0a8f6f" font-weight="bold">VESA 100</text><circle cx="140.7" cy="447.7" r="6.9" fill="#fbfcfd" stroke="#b00020" stroke-width="1.4"/><circle cx="140.7" cy="612.3" r="6.9" fill="#fbfcfd" stroke="#b00020" stroke-width="1.4"/><circle cx="539.3" cy="447.7" r="6.9" fill="#fbfcfd" stroke="#b00020" stroke-width="1.4"/><circle cx="539.3" cy="612.3" r="6.9" fill="#fbfcfd" stroke="#b00020" stroke-width="1.4"/><line x1="140.7" y1="392.7" x2="140.7" y2="667.3" stroke="#b00020" stroke-width="0.7" stroke-dasharray="3 4"/><line x1="539.3" y1="392.7" x2="539.3" y2="667.3" stroke="#b00020" stroke-width="0.7" stroke-dasharray="3 4"/><text x="340.00" y="384.73" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#b00020" font-weight="bold">strut centres 246</text><text x="453.27" y="526.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="end" fill="#b00020" font-weight="bold">101.6 apart</text><text x="453.27" y="538.00" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="end" fill="#b00020" font-weight="normal">= 2 slot pitches</text><text x="340.00" y="687.27" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#6b757e" font-weight="normal">297 x 152.2 — sits BELOW the Pi opening instead of covering it</text><rect x="660.0" y="100.0" width="340.0" height="800.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="676.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">THE CHAIN</text><rect x="682" y="150.0" width="296" height="46" rx="6" fill="#b9c2c9" fill-opacity="0.9" stroke="#14181c" stroke-width="1.1"/><text x="700.00" y="171.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">THE DISPLAY</text><text x="960.00" y="171.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#6b757e" font-weight="normal">3.94 kg</text><line x1="830" y1="196.0" x2="830" y2="218.0" stroke="#14181c" stroke-width="2"/><path d="M825 212.0 L830 220.0 L835 212.0" fill="#14181c"/><text x="844.00" y="208.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="start" fill="#6b757e" font-weight="normal">4 x M4 into the VESA inserts, on SPACERS</text><rect x="682" y="226.0" width="296" height="46" rx="6" fill="#b9c2c9" fill-opacity="0.9" stroke="#14181c" stroke-width="1.1"/><text x="700.00" y="247.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">THE PLATE</text><text x="960.00" y="247.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#6b757e" font-weight="normal">297x152</text><line x1="830" y1="272.0" x2="830" y2="294.0" stroke="#14181c" stroke-width="2"/><path d="M825 288.0 L830 296.0 L835 288.0" fill="#14181c"/><text x="844.00" y="284.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="start" fill="#6b757e" font-weight="normal">4 bolts at 246 x 101.6 into the strut</text><text x="844.00" y="295.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="start" fill="#6b757e" font-weight="normal">slots</text><rect x="682" y="313.0" width="296" height="46" rx="6" fill="#8f9aa4" fill-opacity="0.9" stroke="#14181c" stroke-width="1.1"/><text x="700.00" y="334.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#fff" font-weight="bold">THE STRUTS</text><text x="960.00" y="334.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#fff" font-weight="normal">x2</text><line x1="830" y1="359.0" x2="830" y2="381.0" stroke="#14181c" stroke-width="2"/><path d="M825 375.0 L830 383.0 L835 375.0" fill="#14181c"/><text x="844.00" y="371.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="start" fill="#6b757e" font-weight="normal">stand on</text><rect x="682" y="389.0" width="296" height="46" rx="6" fill="#4a545e" fill-opacity="0.9" stroke="#14181c" stroke-width="1.1"/><text x="700.00" y="410.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#fff" font-weight="bold">THE FEET</text><text x="960.00" y="410.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#fff" font-weight="normal">x2</text><line x1="830" y1="435.0" x2="830" y2="457.0" stroke="#14181c" stroke-width="2"/><path d="M825 451.0 L830 459.0 L835 451.0" fill="#14181c"/><text x="844.00" y="447.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="start" fill="#6b757e" font-weight="normal">rest on</text><rect x="682" y="465.0" width="296" height="46" rx="6" fill="#2f6f4f" fill-opacity="0.9" stroke="#14181c" stroke-width="1.1"/><text x="700.00" y="486.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#fff" font-weight="bold">THE FLOOR</text><text x="960.00" y="486.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#fff" font-weight="normal">154 N</text><rect x="682" y="535.0" width="296" height="112" rx="6" fill="#fff" stroke="#b8860b" stroke-width="1.4"/><text x="700.00" y="557.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#b8860b" font-weight="bold">THE CLAMP BARS x2</text><text x="700.00" y="575.00" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="start" fill="#6b757e" font-weight="normal">Grip the fridge top and its underside.</text><text x="700.00" y="587.00" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="start" fill="#6b757e" font-weight="normal">They carry ZERO weight — they only</text><text x="700.00" y="599.00" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="start" fill="#6b757e" font-weight="normal">stop the frame falling away from the</text><text x="700.00" y="611.00" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="start" fill="#6b757e" font-weight="normal">panel.</text><rect x="1020.0" y="100.0" width="360.0" height="800.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="1036.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">SO, WHAT HOLDS IT?</text><text x="1036.00" y="146.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="normal">Nothing holds it TO the fridge. The FLOOR</text><text x="1036.00" y="158.40" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="normal">holds it up, the way a bookcase stands on</text><text x="1036.00" y="170.80" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="normal">the floor and leans on a wall. The fridge</text><text x="1036.00" y="183.20" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="normal">only stops it tipping away.</text><text x="1036.00" y="210.60" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">That is the whole point of the change. The</text><text x="1036.00" y="223.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">magnet design really did hang off the</text><text x="1036.00" y="235.40" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">fridge, so every question was about how</text><text x="1036.00" y="247.80" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">hard it gripped. Here the grip carries</text><text x="1036.00" y="260.20" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">nothing, so a non-magnetic panel, paint</text><text x="1036.00" y="272.60" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">creep and peel all stop mattering.</text><text x="1036.00" y="300.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">A solid plate over the Pi's fan and GPIO</text><text x="1036.00" y="312.40" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">opening cooks it. The old plate was 279</text><text x="1036.00" y="324.80" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">tall PURELY to carry vent windows over an</text><text x="1036.00" y="337.20" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">opening it never needed to reach. At 152.2</text><text x="1036.00" y="349.60" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">it stops +13.6 mm short of where that</text><text x="1036.00" y="362.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">opening could sit at worst, so there is</text><text x="1036.00" y="374.40" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">nothing to vent.</text><text x="1036.00" y="401.80" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">The 2 edge notches are insurance, not</text><text x="1036.00" y="414.20" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">cooling. The radius was SCALED off a</text><text x="1036.00" y="426.60" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">raster drawing (+/-5) and the opening's</text><text x="1036.00" y="439.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">own size is not published at all. Their</text><text x="1036.00" y="451.40" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">13.6 mm depth is derived from that</text><text x="1036.00" y="463.80" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">uncertainty.</text><text x="1036.00" y="491.20" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">Bolt rows are 101.6 apart — exactly 2 slot</text><text x="1036.00" y="503.60" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">pitches, so both sit identically in their</text><text x="1036.00" y="516.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">slots. Putting them ABOVE and BELOW the</text><text x="1036.00" y="528.40" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">box instead needs 6 pitches and a plate</text><text x="1036.00" y="540.80" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">2.3x taller, whose edge would reach past</text><text x="1036.00" y="553.20" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">the Pi opening and bring the vent windows</text><text x="1036.00" y="565.60" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">back.</text><text x="1036.00" y="593.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b8860b" font-weight="normal">ORIENTATION IS FORCED. Landscape would</text><text x="1036.00" y="605.40" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b8860b" font-weight="normal">hang 41.5 mm off the REAR edge and cannot</text><text x="1036.00" y="617.80" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b8860b" font-weight="normal">be slid forward: the clamp must stay</text><text x="1036.00" y="630.20" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b8860b" font-weight="normal">inside the 406.6 mm window.</text><text x="1036.00" y="657.60" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">Heads sit on the DISPLAY side, so they</text><text x="1036.00" y="670.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">must not fall under the Pi bump-out. In</text><text x="1036.00" y="682.40" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">portrait the box is 134 wide and the bolts</text><text x="1036.00" y="694.80" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">246 apart, clearing by 56 mm — because the</text><text x="1036.00" y="707.20" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">STRUT SPACING is wider than the box, not</text><text x="1036.00" y="719.60" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">by luck of where the holes went.</text><text x="1036.00" y="747.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b00020" font-weight="normal">CONSEQUENCE: those heads are unreachable</text><text x="1036.00" y="759.40" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b00020" font-weight="normal">once the display is on. The plate goes on</text><text x="1036.00" y="771.80" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b00020" font-weight="normal">the struts BEFORE the display.</text></svg>