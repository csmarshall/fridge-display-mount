ans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="normal">two hands</text><text x="888.8" y="380.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#111" font-weight="bold">125 lb</text><text x="896.8" y="380.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="normal">&gt; two hands</text><text x="1192.0" y="380.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" fill="#0b7a4b" font-weight="bold">in the band</text><text x="40.0" y="402.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#5b6166" font-weight="bold">MM-C-36  O36 x 8 mm, 31.6 lb derated, $9.72 ea</text><rect x="34" y="420" width="1172" height="30" rx="5" fill="#0b7a4b" fill-opacity="0.07"/><text x="48.0" y="440.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111" font-weight="bold">4 x  $38.88</text><text x="341.2" y="440.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#111" font-weight="bold">39 lb</text><text x="349.2" y="440.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="normal">one hand</text><text x="523.8" y="440.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#111" font-weight="bold">48 lb</text><text x="531.8" y="440.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="normal">two hands</text><text x="706.2" y="440.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#111" font-weight="bold">49 lb</text><text x="714.2" y="440.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="normal">two hands</text><text x="888.8" y="440.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end