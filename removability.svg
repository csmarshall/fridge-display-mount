<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700"><rect width="1240" height="700" fill="#f7f8fa"/><text x="40.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" fill="#111" font-weight="bold">REMOVABILITY BAND — a bump must not shift it, a person must be able to</text><text x="40.0" y="66.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#5b6166" font-weight="normal">Force to move the mount each way, by magnet set, against three human references (ESTIMATES): bump 20 lb, one hand 45 lb, two hands 100 lb. Green = in the band: slide resistance at least 1.5x the bump, and two hands can lift it off.</text><text x="40.0" y="82.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#5b6166" font-weight="normal">Hangs 23.4 lb on the hook whichever set is fitted; the magnets only keep it flat. Slide credits magnet shear at mu 0.2 plus the weight on the arm&#x27;s EPDM skin at mu 0.6 (ESTIMATE, decided 2026-09-08).</text><text x="371.2" y="118.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#111" font-weight="bold">slide front-to-back</text><text x="371.2" y="132.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="middle" fill="#5b6166" font-weight="normal">bump / reposition</text><text x="553.8" y="118.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#111" font-weight="bold">press the screen edge to twist it off</text><text x="553.8" y="132.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="middle" fill="#5b6166" font-weight="normal">edge knock</text><text x="736.2" y="118.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#111" font-weight="bold">lift straight up (weight + shear)</text><text x="736.2" y="132.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="middle" fill="#5b6166" font-weight="normal">take it off</text><text x="918.8" y="118.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#111" font-weight="bold">peel the bottom edge out</text><text x="918.8" y="132.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="middle" fill="#5b6166" font-weight="normal">take it off, bottom first</text><line x1="40" y1="140" x2="1200" y2="140" stroke="#d0d4d8"/><text x="40.0" y="162.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#5b6166" font-weight="bold">MM-C-25  O25 x 8 mm, 17.0 lb derated, $5.04 ea</text><rect x="34" y="180" width="1172" height="30" rx="5" fill="#b8860b" fill-opacity="0.07"/><text x="48.0" y="200.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111" font-weight="bold">4 x  $20.16</text><text x="341.2" y="200.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#111" font-weight="bold">28 lb</text><text x="349.2" y="200.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="normal">one hand</text><text x="523.8" y="200.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#111" font-weight="bold">26 lb</text><text x="531.8" y="200.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="normal">one hand</text><text x="706.2" y="200.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#111" font-weight="bold">37 lb</text><text x="714.2" y="200.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="normal">one hand</text><text x="888.8" y="200.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#111" font-weight="bold">41 lb</text><text x="896.8" y="200.0" font-