2" height="30" rx="5" fill="#0b7a4b" fill-opacity="0.07"/><text x="48.0" y="500.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111" font-weight="bold">8 x  $77.76</text><text x="341.2" y="500.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#111" font-weight="bold">65 lb</text><text x="349.2" y="500.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="normal">two hands</text><text x="523.8" y="500.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#111" font-weight="bold">72 lb</text><text x="531.8" y="500.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="normal">two hands</text><text x="706.2" y="500.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#111" font-weight="bold">74 lb</text><text x="714.2" y="500.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="normal">two hands</text><text x="888.8" y="500.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#111" font-weight="bold">151 lb</text><text x="896.8" y="500.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="normal">&gt; two hands</text><text x="1192.0" y="500.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" fill="#0b7a4b" font-weight="bold">in the band</text><line x1="40" y1="530" x2="1200" y2="530" stroke="#d0d4d8"/><text x="40.0" y="550.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#5b6166" font-weight="normal">Read across a row: the smallest number is what a bump has to beat (slide). The lift figure is what it takes to get it off the fridge the intended way; peel is the hard way and is high on every set because eight levers fight it.</text><text x="40.0" y="566.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#5b6166" font-weight="normal">Nothing on this sheet drops the screen: the hook carries the weight. A set above the band is not unsafe, it is inconvenient — repositioning becomes a two-person job. A set below it walks when the fridge door slams.</text><text x="40.0" y="582.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#5b6166" font-weight="normal">The 35 % derate flatters thin magnets on painted sheet; a measured pull on the actual panel would move every number here by the same factor. The human references are round numbers; move them at the top of removability.py and the verdicts follow.</text></svg>