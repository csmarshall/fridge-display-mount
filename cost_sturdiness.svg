ly="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" fill="#b02a2a" font-weight="bold">BUMP MARGIN right of this line</text><line x1="40" y1="612" x2="1140" y2="612" stroke="#d0d4d8"/><text x="40.0" y="626.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#111" font-weight="normal">Cheapest viable cell: A36/1008 .104 in with 6 x MM-C-32 = $219.53 (flex 0.128 mm, slide 32 lb).</text><text x="40.0" y="642.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#111" font-weight="bold">Chosen: A36/1008 .187 in with 8 x = $261.02. The extra $41.49 buys 6x less flex and 1.3x the slide resistance — margin against the 35 % magnet derate, which is the number nobody has measured.</text><text x="40.0" y="658.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#5b6166" font-weight="normal">Diminishing returns: every plate dearer than 0.187 in steel either flexes more (grey) or removes flex no finger can feel; every magnet past 8 needs holes the plate does not have. The chosen cell is the corner of the viable region, not the middle of it.</text></svg>