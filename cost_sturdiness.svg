<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="808" viewBox="0 0 1180 808"><rect width="1180" height="808" fill="#f7f8fa"/><text x="40.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" fill="#111" font-weight="bold">COST vs STURDINESS — plate gauge x MM-C-32 count, live prices, cutoffs drawn</text><text x="40.0" y="66.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#5b6166" font-weight="normal">Each cell: plate (bent, black powder coat, SendCutSend 2026-09-08) + magnets at the 5-9 break. Row = how much the screen edge moves under a 5 lb press; column = how hard a bump must push to slide the mount.</text><text x="40.0" y="82.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#5b6166" font-weight="normal">Red lines are the cutoffs: feels rigid (&lt; 0.2 mm) and bump margin (slide &gt;= 30 lb). Grey rows cost more than 0.187 in steel and flex more — nothing to buy there. Green = chosen.</text><text x="40.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="bold">PLATE</text><text x="40.0" y="134.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" text-anchor="start" fill="#5b6166" font-weight="normal">material / gauge, flex, plate price</text><text x="498.3" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">4 x MM-C-32   $30.56</text><text x="498.3" y="134.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="middle" fill="#b02a2a" font-weight="normal">slide 21 lb — under the bump margin</text><text x="755.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">6 x MM-C-32   $45.84</text><text x="755.0" y="134.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="middle" fill="#0b7a4b" font-weight="normal">slide 32 lb — bump margin OK</text><text x="1011.7" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">8 x MM-C-32   $61.12</text><text x="1011.7" y="134.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="middle" fill="#0b7a4b" font-weight="normal">slide 42 lb — bump margin OK</text><line x1="40" y1="142" x2="1140" y2="142" stroke="#d0d4d8"/><text x="40.0" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111" font-weight="bold">5052-H32 .100 in</text><text x="40.0" y="188.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="start" fill="#5b6166" font-weight="normal">flex 0.409 mm   plate $159.16   1.06 kg   neck 19x</text><text x="498.3" y="176.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#5b6166" font-weight="bold">$189.72</text><text x="498.3" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="middle" fill="#5b6166" font-weight="normal">flexible</text><text x="755.0" y="176.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#5b6166" font-weight="bold">$205.00</text><text x="755.0" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="middle" fill="#5b6166" font-weight="normal">flexible</text><text x="1011.7" y="176.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#5b6166" font-weight="bold">$220.28</text><text x="1011.7" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="middle" fill="#5b6166" font-weight="normal">flexible</text><text x="40.0" y="228.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#111" font-weight="bold">5052-H32 .125 in</text><text x="40.0" y="244.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor=