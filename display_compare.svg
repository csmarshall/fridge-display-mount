<text x="741.7" y="450.9" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="start" fill="#5d3600" font-weight="normal">plate hidden by 29 mm/side</text>
<rect x="60" y="759" width="11" height="11" fill="#2e9e5b"/>
<text x="80.0" y="769.2" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">Both fit portrait comfortably. The 27 in is 42 mm wider front-to-back and still leaves 179 mm of the window spare.</text>
<rect x="60" y="785" width="11" height="11" fill="#5d3600"/>
<text x="80.0" y="795.2" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">The 27 in HIDES THE PLATE BETTER: 367 mm wide against the 310 mm body gives 28.7 mm of overhang per side, versus 7.3 mm on the 23.8 in.</text>
<rect x="60" y="811" width="11" height="11" fill="#1a5fb4"/>
<text x="80.0" y="821.2" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">Identical bracket either way — same rear box, same VESA, same fan radius. The DXF is geometrically identical; only the load case changes.</text>
<rect x="60" y="837" width="11" height="11" fill="#b00020"/>
<text x="80.0" y="847.2" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">The 27 in hangs 1 kg heavier and reaches 97 mm from the fridge top down to 1016 mm. Magnet safety factor 6.4x versus 7.2x — both ample.</text>
</svg>