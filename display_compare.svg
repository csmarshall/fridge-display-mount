<text x="40.0" y="60.0" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#111" font-weight="bold">Which panel, in portrait, on the counter-depth side</text>
<text x="40.0" y="82.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#555" font-weight="normal">Same view as before: horizontal axis is the fridge's depth. In portrait the display's WIDTH runs front-to-back, so both fit the 546 mm window easily.</text>
<text x="40.0" y="99.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#555" font-weight="normal">Neck 262 mm puts the screen centre at 1326 mm for either panel — the VESA centre does not move.</text>
<text x="159.9" y="153.0" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="middle" fill="#1a5fb4" font-weight="bold">23.8 in</text>
