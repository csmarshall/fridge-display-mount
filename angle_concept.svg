ce 64 mm off the panel (8 magnet + 6.35 bar + 6.35 plate + 25 box + 18)</text><rect x="590" y="104" width="520" height="760" rx="7" fill="#fff" stroke="#d0d4d8"/><text x="606.0" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#111" font-weight="bold">LOOKING AT THE PANEL — front, true scale</text><rect x="756.4" y="212.5" width="187.2" height="627.5" fill="#3a3734"/><rect x="795.1" y="212.5" width="109.7" height="18.3" fill="#9aa4ad" stroke="#111" stroke-width="0.8"/><text x="947.2" y="214.5" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="start" fill="#111" font-weight="bold">CLIP 2 x 2 x 1/4 angle, 12 in</text><line x1="904.9" y1="211.5" x2="945.8" y2="211.5" stroke="#5b6166" stroke-width="0.7"/><rect x="795.9" y="216.4" width="18.3" height="215.6" fill="#9aa4ad" stroke="#111" stroke-width="0.8" opacity="0.92"/><circle cx="805.0" cy="407.5" r="6.5" fill="#c0169a" fill-opacity="0.55" stroke="#c0169a" stroke-dasharray="3 2"/><circle cx="805.0" cy="314.2" r="6.5" fill="#c0169a" fill-opacity="0.55" stroke="#c0169a" stroke-dasharray="3 2"/><circle cx="805.0" cy="220.0" r="2.2" fill="#111"/><circle cx="805.0" cy="227.2" r="2.2" fill="#111"/><rect x="885.9" y="216.4" width="18.3" height="215.6" fill="#9aa4ad" stroke="#111" stroke-width="0.8" opacity="0.92"/><circle cx="895.0" cy="407.5" r="6.5" fill="#c0169a" fill-opacity="0.55" stroke="#c0169a" stroke-dasharray="3 2"/><circle cx="895.0" cy="314.2" r="6.5" fill="#c0169a" fill-opacity="0.55" stroke="#c0169a" stroke-dasharray="3 2"/><circle cx="895.0" cy="220.0" r="2.2" fill="#111"/><circle cx="895.0" cy="227.2" r="2.2" fill="#111"/><rect x="813.4" y="324.3" width="73.2" height="73.2" fill="#9aa4ad" stroke="#111" stroke-width="0.8" opacity="0.85"/><circle cx="832.0" cy="378.8" r="2.4" fill="none" stroke="#1a5fb4" stroke-width="1.2"/><circle cx="832.0" cy="342.8" r="2.4" fill="none" stroke="#1a5fb4" stroke-width="1.2"/><circle cx="868.0" cy="378.8" r="2.4" fill="none" stroke="#1a5fb4" stroke-width="1.2"/><circle cx="868.0" cy="342.8" r="2.4" fill="none" stroke="#1a5fb4" stroke-width="1.2"/><rect x="791.6" y="260.9" width="116.9" height="199.9" rx="3" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="7 5"/><text x="947.2" y="264.9" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="start" fill="#111" font-weight="normal">display, 24 in portrait (dashed)</text><text x="947.2" y="364.8" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="start" fill="#111" font-weight="bold">PLATE 8 x 8 x 1/4, VESA 100</text><text x="947.2" y="318.2" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="start" fill="#c0169a" font-weight="bold">O36 magnets, 4</text><text x="947.2" y="235.6" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="start" fill="#111" font-weight="normal">bar-to-clip bolts</text><line x1="909.9" y1="260.9" x2="945.8" y2="260.9" stroke="#5b6166" stroke-width="0.7" stroke-dasharray="3 3"/><line x1="909.9" y1="360.8" x2="945.8" y2="360.8" stroke="#5b6166" stroke-width="0.7" stroke-dasharray="3 3"/><line x1="909.9" y1="314.2" x2="945.8" y2="314.2" stroke="#5b6166" stroke-width="0.7" stroke-dasharray="3 3"/><line x1="909.9" y1="223.6" x2="945.8" y2="223.6" stroke="#5b6166" stroke-width="0.7" stroke-dasharray="3 3"/><line x1="805.0" y1="854.0" x2="895.0" y2="854.0" stroke="#111" stroke-width="1.2"/><text x="850.0" y="870.0" font-family="Helvetica, Arial, sans-serif" font-size="9.4" text-anchor="middle" fill="#111" font-weight="bold">bar / magnet spacing 250 (floor 240)</text><rect x="1140" y="104" width="540" height="760" rx="7" fill="#fff" stroke="#d0d4d8"/><text x="1156.0" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#111" font-weight="bold">DERIVED NUMBERS</text><text x="1156.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#111" font-weight="normal">hanging on the clip</text><text x="1440.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" fill="#111" font-weight="bold">14.1 lb</text><text x="1452.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" text-anchor="start" fill="#5b6166" font-weight="normal">display + 2.27 kg of aluminium</text><text x="1156.0" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#111" font-weight="normal">bearing on the fridge top</text><text x="1440.0" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" fill="#111" font-weight="bold">0.59 psi</text><text x="1452.0" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" text-anchor="start" fill="#5b6166" font-weight="normal">2 in x 12 in on foam</text><text x="1156.0" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#111" font-weight="normal">clip corner vs fridge corner</text><text x="1440.0" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" fill="#111" font-weight="bold">2.6 mm lift</text><text x="1452.0" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" text-anchor="start" fill="#5b6166" font-weight="normal">R_f 12 assumed, 5/16 pad absorbs it</text><text x="1156.0" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#111" font-weight="normal">touch torsion per magnet</text><text x="1440.0" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" fill="#111" font-weight="bold">1.62 lb</text><text x="1452.0" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" text-anchor="start" fill="#5b6166" font-weight="normal">5 lb at 162 mm over 250</text><text x="1156.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#111" font-weight="normal">magnet derated pull</text><text x="1440.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" fill="#111" font-weight="bold">31.6 lb</text><text x="1452.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" text-anchor="start" fill="#5b6166" font-weight="normal">MM-C-36 90 lb x 0.35</text><text x="1156.0" y="252.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#111" font-weight="normal">magnet SF, touch</text><text x="1440.0" y="252.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" fill="#111" font-weight="bold">19x</text><text x="1452.0" y="252.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" text-anchor="start" fill="#5b6166" font-weight="normal">vs 37x for the O48</text><text x="1156.0" y="272.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#111" font-weight="normal">peel on the lower pair</text><text x="1440.0" y="272.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" fill="#111" font-weight="bold">0.80 lb</text><text x="1452.0" y="272.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" text-anchor="start" fill="#5b6166" font-weight="normal">CG 50.1 mm out, H 542</text><text x="1156.0" y="292.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#111" font-weight="normal">magnet on a 2 in bar</text><text x="1440.0" y="292.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" fill="#111" font-weight="bold">7.4 mm each side</text><text x="1452.0" y="292.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" text-anchor="start" fill="#5b6166" font-weight="normal">O36 is the largest that fits</text><text x="1156.0" y="312.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#111" font-weight="normal">bar stock</text><text x="1440.0" y="312.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" fill="#111" font-weight="bold">24 in x2</text><text x="1452.0" y="312.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" text-anchor="start" fill="#5b6166" font-weight="normal">bottom at 1133 mm</text><text x="1156.0" y="332.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#111" font-weight="normal">standoff = pad</text><text x="1440.0" y="332.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" fill="#111" font-weight="bold">8 mm / 5/16 in</text><text x="1452.0" y="332.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" text-anchor="start" fill="#5b6166" font-weight="normal">-0.06 mm — in the -0.60/+0.30 band</text><text x="1156.0" y="364.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#111" font-weight="bold">PARTS — see prices.py design 4 for the quote</text><text x="1156.0" y="388.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#111" font-weight="bold">6061 angle 2 x 2 x 1/4, 12 in</text><text x="1156.0" y="400.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" text-anchor="start" fill="#5b6166" font-weight="normal">$18.86 Speedy Metals (2 x 2-1/2 listed; 2 x 2 similar)</text><text x="1156.0" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#111" font-weight="bold">6061 flat bar 2 x 1/4, 24 in, x2</text><text x="1156.0" y="430.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" text-anchor="start" fill="#5b6166" font-weight="normal">ESTIMATE ~$25 (metals4u lists $8.33 for 12 in)</text><text x="1156.0" y="448.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#111" font-weight="bold">6061 plate 8 x 8 x 1/4</text><text x="1156.0" y="460.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" text-anchor="start" fill="#5b6166" font-weight="normal">ESTIMATE ~$30</text><text x="1156.0" y="478.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#111" font-weight="bold">K&amp;J MM-C-36 magnets x4</text><text x="1156.0" y="490.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" text-anchor="start" fill="#5b6166" font-weight="normal">$38.88 sourced 2026-09-02</text><text x="1156.0" y="508.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#111" font-weight="bold">M6 nyloc nuts, 1/4-20 bolts x8, washers</text><text x="1156.0" y="520.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" text-anchor="start" fill="#5b6166" font-weight="normal">ESTIMATE ~$15</text><text x="1156.0" y="538.0" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" fill="#111" font-weight="bold">5/16 in neoprene foam strips</text><text x="1156.0" y="550.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" text-anchor="start" fill="#5b6166" font-weight="normal">to source; McMaster stocks it</text><text x="1156.0" y="576.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#111" font-weight="bold">TRADE-OFFS</text><text x="1156.0" y="598.0" font-family="Helvetica, Arial, sans-serif" font-size="9.6" text-anchor="start" fill="#333" font-weight="normal">No strut option — the bars are not a strut interface, so the fallback is</text><text x="1156.0" y="611.0" font-family="Helvetica, Arial, sans-serif" font-size="9.6" text-anchor="start" fill="#333" font-weight="normal">design 2 whole. The top bearing is 2 in wide, not 180 mm: fine at under 1 psi</text><text x="1156.0" y="624.0" font-family="Helvetica, Arial, sans-serif" font-size="9.6" text-anchor="start" fill="#333" font-weight="normal">on foam, but the clip must sit square or it rocks. Fourteen holes drilled by</text><text x="1156.0" y="637.0" font-family="Helvetica, Arial, sans-serif" font-size="9.6" text-anchor="start" fill="#333" font-weight="normal">hand; the VESA pattern wants a template. Bare aluminium, no coat. Nothing</text><text x="1156.0" y="650.0" font-family="Helvetica, Arial, sans-serif" font-size="9.6" text-anchor="start" fill="#333" font-weight="normal">validated: this needs its own generator before it is more than a sketch.</text><text x="40.0" y="920.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#111" font-weight="bold">WHERE IT SITS AGAINST THE OTHERS</text><text x="40.0" y="944.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">Design 1 / 3: same hook physics, a custom 310 x 742 plate at $178-197 plus $96-191 of O48 magnets. Design 4 replaces the plate with ~$75 of stock and the magnets with $39 of</text><text x="40.0" y="958.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">MM-C-36 — but has to be drilled, aligned and squared by hand, and has no path to struts.</text><text x="40.0" y="982.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">Design 2: floor-standing, no fridge-top dependency, $327-346. Design 4 depends on the fridge top like 1 and 3.</text><text x="40.0" y="1006.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">If design 3&#x27;s re-quote comes back well over $178, or the plate is never cut, this is the design that costs least to try. If the plate IS cut, design 4 is moot — the plate is</text><text x="40.0" y="1020.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">the thing it exists to avoid.</text></svg>