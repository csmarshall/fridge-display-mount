<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1180" viewBox="0 0 1720 1180"><rect width="1720" height="1180" fill="#f7f8fa"/><rect width="1720" height="26" fill="#6b3fa0"/><text x="860.0" y="18.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">DESIGN 4 — CONCEPT ONLY. Stock aluminium, hand-drilled. Nothing here is validated by a generator; prices marked ESTIMATE are estimates.</text><text x="40.0" y="62.0" font-family="Helvetica, Arial, sans-serif" font-size="21" text-anchor="start" fill="#111" font-weight="bold">DESIGN 4 — THE HOOK IN STOCK ALUMINIUM: clip, two bars, a small plate</text><text x="40.0" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#5b6166" font-weight="normal">Same load path as the hook (the clip bears on the top; magnets only hold it flat), no custom plate, no coating, magnets sized for the duty. Portrait, 23.8 in.</text><rect x="40" y="104" width="520" height="760" rx="7" fill="#fff" stroke="#d0d4d8"/><text x="56.0" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#111" font-weight="bold">LOOKING ALONG THE PANEL — side elevation, true scale</text><rect x="150.0" y="212.5" width="86.4" height="627.5" fill="#3a3734"/><text x="193.2" y="800.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#cfd4d8" font-weight="bold">FRIDGE</text><text x="193.2" y="814.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" text-anchor="middle" fill="#9aa1a7" font-weight="normal">side panel, continues right</text><rect x="147.1" y="207.4" width="21.1" height="2.3" fill="#9aa4ad" stroke="#111" stroke-width="0.8"/><rect x="144.9" y="207.4" width="2.3" height="21.1" fill="#9aa4ad" stroke="#111" stroke-width="0.8"/><rect x="150.0" y="209.6" width="18.3" height="2.9" fill="#f2c14e"/><rect x="147.1" y="212.5" width="2.9" height="18.3" fill="#f2c14e"/><rect 