<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1080" viewBox="0 0 1560 1080"><rect width="1560" height="1080" fill="#fbfcfd"/><rect width="1560" height="26" fill="#1b6ea8"/><text x="780.00" y="18.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">SKETCH — CONTINGENCY ONLY. Not a fabrication drawing; nothing here is cut unless the hook proves unstable.</text><text x="40.00" y="60.00" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#14181c" font-weight="bold">IF THE HOOK NEEDS HELP — THE BOTTOM END</text><text x="40.00" y="82.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#6b757e" font-weight="normal">The hook carries the display on its own. This is the support that gets added underneath it only if that turns out to be too lively.</text><rect x="40.0" y="104.0" width="1480.0" height="128.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="128.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#b00020" font-weight="bold">THE ONLY PART OF THIS THAT HAS TO BE RIGHT NOW</text><text x="56.00" y="152.00" font-family="Helvetica,Arial,sans-serif" font-size="11.0" text-anchor="start" fill="#14181c" font-weight="normal">Four Ø8.5 holes in the plate: two rows at 187.28 centres, 17.73 and 220.93 above its bottom edge, bracketing the VESA. They cost nothing to add and cannot be added once the</text><text x="56.00" y="167.00" font-family="Helvetica,Arial,sans-serif" font-size="11.0" text-anchor="start" fill="#14181c" font-weight="normal">plate is cut. Everything else on this sheet is bought or cut later, and only if needed.</text><text x="56.00" y="190.00" font-family="Helvetica,Arial,sans-serif" font-size="11.0" text-anchor="start" fill="#6b757e" font-weight="normal">They sit at 187.28, NOT the hook's 246 mm magnet spacing. At 246 a bolt centre falls 14.27 mm from a magnet centre against a 24.01 mm disc radius — the plate could take magnets</text><text x="56.00" y="205.00" font-family="Helvetica,Arial,sans-serif" font-size="11.0" text-anchor="start" fill="#6b757e" font-weight="normal">or struts, never both. The rows are the lowest and highest slots of a 5 ft strut that clear every magnet face, window and hole — the hook generator checks that and refuses to</text><text x="56.00" y="220.00" font-family="Helvetica,Arial,sans-serif" font-size="11.0" text-anchor="start" fill="#6b757e" font-weight="normal">write otherwise.</text><rect x="40.0" y="240.0" width="720.0" height="700.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="264.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">LOOKING AT THE SIDE PANEL — the face the display hangs on</text><rect x="82.5" y="382.0" width="435.0" height="457.5" fill="#3a3734"/><polyline points="82.5,375.0 99.2,389.0 116.0,375.0 132.7,389.0 149.4,375.0 166.2,389.0 182.9,375.0 199.6,389.0 216.3,375.0 233.1,389.0 249.8,375.0 266.5,389.0 283.3,375.0 300.0,389.0 316.7,375.0 333.5,389.0 350.2,375.0 366.9,389.0 383.7,375.0 400.4,389.0 417.1,375.0 433.8,389.0 450.6,375.0 467.3,389.0 484.0,375.0 500.8,389.0 517.5,375.0" fill="none" stroke="#fbfcfd" stroke-width="7"/><polyline points="82.5,375.0 99.2,389.0 116.0,375.0 132.7,389.0 149.4,375.0 166.2,389.0 182.9,375.0 199.6,389.0 216.3,375.0 233.1,389.0 249.8,375.0 266.5,389.0 283.3,375.0 300.0,389.0 316.7,375.0 333.5,389.0 350.2,375.0 366.9,389.0 383.7,375.0 400.4,389.0 417.1,375.0 433.8,389.0 450.6,375.0 467.3,389.0 484.0,375.0 500.8,389.0 517.5,375.0" fill="none" stroke="#3a3734" stroke-width="2.4"/><text x="300.00" y="416.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="middle" fill="#cfd4d8" font-weight="bold">FRIDGE — side panel, continues above</text><rect x="128.6" y="427.0" width="61.9" height="270.0" fill="#8f9aa4" stroke="#14181c" stroke-width="0.9"/><rect x="409.5" y="427.0" width="61.9" height="270.0" fill="#8f9aa4" stroke="#14181c" stroke-width="0.9"/><rect x="118.3" y="833.5" width="363.4" height="12" rx="2" fill="#4a545e" stroke="#14181c" stroke-width="0.9"/><rect x="118.3" y="851.0" width="82.5" height="11" fill="#b8860b" stroke="#14181c" stroke-width="1"/><rect x="399.2" y="851.0" width="82.5" height="11" fill="#b8860b" stroke="#14181c" stroke-width="1"/><line x1="60.0" y1="862.0" x2="550.0" y2="862.0" stroke="#14181c" stroke-width="2"/><rect x="60.0" y="862.0" width="490.0" height="30" fill="#b9a184" opacity="0.32"/><path d="M481.7 839.5 L538.0 839.5 L538.0 426.0 L556.0 426.0" fill="none" stroke="#0a8f6f" stroke-width="1"/><text x="564.00" y="430.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#0a8f6f" font-weight="bold">LOWER CLAMP  x1</text><text x="564.00" y="445.00" font-family="Helvetica,Arial,sans-serif" font-size="9.3" text-anchor="start" fill="#6b757e" font-weight="normal">one piece, 242 wide,</text><text x="564.00" y="456.50" font-family="Helvetica,Arial,sans-serif" font-size="9.3" text-anchor="start" fill="#6b757e" font-weight="normal">spanning both struts. One</text><text x="564.00" y="468.00" font-family="Helvetica,Arial,sans-serif" font-size="9.3" text-anchor="start" fill="#6b757e" font-weight="normal">bolt through it picks up</text><text x="564.00" y="479.50" font-family="Helvetica,Arial,sans-serif" font-size="9.3" text-anchor="start" fill="#6b757e" font-weight="normal">the foot too.</text><path d="M481.7 857.0 L538.0 857.0 L538.0 544.0 L556.0 544.0" fill="none" stroke="#b8860b" stroke-width="1"/><text x="564.00" y="548.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#b8860b" font-weight="bold">FOOT  x2</text><text x="564.00" y="563.00" font-family="Helvetica,Arial,sans-serif" font-size="9.3" text-anchor="start" fill="#6b757e" font-weight="normal">one per strut, 55 wide.</text><text x="564.00" y="574.50" font-family="Helvetica,Arial,sans-serif" font-size="9.3" text-anchor="start" fill="#6b757e" font-weight="normal">Shares the lower clamp’s</text><text x="564.00" y="586.00" font-family="Helvetica,Arial,sans-serif" font-size="9.3" text-anchor="start" fill="#6b757e" font-weight="normal">bolts — clamp leg, foot</text><text x="564.00" y="597.50" font-family="Helvetica,Arial,sans-serif" font-size="9.3" text-anchor="start" fill="#6b757e" font-weight="normal">leg, strut web, nut.</text><text x="564.00" y="609.00" font-family="Helvetica,Arial,sans-serif" font-size="9.3" text-anchor="start" fill="#6b757e" font-weight="normal">Unchanged part.</text><line x1="159.5" y1="910.0" x2="440.5" y2="910.0" stroke="#14181c" stroke-width="1.2"/><line x1="159.5" y1="905.0" x2="159.5" y2="915.0" stroke="#14181c" stroke-width="1.2"/><line x1="440.5" y1="905.0" x2="440.5" y2="915.0" stroke="#14181c" stroke-width="1.2"/><text x="300.00" y="906.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="middle" fill="#14181c" font-weight="bold">strut centres 187.28</text><rect x="800.0" y="240.0" width="720.0" height="700.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="816.00" y="264.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">LOOKING ALONG IT — how it secures</text><rect x="1080.0" y="382.0" width="195.0" height="457.5" fill="#3a3734"/><polyline points="1080.0,375.0 1087.5,389.0 1095.0,375.0 1102.5,389.0 1110.0,375.0 1117.5,389.0 1125.0,375.0 1132.5,389.0 1140.0,375.0 1147.5,389.0 1155.0,375.0 1162.5,389.0 1170.0,375.0 1177.5,389.0 1185.0,375.0 1192.5,389.0 1200.0,375.0 1207.5,389.0 1215.0,375.0 1222.5,389.0 1230.0,375.0 1237.5,389.0 1245.0,375.0 1252.5,389.0 1260.0,375.0 1267.5,389.0 1275.0,375.0" fill="none" stroke="#fbfcfd" stroke-width="7"/><polyline points="1080.0,375.0 1087.5,389.0 1095.0,375.0 1102.5,389.0 1110.0,375.0 1117.5,389.0 1125.0,375.0 1132.5,389.0 1140.0,375.0 1147.5,389.0 1155.0,375.0 1162.5,389.0 1170.0,375.0 1177.5,389.0 1185.0,375.0 1192.5,389.0 1200.0,375.0 1207.5,389.0 1215.0,375.0 1222.5,389.0 1230.0,375.0 1237.5,389.0 1245.0,375.0 1252.5,389.0 1260.0,375.0 1267.5,389.0 1275.0,375.0" fill="none" stroke="#3a3734" stroke-width="2.4"/><text x="1177.50" y="416.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="middle" fill="#cfd4d8" font-weight="bold">FRIDGE, continues above</text><rect x="1035.0" y="427.0" width="31.0" height="270.0" fill="#8f9aa4" stroke="#14181c" stroke-width="0.9"/><rect x="1035.0" y="833.5" width="225.0" height="12" fill="#4a545e" stroke="#14181c" stroke-width="0.9"/><rect x="1024.5" y="767.5" width="7" height="66.0" fill="#4a545e" stroke="#14181c" stroke-width="0.9"/><line x1="1018.5" y1="797.2" x2="1075.0" y2="797.2" stroke="#b00020" stroke-width="2.2"/><text x="1011.00" y="793.20" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="end" fill="#b00020" font-weight="bold">ELEVATOR BOLT</text><text x="1011.00" y="804.20" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="end" fill="#b00020" font-weight="normal">through clamp leg + foot leg + web,</text><text x="1011.00" y="814.20" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="end" fill="#b00020" font-weight="normal">nut INSIDE the channel</text><rect x="810.0" y="851.0" width="225.0" height="11" fill="#b8860b" stroke="#14181c" stroke-width="1"/><rect x="1035.0" y="682.0" width="8" height="180.0" fill="#b8860b" stroke="#14181c" stroke-width="1"/><line x1="820.0" y1="862.0" x2="1310.0" y2="862.0" stroke="#14181c" stroke-width="2"/><rect x="820.0" y="862.0" width="490.0" height="30" fill="#b9a184" opacity="0.32"/><path d="M1260.0 839.5 L1298.0 839.5 L1298.0 426.0 L1316.0 426.0" fill="none" stroke="#0a8f6f" stroke-width="1"/><text x="1324.00" y="430.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#0a8f6f" font-weight="bold">CLAMP LEG 150, UNDER the fridge</text><text x="1324.00" y="445.00" font-family="Helvetica,Arial,sans-serif" font-size="9.3" text-anchor="start" fill="#6b757e" font-weight="normal">slides into the toe space</text><text x="1324.00" y="456.50" font-family="Helvetica,Arial,sans-serif" font-size="9.3" text-anchor="start" fill="#6b757e" font-weight="normal">and is secured there. The</text><text x="1324.00" y="468.00" font-family="Helvetica,Arial,sans-serif" font-size="9.3" text-anchor="start" fill="#6b757e" font-weight="normal">appliance's own 229 lb is</text><text x="1324.00" y="479.50" font-family="Helvetica,Arial,sans-serif" font-size="9.3" text-anchor="start" fill="#6b757e" font-weight="normal">what it pulls against.</text><path d="M1260.0 856.0 L1298.0 856.0 L1298.0 544.0 L1316.0 544.0" fill="none" stroke="#b8860b" stroke-width="1"/><text x="1324.00" y="548.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#b8860b" font-weight="bold">FOOT LEG 150, OUTBOARD</text><text x="1324.00" y="563.00" font-family="Helvetica,Arial,sans-serif" font-size="9.3" text-anchor="start" fill="#6b757e" font-weight="normal">turns away from the</text><text x="1324.00" y="574.50" font-family="Helvetica,Arial,sans-serif" font-size="9.3" text-anchor="start" fill="#6b757e" font-weight="normal">fridge onto the floor —</text><text x="1324.00" y="586.00" font-family="Helvetica,Arial,sans-serif" font-size="9.3" text-anchor="start" fill="#6b757e" font-weight="normal">it is what stops the</text><text x="1324.00" y="597.50" font-family="Helvetica,Arial,sans-serif" font-size="9.3" text-anchor="start" fill="#6b757e" font-weight="normal">bottom kicking out.</text><line x1="1080.0" y1="839.5" x2="1284.0" y2="839.5" stroke="#b00020" stroke-width="0.9" stroke-dasharray="5 4"/><text x="1284.00" y="855.50" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#b00020" font-weight="normal">underside 15</text><rect x="40.0" y="960.0" width="1480.0" height="92.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="984.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#1b6ea8" font-weight="bold">WHAT THIS SKETCH IS FOR</text><text x="56.00" y="1004.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#14181c" font-weight="normal">It is the fallback. The hook is the design; this gets built only if the hook is too lively in use. Because the bolt holes had to move off the magnets, they landed on the clamped-strut</text><text x="56.00" y="1019.00" font-family="Helvetica,Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#14181c" font-weight="normal">design's 187.28 spacing — so the FOOT and LOWER CLAMP are that design's parts unchanged. The contingency needs no new part designed, only cut.</text></svg>