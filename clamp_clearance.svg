<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640"><rect width="1180" height="640" fill="#fbfcfd"/><rect width="1180" height="24" fill="#b8860b"/><text x="590.00" y="16.50" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">CLEARANCE — the window is derived and the tape agrees; the LAYOUT inside it is the finding</text><text x="40.00" y="56.00" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#14181c" font-weight="bold">WHERE THE TOP CLAMP LANDS</text><text x="40.00" y="78.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#6b757e" font-weight="normal">Plan view of the fridge top. The hinge cover owns the front; the clamp has to live behind it.</text><rect x="40.0" y="100.0" width="1100.0" height="330.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">FRIDGE TOP, LOOKING DOWN</text><rect x="90.0" y="150.0" width="640.1" height="150" fill="#3a3734" stroke="#2b2926"/><rect x="516.9" y="150.0" width="213.2" height="150" fill="#5c574f" stroke="#2b2926"/><text x="623.50" y="228.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#e8e2d8" font-weight="bold">HINGE COVER</text><text x="623.50" y="244.00" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#bdb6ab" font-weight="normal">front 203 mm</text><text x="130.00" y="170.00" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="start" fill="#bdb6ab" font-weight="normal">REAR</text><rect x="152.6" y="180.0" width="43.3" height="90" fill="#8f9aa4" stroke="#14181c" stroke-width="1.2"/><rect x="410.9" y="180.0" width="43.3" height="90" fill="#8f9aa4" stroke="#14181c" stroke-width="1.2"/><rect x="145.4" y="190.0" width="316.1" height="70" fill="#4a545e" fill-opacity="0.9" stroke="#14181c" stroke-width="1.3"/><text x="303.46" y="222.00" font-family="Helvetica,Arial,sans-serif" font-size="9.4" text-anchor="middle" fill="#fff" font-weight="bold">ONE CLAMP BAR spanning both struts — 301 mm</text><text x="303.46" y="238.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#d8d2c8" font-weight="normal">ties the two struts into a frame</text><line x1="461.5" y1="310.0" x2="516.9" y2="310.0" stroke="#0a8f6f" stroke-width="1.6"/><text x="489.21" y="295.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#0a8f6f" font-weight="bold">52.8 mm</text><line x1="90.0" y1="350.0" x2="516.9" y2="350.0" stroke="#14181c" stroke-width="1"/><text x="303.46" y="344.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#14181c" font-weight="bold">clear window 406.6 mm — derived; the 406 tape reading agrees</text><rect x="40.0" y="450.0" width="1100.0" height="160.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="474.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#b8860b" font-weight="bold">READ THIS THE RIGHT WAY ROUND</text><text x="56.00" y="500.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">The window is 406.6 mm and the two clamps span 547 mm, leaving 52.8 mm at each end. That only holds because the struts are centred on the WINDOW.</text><text x="56.00" y="513.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">Centring them on the case depth — the obvious choice, and what this drawing was first built with — drives the front clamp 51.2 mm INTO the hinge</text><text x="56.00" y="526.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">cover. The cost is cosmetic: the screen ends up 102 mm behind the case centre, still comfortably within the panel. Quote 52.8 mm when asking 'does it</text><text x="56.00" y="539.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">fit'.</text></svg>