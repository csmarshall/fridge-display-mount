<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640"><rect width="1180" height="640" fill="#fbfcfd"/><rect width="1180" height="24" fill="#b8860b"/><text x="590.00" y="16.50" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">CLEARANCE — the window is derived and the tape agrees; the LAYOUT inside it is the finding</text><text x="40.00" y="56.00" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#14181c" font-weight="bold">WHERE THE TOP CLAMP LANDS</text><text x="40.00" y="78.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#6b757e" font-weight="normal">Plan view of the fridge top. The hinge cover owns the front; the clamp has to live behind it.</text><rect x="40.0" y="100.0" width="1100.0" height="330.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">FRIDGE TOP, LOOKING DOWN</text><rect x="90.0" y="150.0" width="640.1" height="150" fill="#3a3734" stroke="#2b2926"/><rect x="510.1" y="150.0" width="220.0" height="150" fill="#5c574f" stroke="#2b2926"/><text x="620.07" y="228.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#e8e2d8" font-weight="bold">HINGE COVER</text><text x="620.07" y="244.00" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#bdb6ab" font-weight="normal">front 210 mm</text><text x="130.00" y="170.00" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="start" fill="#bdb6ab" font-weight="normal">REAR</text><rect x="241.9" y="180.0" width="43.3" height="90" fill="#8f9aa4" stroke="#14181c" stroke-width="1.2"/><rect x="438.5" y="180.0" width="43.3" height="90" fill="#8f9aa4" stroke="#14181c" stroke-width="1.2"/><rect x="234.7" y="190.0" width="254.4" height="70" fill="#4a545e" fill-opacity="0.9" stroke="#14181c" stroke-width="1.3"/><text x="361.86" y="222.00" font-family="Helvetica,Arial,sans-serif" font-size="9.4" text-anchor="middle" fill="#fff" font-weight="bold">ONE CLAMP BAR spanning both struts — 242 mm</text><text x="361.86" y="238.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#d8d2c8" font-weight="normal">ties the two struts into a frame</text><line x1="489.1" y1="310.0" x2="510.1" y2="310.0" stroke="#0a8f6f" stroke-width="1.6"/><text x="499.55" y="295.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#0a8f6f" font-weight="bold">20.0 mm</text><line x1="90.0" y1="350.0" x2="510.1" y2="350.0" stroke="#14181c" stroke-width="1"/><text x="300.03" y="344.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#14181c" font-weight="bold">clear window 400.0 mm — derived; the 406 tape reading agrees</text><rect x="40.0" y="450.0" width="1100.0" height="160.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="474.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#b8860b" font-weight="bold">READ THIS THE RIGHT WAY ROUND</text><text x="56.00" y="500.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">The bar is placed as far FORWARD as the cover allows while holding 20 mm back from it, which leaves 137.8 mm at the rear. Three datums were possible.</text><text x="56.00" y="513.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">Centring on the CASE drives the bar 48.7 mm INTO the cover — blocked. Centring on the WINDOW is safe but leaves the screen 101.5 mm behind the case</text><text x="56.00" y="526.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">centre, pushed away from where anyone stands. Going hard forward centres best and leaves ZERO tolerance against a cover position read off a</text><text x="56.00" y="539.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">photograph. This sits between them: the screen is now 45.9 mm rearward instead of 101.5, and 20 mm of clearance is deliberately kept in hand.</text></svg>