<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1260" viewBox="0 0 1560 1260"><rect width="1560" height="1260" fill="#fbfcfd"/><rect width="1560" height="26" fill="#1b6ea8"/><rect x="780" width="780" height="26" fill="#c8791a"/><text x="390.00" y="18.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">BUY NOW — the arm + magnets design</text><text x="1170.00" y="18.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">BUY ONLY IF THAT IS TOO LIVELY — the support</text><text x="40.00" y="60.00" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#14181c" font-weight="bold">THE THIRD DESIGN — ONE PLATE, TWO WAYS TO HOLD IT UP</text><text x="40.00" y="82.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#6b757e" font-weight="normal">The arm hooks over the fridge top and the magnets hold it flat. If that is not steady enough in use, struts drop from the same plate to the floor. Nothing about the plate changes.</text><rect x="40.0" y="104.0" width="640.0" height="906.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="128.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">THE WHOLE THING — looking at the side panel, true scale</text><line x1="192.2" y1="952.0" x2="566.0" y2="952.0" stroke="#14181c" stroke-width="2"/><rect x="192.2" y="952.0" width="373.8" height="26" fill="#b9a184" opacity="0.32"/><rect x="272.0" y="219.9" width="256.0" height="732.1" fill="#3a3734"/><rect x="440.0" y="204.6" width="88.0" height="15.3" fill="#4c4842"/><text x="522.15" y="251.91" font-family="Helvetica,Arial,sans-serif" font-size="9.6" text-anchor="end" fill="#cfd4d8" font-weight="bold">SAMSUNG RS23A500ASR</text><text x="522.15" y="264.91" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="end" fill="#9aa1a7" font-weight="normal">counter-depth, 610 deep</text><text x="484.03" y="198.58" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#6b757e" font-weight="normal">hinge cover</text><rect x="332.7" y="311.9" width="17.3" height="640.1" fill="#e8dcc9" stroke="#c8791a" stroke-width="1.4"/><rect x="329.9" y="944.0" width="23.1" height="8" fill="#c8791a"/><rect x="411.4" y="311.9" width="17.3" height="640.1" fill="#e8dcc9" stroke="#c8791a" stroke-width="1.4"/><rect x="408.5" y="944.0" width="23.1" height="8" fill="#c8791a"/><rect x="329.9" y="940.7" width="101.8" height="9" fill="#c8791a"/><rect x="340.8" y="216.4" width="79.8" height="3.5" fill="#1b6ea8"/><rect x="340.8" y="219.9" width="79.8" height="107.9" fill="#1b6ea8" opacity="0.55"/><rect x="315.6" y="327.9" width="130.2" height="130.2" fill="#1b6ea8" opacity="0.30" stroke="#1b6ea8" stroke-width="1.4"/><rect x="312.6" y="276.4" width="136.4" height="233.2" rx="3" fill="none" stroke="#14181c" stroke-width="1.2" stroke-dasharray="7 5"/><text x="380.74" y="396.98" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#14181c" font-weight="normal">display, 24 in portrait</text><line x1="192.2" y1="219.9" x2="578.4" y2="219.9" stroke="#6b757e" stroke-width="0.6" stroke-dasharray="4 4"/><text x="193.04" y="214.91" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="start" fill="#6b757e" font-weight="normal">fridge top 1743</text><line x1="192.2" y1="458.1" x2="578.4" y2="458.1" stroke="#1b6ea8" stroke-width="0.6" stroke-dasharray="4 4"/><text x="193.04" y="453.05" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="start" fill="#1b6ea8" font-weight="normal">plate bottom 1176</text><line x1="192.2" y1="311.9" x2="578.4" y2="311.9" stroke="#c8791a" stroke-width="0.6" stroke-dasharray="4 4"/><text x="577.59" y="323.92" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="end" fill="#c8791a" font-weight="normal">strut top 1524 — 5 ft stock</text><line x1="335.5" y1="429.3" x2="426.0" y2="429.3" stroke="#b00020" stroke-width="2.2"/><line x1="335.5" y1="365.3" x2="426.0" y2="365.3" stroke="#b00020" stroke-width="2.2"/><path d="M426.8 365.3 L528.8 369.3" fill="none" stroke="#b00020" stroke-width="0.9"/><text x="534.75" y="372.26" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#b00020" font-weight="bold">2 bolt rows, 69 and 221</text><text x="534.75" y="384.26" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#b00020" font-weight="normal">above the plate edge,</text><text x="534.75" y="395.26" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#b00020" font-weight="normal">bracketing the VESA —</text><text x="534.75" y="406.26" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#b00020" font-weight="normal">the plate is a beam</text><text x="534.75" y="417.26" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#b00020" font-weight="normal">between them</text><rect x="700.0" y="104.0" width="820.0" height="600.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="716.00" y="128.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">WHAT YOU BUY, AND WHEN</text><text x="716.00" y="148.00" font-family="Helvetica,Arial,sans-serif" font-size="12.0" text-anchor="start" fill="#1b6ea8" font-weight="bold">IN THE FIRST ORDER</text><text x="716.00" y="163.00" font-family="Helvetica,Arial,sans-serif" font-size="9.4" text-anchor="start" fill="#6b757e" font-weight="normal">the plate is cut once and cannot be changed afterwards</text><text x="730.00" y="182.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">HOOK PLATE</text><text x="1160.00" y="182.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#14181c" font-weight="bold">$187.20</text><text x="1180.00" y="179.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">the REAL H_hook_plate.dxf (310 x 742.03,</text><text x="1180.00" y="189.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">full hole set); cut $104.82, +bend $116.59,</text><text x="730.00" y="208.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">MAGNETS x8</text><text x="1160.00" y="208.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#14181c" font-weight="bold">$61.12</text><text x="1180.00" y="205.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">SETTLED 2026-09-02 on magnet_economics.svg;</text><text x="1180.00" y="215.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">$6.12 at 1000+</text><text x="730.00" y="234.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">M6 thin nylocs</text><text x="1160.00" y="234.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#6b757e" font-weight="bold">NOT PRICED</text><text x="1180.00" y="231.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">NOT VERIFIED — part number and price; the</text><text x="1180.00" y="241.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">fastener sheets assume 4 mm tall</text><text x="730.00" y="260.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">M6 fender washers</text><text x="1160.00" y="260.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#6b757e" font-weight="bold">NOT PRICED</text><text x="1180.00" y="257.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">NOT VERIFIED</text><text x="730.00" y="286.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">VESA screws, pack</text><text x="1160.00" y="286.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#6b757e" font-weight="bold">NOT PRICED</text><text x="1180.00" y="283.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">part number not verified; length after the</text><text x="1180.00" y="293.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">spacer is chosen</text><text x="730.00" y="312.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">M4 spacers 10 mm</text><text x="1160.00" y="312.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#6b757e" font-weight="bold">NOT PRICED</text><text x="1180.00" y="309.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">length depends on the measured nut-stack</text><text x="1180.00" y="319.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">height</text><text x="730.00" y="338.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">Foam 5/16 in</text><text x="1160.00" y="338.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#6b757e" font-weight="bold">NOT PRICED</text><text x="1180.00" y="335.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">8 mm standoff wants 7.94 mm foam; stocked,</text><text x="1180.00" y="345.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">not yet priced</text><text x="730.00" y="364.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">VELCRO roll</text><text x="1160.00" y="364.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#14181c" font-weight="bold">$31.25</text><text x="1180.00" y="361.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">for the strap slots</text><line x1="716" y1="378.0" x2="1500" y2="378.0" stroke="#c9d1d8" stroke-width="0.8"/><text x="730.00" y="396.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#1b6ea8" font-weight="bold">subtotal</text><text x="1160.00" y="396.00" font-family="Helvetica,Arial,sans-serif" font-size="12.0" text-anchor="end" fill="#1b6ea8" font-weight="bold">$279.57</text><text x="716.00" y="434.00" font-family="Helvetica,Arial,sans-serif" font-size="12.0" text-anchor="start" fill="#c8791a" font-weight="bold">ONLY IF THE ARM IS TOO LIVELY</text><text x="716.00" y="449.00" font-family="Helvetica,Arial,sans-serif" font-size="9.4" text-anchor="start" fill="#6b757e" font-weight="normal">ordinary stock and two cut parts, orderable any time later</text><text x="730.00" y="468.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">FOOT x2</text><text x="1160.00" y="468.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#14181c" font-weight="bold">$59.38</text><text x="1180.00" y="465.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">qty-2 rate</text><text x="730.00" y="494.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">LOWER CLAMP</text><text x="1160.00" y="494.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#14181c" font-weight="bold">$77.95</text><text x="1180.00" y="491.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">design 3 needs ONE — the hook does the top</text><text x="730.00" y="520.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">STRUT 5 ft x2</text><text x="1160.00" y="520.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#14181c" font-weight="bold">$60.52</text><text x="1180.00" y="517.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">design 3's length: six slot rows inside the</text><text x="1180.00" y="527.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">plate</text><text x="730.00" y="546.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">Elevator bolts, pack</text><text x="1160.00" y="546.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#14181c" font-weight="bold">$9.63</text><text x="1180.00" y="543.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">one pack covers every strut joint</text><text x="730.00" y="572.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">Foam 3 mm</text><text x="1160.00" y="572.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#6b757e" font-weight="bold">NOT PRICED</text><text x="1180.00" y="569.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">clamp faces</text><text x="730.00" y="598.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">Floor pads</text><text x="1160.00" y="598.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#6b757e" font-weight="bold">NOT PRICED</text><text x="1180.00" y="595.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">under the feet — EPDM, rubber stains</text><text x="1180.00" y="605.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#6b757e" font-weight="normal">polyurethane</text><line x1="716" y1="612.0" x2="1500" y2="612.0" stroke="#c9d1d8" stroke-width="0.8"/><text x="730.00" y="630.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#c8791a" font-weight="bold">subtotal</text><text x="1160.00" y="630.00" font-family="Helvetica,Arial,sans-serif" font-size="12.0" text-anchor="end" fill="#c8791a" font-weight="bold">$207.48</text><rect x="700.0" y="726.0" width="820.0" height="408.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="716.00" y="750.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#b00020" font-weight="bold">THE ONE THING THE FIRST ORDER HAS TO GET RIGHT</text><text x="716.00" y="774.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#14181c" font-weight="normal">Four Ø8.5 holes in the plate: two rows at 187.28 centres, 68.53 and 220.93 above its</text><text x="716.00" y="788.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#14181c" font-weight="normal">bottom edge. If the struts are never bought they are four unused holes hidden behind the</text><text x="716.00" y="802.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#14181c" font-weight="normal">display. If they are bought and the holes are not there, the plate is scrap.</text><text x="716.00" y="848.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">They are NOT at the hook's 246 mm magnet spacing. At 246 a bolt centre lands 14.27 mm</text><text x="716.00" y="862.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">from a magnet centre against a 16.00 mm disc — the bolts would sit UNDER the magnets and</text><text x="716.00" y="876.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">the plate could do one job or the other, never both. The plate is the HOOK GENERATOR's</text><text x="716.00" y="890.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">output with these holes added; it checks every bolt against every magnet face, window</text><text x="716.00" y="904.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">and hole and refuses to write otherwise.</text><text x="716.00" y="936.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">5 ft struts, not 4. A 4 ft strut put ONE slot row 17.7 mm above the plate edge and the</text><text x="716.00" y="950.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">plate cantilevered 144 mm to the VESA: 0.876 mm of screen-edge movement under a 5 lb</text><text x="716.00" y="964.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">press, four times the feel-rigid band. 5 ft puts 6 rows inside the plate; the lowest and</text><text x="716.00" y="978.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">highest clear ones bracket the VESA and the same press now moves the edge 0.063 mm. The</text><text x="716.00" y="992.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">strut stands 38 mm above the plate, behind the display. If the mounting height moves,</text><text x="716.00" y="1006.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">the rows are re-picked and the generator refuses if they no longer bracket.</text><text x="716.00" y="1024.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#0a8f6f" font-weight="normal">The foot and lower clamp are the clamped-strut design's parts, unchanged — nothing new</text><text x="716.00" y="1038.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#0a8f6f" font-weight="normal">gets designed for the fallback, only cut.</text></svg>