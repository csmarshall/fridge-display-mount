<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800"><rect width="1180" height="800" fill="#fbfcfd"/><rect width="1180" height="24" fill="#b8860b"/><text x="590.00" y="16.50" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">FOR APPROVAL — this is the design being proposed</text><text x="40.00" y="56.00" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#14181c" font-weight="bold">FRIDGE-SIDE CHORE DISPLAY — THE CLAMPED STRUT</text><text x="40.00" y="78.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#6b757e" font-weight="normal">What it is, what it does to the kitchen, and what it costs. No engineering vocabulary below this line.</text><rect x="40.0" y="100.0" width="520.0" height="560.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">WHAT IT LOOKS LIKE FROM THE SIDE</text><line x1="50.0" y1="560.0" x2="450.0" y2="560.0" stroke="#14181c" stroke-width="2.5"/><rect x="120.0" y="150.4" width="60.2" height="406.1" fill="#3a3734"/><text x="150.00" y="348.50" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#cfc9c2" font-weight="normal" transform="rotate(-90.0 150.00 348.50)">fridge</text><rect x="184.2" y="130.2" width="9" height="429.8" fill="#8f9aa4" stroke="#14181c"/><rect x="197.2" y="182.0" width="26.0" height="130.5" fill="#101820" fill-opacity="0.10" stroke="#14181c" stroke-width="1.4" stroke-dasharray="7 4"/><text x="210.17" y="247.22" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#6b757e" font-weight="bold">the screen</text><rect x="180.2" y="554.0" width="70" height="6" fill="#4a545e"/><text x="274.17" y="576.00" font-family="Helvetica,Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#0a8f6f" font-weight="bold">stands on the floor</text><text x="274.17" y="154.38" font-family="Helvetica,Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#14181c" font-weight="normal">clipped at the top</text><text x="274.17" y="546.48" font-family="Helvetica,Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#14181c" font-weight="normal">clipped at the bottom</text><text x="56.00" y="640.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#0a8f6f" font-weight="bold">eye level is adjustable after it is built</text><rect x="580.0" y="100.0" width="560.0" height="300.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="596.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">IN PLAIN LANGUAGE</text><text x="596.00" y="146.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">It stands on the floor.</text><text x="596.00" y="162.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">It does not hang off the fridge. The weight goes straight down</text><text x="596.00" y="174.50" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">into the floor, the way a bookcase does.</text><text x="596.00" y="208.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">There are no magnets.</text><text x="596.00" y="224.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">An earlier version used eight of them. This one does not need any,</text><text x="596.00" y="236.50" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">which removed about $191 and the thing that could have failed.</text><text x="596.00" y="270.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">It does not mark the fridge.</text><text x="596.00" y="286.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">Everywhere it touches, there is foam. Nothing is drilled, glued or</text><text x="596.00" y="298.50" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">stuck to the fridge, and it lifts off.</text><text x="596.00" y="332.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">The screen height can change.</text><text x="596.00" y="348.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">It slides. If it is wrong for whoever is standing there, it moves</text><text x="596.00" y="360.50" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">without rebuilding anything.</text><rect x="580.0" y="420.0" width="560.0" height="240.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="596.00" y="444.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#b8860b" font-weight="bold">WHAT IT STICKS OUT INTO THE ROOM</text><text x="596.00" y="466.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">The screen face sits 52.0 mm off the fridge panel — about 2.0</text><text x="596.00" y="479.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">inches. Of that, 43.0 mm is the screen and its own back box,</text><text x="596.00" y="492.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">which no mount can avoid. The mount itself adds 9.0 mm.</text><rect x="596" y="560" width="413" height="26" fill="#b9c2c9" stroke="#14181c"/><rect x="1009" y="560" width="87" height="26" fill="#b8860b" fill-opacity="0.55" stroke="#14181c"/><text x="802.55" y="577.00" font-family="Helvetica,Arial,sans-serif" font-size="9.4" text-anchor="middle" fill="#14181c" font-weight="normal">the screen itself 43</text><text x="1056.00" y="577.00" font-family="Helvetica,Arial,sans-serif" font-size="9.4" text-anchor="middle" fill="#14181c" font-weight="normal">mount 9</text><text x="596.00" y="606.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">The orange part is the only bit that is a design choice, and it is</text><text x="596.00" y="619.00" font-family="Helvetica,Arial,sans-serif" font-size="10.0" text-anchor="start" fill="#6b757e" font-weight="normal">already the thinnest strut sold.</text><rect x="40.0" y="680.0" width="1100.0" height="100.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="704.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#b00020" font-weight="bold">WHAT IS NOT SETTLED YET</text><text x="56.00" y="726.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">Two things still need someone with a torch under the fridge: whether the lower clamp's reach hits anything under there, and whether there is a lip worth</text><text x="56.00" y="739.00" font-family="Helvetica,Arial,sans-serif" font-size="10.6" text-anchor="start" fill="#6b757e" font-weight="normal">hooking rather than just bearing on. Neither changes what it looks like; both could change the lower bracket.</text></svg>