<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1120" viewBox="0 0 1620 1120"><rect width="1620" height="1120" fill="#fbfcfd"/><rect width="1620" height="24" fill="#b8860b"/><text x="810.00" y="16.50" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">GENERAL ARRANGEMENT — the mount in place</text><text x="40.00" y="56.00" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#14181c" font-weight="bold">BOTH ELEVATIONS, WITH THE FRIDGE</text><text x="40.00" y="78.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#6b757e" font-weight="normal">True scale, nothing broken or exaggerated. The whole appliance is drawn so the mount can be judged against it rather than on its own.</text><rect x="40.0" y="100.0" width="560.0" height="940.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">LOOKING AT THE SIDE PANEL — the face the display hangs on</text><line x1="56.0" y1="970.0" x2="584.0" y2="970.0" stroke="#14181c" stroke-width="2"/><rect x="56.0" y="970.0" width="528.0" height="54" fill="#b9a184" opacity="0.30"/><rect x="156.4" y="185.6" width="274.3" height="784.4" fill="#3a3734"/><rect x="430.7" y="169.2" width="52.9" height="800.8" fill="#8e949a"/><rect x="336.4" y="169.2" width="94.3" height="16.4" fill="#4c4842"/><rect x="220.5" y="964.0" width="20.6" height="6" fill="#4a545e"/><rect x="221.5" y="421.4" width="18.6" height="548.6" fill="#8f9aa4" stroke="#14181c" stroke-width="0.8"/><rect x="221.5" y="174.2" width="18.6" height="137.2" fill="#8f9aa4" stroke="#14181c" stroke-width="0.8"/><rect x="304.8" y="964.0" width="20.6" height="6" fill="#4a545e"/><rect x="305.8" y="421.4" width="18.6" height="548.6" fill="#8f9aa4" stroke="#14181c" stroke-width="0.8"/><rect x="305.8" y="174.2" width="18.6" height="137.2" fill="#8f9aa4" stroke="#14181c" stroke-width="0.8"/><rect x="218.4" y="181.6" width="109.0" height="8" rx="1.5" fill="#4a545e"/><rect x="218.4" y="959.2" width="109.0" height="8" rx="1.5" fill="#4a545e"/><rect x="199.9" y="246.1" width="146.1" height="249.9" rx="4" fill="#0d0f12"/><rect x="206.0" y="252.2" width="133.9" height="237.6" fill="#16212c"/><line x1="142.9" y1="185.6" x2="490.8" y2="185.6" stroke="#6b757e" stroke-width="0.7" stroke-dasharray="5 4"/><text x="492.60" y="188.62" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="start" fill="#6b757e" font-weight="normal">case 1743</text><line x1="142.9" y1="371.0" x2="490.8" y2="371.0" stroke="#6b757e" stroke-width="0.7" stroke-dasharray="5 4"/><text x="492.60" y="374.05" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="start" fill="#6b757e" font-weight="normal">screen centre 1331</text><rect x="620.0" y="100.0" width="620.0" height="940.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="636.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">LOOKING ALONG IT — the whole appliance, mount edge-on</text><line x1="636.0" y1="970.0" x2="1224.0" y2="970.0" stroke="#14181c" stroke-width="2"/><rect x="636.0" y="970.0" width="588.0" height="54" fill="#b9a184" opacity="0.30"/><rect x="725.0" y="185.6" width="410.0" height="784.4" fill="#8e949a"/><line x1="930.0" y1="185.6" x2="930.0" y2="970.0" stroke="#6d7378" stroke-width="1.4"/><rect x="912.0" y="295.0" width="7" height="315.0" rx="3" fill="#cdd3d8"/><rect x="948.0" y="295.0" width="7" height="315.0" rx="3" fill="#cdd3d8"/><rect x="701.6" y="246.1" width="8.1" height="249.9" fill="#0d0f12"/><rect x="709.7" y="312.5" width="11.2" height="117.0" fill="#5b6b7d"/><rect x="720.9" y="421.4" width="9.3" height="548.6" fill="#8f9aa4" stroke="#14181c" stroke-width="0.8"/><rect x="720.9" y="174.2" width="9.3" height="137.2" fill="#8f9aa4" stroke="#14181c" stroke-width="0.8"/><rect x="720.0" y="182.6" width="45.2" height="6" fill="#4a545e"/><rect x="720.0" y="960.2" width="45.2" height="6" fill="#4a545e"/><rect x="711.6" y="964.0" width="67.5" height="6" fill="#4a545e"/><line x1="701.6" y1="992.0" x2="725.0" y2="992.0" stroke="#0a8f6f" stroke-width="1.4"/><text x="713.27" y="987.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#0a8f6f" font-weight="bold">52.0</text><text x="930.00" y="565.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#4d5459" font-weight="bold">fridge 911.2 wide</text><rect x="1260.0" y="100.0" width="320.0" height="940.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="1276.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">READ TOGETHER</text><text x="1276.00" y="148.00" font-family="Helvetica,Arial,sans-serif" font-size="11.0" text-anchor="start" fill="#0a8f6f" font-weight="bold">The mount is narrow</text><text x="1276.00" y="165.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">it occupies 242 of the 400.0 mm</text><text x="1276.00" y="177.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">window on the top, and 52.0 mm of</text><text x="1276.00" y="189.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">depth off the panel.</text><text x="1276.00" y="244.00" font-family="Helvetica,Arial,sans-serif" font-size="11.0" text-anchor="start" fill="#0a8f6f" font-weight="bold">It stands on the floor</text><text x="1276.00" y="261.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">the left view shows the load path;</text><text x="1276.00" y="273.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">the right shows how little of the</text><text x="1276.00" y="285.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">appliance it touches.</text><text x="1276.00" y="340.00" font-family="Helvetica,Arial,sans-serif" font-size="11.0" text-anchor="start" fill="#0a8f6f" font-weight="bold">Nothing reaches the doors</text><text x="1276.00" y="357.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">the doors project 117.5 forward of</text><text x="1276.00" y="369.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">the case and the mount stays behind</text><text x="1276.00" y="381.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">the hinge cover.</text><text x="1276.00" y="436.00" font-family="Helvetica,Arial,sans-serif" font-size="11.0" text-anchor="start" fill="#0a8f6f" font-weight="bold">The strut gap is deliberate</text><text x="1276.00" y="453.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">the break in the two struts is where</text><text x="1276.00" y="465.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">the display's ports and buttons stay</text><text x="1276.00" y="477.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">reachable.</text><text x="1276.00" y="532.00" font-family="Helvetica,Arial,sans-serif" font-size="11.0" text-anchor="start" fill="#0a8f6f" font-weight="bold">Both views are TRUE SCALE</text><text x="1276.00" y="549.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">no break, no exaggerated depth.</text><text x="1276.00" y="561.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">Everything measurable off the</text><text x="1276.00" y="573.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">drawing.</text></svg>