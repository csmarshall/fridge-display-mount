<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="940" viewBox="0 0 1420 940"><rect width="1420" height="940" fill="#fbfcfd"/><rect width="1420" height="24" fill="#b8860b"/><text x="710.00" y="16.50" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">PLATE — the link that was dimensioned but never drawn</text><text x="40.00" y="56.00" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#14181c" font-weight="bold">WHAT HOLDS THE MONITOR</text><text x="40.00" y="78.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#6b757e" font-weight="normal">Part C, the plate. The display bolts to it, it bolts to the struts, and the struts stand on the floor. The fridge carries none of the weight.</text><rect x="40.0" y="100.0" width="600.0" height="800.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">PLATE 220 x 328 — SPLICES THE TWO STRUT PIECES</text><rect x="175.1" y="286.9" width="285.8" height="426.2" rx="4" fill="#b9c2c9" stroke="#14181c" stroke-width="1.6"/><rect x="230.9" y="331.0" width="174.2" height="338.0" fill="none" stroke="#14181c" stroke-width="1.2" stroke-dasharray="7 4"/><text x="318.00" y="324.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#6b757e" font-weight="normal">rear box 134 x 260</text><rect x="282.9" y="346.6" width="70.2" height="72.8" rx="35.1" fill="#fbfcfd" stroke="#14181c" stroke-width="1.3"/><circle cx="318.0" cy="393.4" r="19.5" fill="#b00020" fill-opacity="0.30" stroke="#b00020" stroke-width="1"/><rect x="289.4" y="358.9" width="57.2" height="4" rx="2" fill="#b00020" fill-opacity="0.40"/><rect x="282.9" y="580.6" width="70.2" height="72.8" rx="35.1" fill="#fbfcfd" stroke="#14181c" stroke-width="1.3"/><circle cx="318.0" cy="606.6" r="19.5" fill="#b00020" fill-opacity="0.30" stroke="#b00020" stroke-width="1"/><rect x="289.4" y="637.1" width="57.2" height="4" rx="2" fill="#b00020" fill-opacity="0.40"/><text x="470.91" y="379.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="start" fill="#14181c" font-weight="bold">VENT 56 x 54</text><text x="470.91" y="390.00" font-family="Helvetica,Arial,sans-serif" font-size="8.0" text-anchor="start" fill="#6b757e" font-weight="normal">at R90 — covers fan AND GPIO</text><rect x="253.0" y="435.0" width="130.0" height="130.0" fill="none" stroke="#0a8f6f" stroke-width="1.2" stroke-dasharray="5 3"/><circle cx="253.0" cy="435.0" r="2.9" fill="#fbfcfd" stroke="#0a8f6f" stroke-width="1.3"/><circle cx="253.0" cy="565.0" r="2.9" fill="#fbfcfd" stroke="#0a8f6f" stroke-width="1.3"/><circle cx="383.0" cy="435.0" r="2.9" fill="#fbfcfd" stroke="#0a8f6f" stroke-width="1.3"/><circle cx="383.0" cy="565.0" r="2.9" fill="#fbfcfd" stroke="#0a8f6f" stroke-width="1.3"/><text x="318.00" y="504.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="middle" fill="#0a8f6f" font-weight="bold">VESA 100</text><circle cx="196.3" cy="308.1" r="5.5" fill="#fbfcfd" stroke="#b00020" stroke-width="1.5"/><circle cx="439.7" cy="308.1" r="5.5" fill="#fbfcfd" stroke="#b00020" stroke-width="1.5"/><text x="167.09" y="311.07" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="end" fill="#b00020" font-weight="bold">to the UPPER piece</text><circle cx="196.3" cy="691.9" r="5.5" fill="#fbfcfd" stroke="#b00020" stroke-width="1.5"/><circle cx="439.7" cy="691.9" r="5.5" fill="#fbfcfd" stroke="#b00020" stroke-width="1.5"/><text x="167.09" y="694.93" font-family="Helvetica,Arial,sans-serif" font-size="8.2" text-anchor="end" fill="#b00020" font-weight="bold">to the LOWER piece</text><line x1="464.9" y1="308.1" x2="464.9" y2="691.9" stroke="#b00020" stroke-width="1.2"/><text x="470.91" y="496.00" font-family="Helvetica,Arial,sans-serif" font-size="9.0" text-anchor="start" fill="#b00020" font-weight="bold">295.3 apart</text><text x="470.91" y="508.00" font-family="Helvetica,Arial,sans-serif" font-size="8.0" text-anchor="start" fill="#b00020" font-weight="normal">real slots on TWO grids</text><text x="318.00" y="733.11" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#6b757e" font-weight="normal">VESA sits 0.0 mm above the plate's own centre — the two grids do not line up</text><rect x="660.0" y="100.0" width="340.0" height="800.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="676.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#14181c" font-weight="bold">THE CHAIN</text><rect x="682" y="150.0" width="296" height="46" rx="6" fill="#b9c2c9" fill-opacity="0.9" stroke="#14181c" stroke-width="1.1"/><text x="700.00" y="171.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">THE DISPLAY</text><text x="960.00" y="171.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#6b757e" font-weight="normal">3.94 kg</text><line x1="830" y1="196.0" x2="830" y2="218.0" stroke="#14181c" stroke-width="2"/><path d="M825 212.0 L830 220.0 L835 212.0" fill="#14181c"/><text x="844.00" y="208.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="start" fill="#6b757e" font-weight="normal">4 x M4 into the VESA inserts, on SPACERS</text><rect x="682" y="226.0" width="296" height="46" rx="6" fill="#b9c2c9" fill-opacity="0.9" stroke="#14181c" stroke-width="1.1"/><text x="700.00" y="247.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#14181c" font-weight="bold">THE PLATE</text><text x="960.00" y="247.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#6b757e" font-weight="normal">220x328</text><line x1="830" y1="272.0" x2="830" y2="294.0" stroke="#14181c" stroke-width="2"/><path d="M825 288.0 L830 296.0 L835 288.0" fill="#14181c"/><text x="844.00" y="284.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="start" fill="#6b757e" font-weight="normal">4 bolts at 187 x 295.3 into the strut</text><text x="844.00" y="295.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="start" fill="#6b757e" font-weight="normal">slots</text><rect x="682" y="313.0" width="296" height="46" rx="6" fill="#8f9aa4" fill-opacity="0.9" stroke="#14181c" stroke-width="1.1"/><text x="700.00" y="334.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#fff" font-weight="bold">THE STRUTS</text><text x="960.00" y="334.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#fff" font-weight="normal">x2</text><line x1="830" y1="359.0" x2="830" y2="381.0" stroke="#14181c" stroke-width="2"/><path d="M825 375.0 L830 383.0 L835 375.0" fill="#14181c"/><text x="844.00" y="371.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="start" fill="#6b757e" font-weight="normal">stand on</text><rect x="682" y="389.0" width="296" height="46" rx="6" fill="#4a545e" fill-opacity="0.9" stroke="#14181c" stroke-width="1.1"/><text x="700.00" y="410.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#fff" font-weight="bold">THE FEET</text><text x="960.00" y="410.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#fff" font-weight="normal">x2</text><line x1="830" y1="435.0" x2="830" y2="457.0" stroke="#14181c" stroke-width="2"/><path d="M825 451.0 L830 459.0 L835 451.0" fill="#14181c"/><text x="844.00" y="447.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="start" fill="#6b757e" font-weight="normal">rest on</text><rect x="682" y="465.0" width="296" height="46" rx="6" fill="#2f6f4f" fill-opacity="0.9" stroke="#14181c" stroke-width="1.1"/><text x="700.00" y="486.00" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#fff" font-weight="bold">THE FLOOR</text><text x="960.00" y="486.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="end" fill="#fff" font-weight="normal">154 N</text><rect x="682" y="535.0" width="296" height="112" rx="6" fill="#fff" stroke="#b8860b" stroke-width="1.4"/><text x="700.00" y="557.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#b8860b" font-weight="bold">THE CLAMP BARS x2</text><text x="700.00" y="575.00" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="start" fill="#6b757e" font-weight="normal">Grip the fridge top and its underside.</text><text x="700.00" y="587.00" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="start" fill="#6b757e" font-weight="normal">They carry ZERO weight — they only</text><text x="700.00" y="599.00" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="start" fill="#6b757e" font-weight="normal">stop the frame falling away from the</text><text x="700.00" y="611.00" font-family="Helvetica,Arial,sans-serif" font-size="8.8" text-anchor="start" fill="#6b757e" font-weight="normal">panel.</text><rect x="1020.0" y="100.0" width="360.0" height="800.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="1036.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">SO, WHAT HOLDS IT?</text><text x="1036.00" y="146.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="normal">Nothing holds it TO the fridge. The FLOOR</text><text x="1036.00" y="158.40" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="normal">holds it up, the way a bookcase stands on</text><text x="1036.00" y="170.80" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="normal">the floor and leans on a wall. The fridge</text><text x="1036.00" y="183.20" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#14181c" font-weight="normal">only stops it tipping away.</text><text x="1036.00" y="210.60" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">That is the whole point of the change. The</text><text x="1036.00" y="223.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">magnet design really did hang off the</text><text x="1036.00" y="235.40" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">fridge, so every question was about how</text><text x="1036.00" y="247.80" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">hard it gripped. Here the grip carries</text><text x="1036.00" y="260.20" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">nothing, so a non-magnetic panel, paint</text><text x="1036.00" y="272.60" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">creep and peel all stop mattering.</text><text x="1036.00" y="300.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">A solid plate over the Pi's fan and GPIO</text><text x="1036.00" y="312.40" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">cooks it. The old plate was 279 tall</text><text x="1036.00" y="324.80" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">purely to carry vent WINDOWS over that</text><text x="1036.00" y="337.20" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">region. At 327.9 the plate clears the GPIO</text><text x="1036.00" y="349.60" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">slot entirely (-57 mm clear) and needs</text><text x="1036.00" y="362.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">only to deal with the fan, which an edge</text><text x="1036.00" y="374.40" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">notch does far more cheaply than an</text><text x="1036.00" y="386.80" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">enclosed window.</text><text x="1036.00" y="414.20" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b00020" font-weight="normal">The 2 edge notches are NOT idle insurance</text><text x="1036.00" y="426.60" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b00020" font-weight="normal">— correcting an earlier claim here.</text><text x="1036.00" y="439.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b00020" font-weight="normal">Reading the fan off Waveshare's drawing</text><text x="1036.00" y="451.40" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b00020" font-weight="normal">puts it at ~R82, so the plate edge laps it</text><text x="1036.00" y="463.80" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b00020" font-weight="normal">by 96.9 mm and the notch is what uncovers</text><text x="1036.00" y="476.20" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b00020" font-weight="normal">it. Depth 101.9 is derived: fan near edge</text><text x="1036.00" y="488.60" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b00020" font-weight="normal">minus 5 mm for the fact that every one of</text><text x="1036.00" y="501.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b00020" font-weight="normal">those figures is SCALED off a raster, not</text><text x="1036.00" y="513.40" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b00020" font-weight="normal">dimensioned.</text><text x="1036.00" y="540.80" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">Bolt rows are 295.3 apart — exactly 2 slot</text><text x="1036.00" y="553.20" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">pitches, so both sit identically in their</text><text x="1036.00" y="565.60" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">slots.</text><text x="1036.00" y="593.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b8860b" font-weight="normal">ORIENTATION — CORRECTED. At the old 246</text><text x="1036.00" y="605.40" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b8860b" font-weight="normal">spacing landscape overhung the rear edge</text><text x="1036.00" y="617.80" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b8860b" font-weight="normal">and was impossible. Narrowing to 187 moved</text><text x="1036.00" y="630.20" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b8860b" font-weight="normal">the struts forward, and it now technically</text><text x="1036.00" y="642.60" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b8860b" font-weight="normal">fits: it clears the rear by -18.7 mm</text><text x="1036.00" y="655.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b8860b" font-weight="normal">against 73.1 at the front. That is flush</text><text x="1036.00" y="667.40" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b8860b" font-weight="normal">with the back of the cabinet and wildly</text><text x="1036.00" y="679.80" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b8860b" font-weight="normal">off centre, so portrait remains the choice</text><text x="1036.00" y="692.20" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b8860b" font-weight="normal">— on practical grounds now, not geometric</text><text x="1036.00" y="704.60" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b8860b" font-weight="normal">impossibility.</text><text x="1036.00" y="732.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">Heads sit on the DISPLAY side, so they</text><text x="1036.00" y="744.40" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">must not fall under the Pi bump-out. In</text><text x="1036.00" y="756.80" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">portrait the box is 134 wide and the bolts</text><text x="1036.00" y="769.20" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">187 apart, clearing by 27 mm — because the</text><text x="1036.00" y="781.60" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">STRUT SPACING is wider than the box, not</text><text x="1036.00" y="794.00" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6b757e" font-weight="normal">by luck of where the holes went.</text><text x="1036.00" y="821.40" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b00020" font-weight="normal">CONSEQUENCE: those heads are unreachable</text><text x="1036.00" y="833.80" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b00020" font-weight="normal">once the display is on. The plate goes on</text><text x="1036.00" y="846.20" font-family="Helvetica,Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b00020" font-weight="normal">the struts BEFORE the display.</text></svg>