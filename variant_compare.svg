<text x="590.00" y="22.00" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">REFERENCE ONLY — variant comparison</text>
<text x="40.00" y="58.00" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="start" fill="#111" font-weight="bold">The only difference between the two variants</text>
<text x="40.00" y="78.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#555" font-weight="normal">Looking at the fridge's top corner from the side. Everything below the bend — neck, body, VESA, vents, magnets, holes — is IDENTICAL.</text>
<text x="40.00" y="96.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#555" font-weight="normal">Only the arm's reach inboard across the top changes: 130 mm (A) or 180 mm (B).</text>
