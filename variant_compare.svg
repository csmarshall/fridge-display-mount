<text x="340.88" y="319.79" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#6a737b" font-weight="normal">REFRIGERATOR</text>
<text x="340.88" y="335.79" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#8a9199" font-weight="normal">top FLAT (measured) · corner R12 mm</text>
<text x="133.75" y="156.10" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#8a9199" font-weight="normal">← inboard, across the fridge top</text>
<path d="M 297.00 157.79 L 557.21 157.79 L 557.21 438.25 L 550.80 438.25 L 550.80 164.20 L 297.00 164.20 Z" fill="#e8a33d" fill-opacity="0.45" stroke="#5d3600" stroke-width="1.3" stroke-dasharray="7 4"/>
<path d="M 364.50 157.79 L 557.21 157.79 L 557.21 438.25 L 550.80 438.25 L 550.80 164.20 L 364.50 164.20 Z" fill="#9a5b00" fill-opacity="0.75" stroke="#5d3600" stroke-width="1.3"/>
<rect x="297.00" y="164.20" width="253.80" height="10.80" fill="#f2c14e" fill-opacity="0.55" stroke="#a8830f" stroke-width="0.8"/>
<rect x="550.80" y="438.25" width="10.80" height="263.25" fill="#f2c14e" fill-opacity="0.40" stroke="#a8830f" stroke-width="0.6"/>
<rect x="550.80" y="239.80" width="10.80" height="43.20" fill="#e7b6dd" stroke="#c0169a" stroke-width="0.8"/>
<text x="536.80" y="319.79" font-family="Helvetica,Arial,sans-serif" font-size="8.5" text-anchor="end" fill="#b0b6b9" font-weight="normal">magnets + pad hold the spine off</text>
<rect x="297.00" y="153.79" width="67.50" height="25.21" fill="#b00020" fill-opacity="0.16" stroke="#b00020" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="330.75" y1="149.79" x2="330.75" y2="127.79" stroke="#b00020" stroke-width="1"/>
<text x="330.75" y="121.79" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#b00020" font-weight="bold">this 50 mm is the whole difference</text>
<line x1="540.00" y1="478.25" x2="364.50" y2="478.25" stroke="#5d3600" stroke-width="1.2"/>
<line x1="540.00" y1="473.25" x2="540.00" y2="483.25" stroke="#5d3600" stroke-width="1.2"/>
<line x1="364.50" y1="473.25" x2="364.50" y2="483.25" stroke="#5d3600" stroke-width="1.2"/>
<text x="452.25" y="470.25" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#5d3600" font-weight="bold">A — reach 130 mm</text>
<line x1="540.00" y1="506.25" x2="297.00" y2="506.25" stroke="#b00020" stroke-width="1.2"/>
<line x1="540.00" y1="501.25" x2="540.00" y2="511.25" stroke="#b00020" stroke-width="1.2"/>
<line x1="297.00" y1="501.25" x2="297.00" y2="511.25" stroke="#b00020" stroke-width="1.2"/>
<text x="418.50" y="498.25" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#b00020" font-weight="bold">B — reach 180 mm</text>
<text x="640.00" y="150.00" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#111" font-weight="bold">What the extra 50 mm changes</text>
<text x="640.00" y="178.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#444" font-weight="bold"></text>
<text x="760.00" y="178.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#444" font-weight="bold">footprint on top</text>
<text x="890.00" y="178.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#444" font-weight="bold">pad margin</text>
<text x="1000.00" y="178.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#444" font-weight="bold">covers R_f to</text>
<text x="1100.00" y="178.00" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#444" font-weight="bold">flat length</text>
<line x1="640" y1="184" x2="1140" y2="184" stroke="#ccc"/>
<text x="640.00" y="206.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#5d3600" font-weight="normal">A · reach 130</text>
<text x="760.00" y="206.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#5d3600" font-weight="normal">130 mm</text>
<text x="890.00" y="206.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#5d3600" font-weight="normal">2.31x</text>
<text x="1000.00" y="206.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#5d3600" font-weight="normal">25 mm</text>
<text x="1100.00" y="206.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#5d3600" font-weight="normal">730.9 mm</text>
<text x="640.00" y="228.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#b00020" font-weight="normal">B · reach 180</text>
<text x="760.00" y="228.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#b00020" font-weight="normal">180 mm</text>
<text x="890.00" y="228.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#b00020" font-weight="normal">2.31x</text>
<text x="1000.00" y="228.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#b00020" font-weight="normal">25 mm</text>
<text x="1100.00" y="228.00" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#b00020" font-weight="normal">780.9 mm</text>
<text x="640.00" y="285.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">The top is flat, so a longer arm costs no extra pad — only sheet</text>
<text x="640.00" y="302.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">and its sponge pad has less spare compression — 1.43x versus 1.59x.</text>
<text x="640.00" y="319.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal"></text>
<text x="640.00" y="336.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">B buys: 50 mm more bearing footprint, so the bracket is harder to rock fore-and-aft.</text>
<text x="640.00" y="353.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#b00020" font-weight="normal">B costs: 50 mm more sheet, 0.12 kg, and it stops working sooner if your fridge's</text>
<text x="640.00" y="370.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">corner radius measures large (17 mm vs 19 mm before the pad runs out).</text>
<text x="640.00" y="387.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal"></text>
<text x="640.00" y="404.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">Neither changes a single hole, the bend position, the body, or how the display mounts.</text>
<text x="640.00" y="470.00" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#111" font-weight="bold">How to choose</text>
<text x="640.00" y="498.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#555" font-weight="normal">measure R_f &gt; 17 mm</text>
<text x="900.00" y="498.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#888" font-weight="normal">-&gt;</text>
<text x="930.00" y="498.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#111" font-weight="bold">A — B's pad can't cover it</text>
<text x="640.00" y="520.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#555" font-weight="normal">R_f &lt;= 17 mm</text>
<text x="900.00" y="520.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#888" font-weight="normal">-&gt;</text>
<text x="930.00" y="520.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#111" font-weight="bold">B — the extra footprint is free</text>
<text x="640.00" y="542.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#555" font-weight="normal">R_f &gt; 20 mm</text>
<text x="900.00" y="542.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#888" font-weight="normal">-&gt;</text>
<text x="930.00" y="542.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#111" font-weight="bold">A — less corner lift to bridge</text>
<text x="640.00" y="564.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#555" font-weight="normal">still unsure</text>
<text x="900.00" y="564.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#888" font-weight="normal">-&gt;</text>
<text x="930.00" y="564.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#111" font-weight="bold">A — more margin, less sheet</text>
</svg>