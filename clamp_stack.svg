<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="900" viewBox="0 0 1420 900"><rect width="1420" height="900" fill="#fbfcfd"/><rect width="1420" height="24" fill="#b8860b"/><text x="710.00" y="16.50" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">STACK DETAIL — nested: the box passes BETWEEN the struts</text><text x="40.00" y="56.00" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#14181c" font-weight="bold">THE STACK, PANEL TO SCREEN</text><text x="40.00" y="78.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#6b757e" font-weight="normal">Section at 7x. The stack differs depending on where you cut it, so both cuts are drawn. Fridge on the left, room on the right.</text><rect x="1080.0" y="100.0" width="300.0" height="250.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="1096.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#6b757e" font-weight="bold">WHERE THE CUTS ARE</text><rect x="1188.5" y="190.0" width="83.1" height="80" fill="#2b3440"/><text x="1230.00" y="234.00" font-family="Helvetica,Arial,sans-serif" font-size="8" text-anchor="middle" fill="#fff" font-weight="normal">box</text><rect x="1275.3" y="190.0" width="25.6" height="80" fill="#8f9aa4" stroke="#14181c"/><rect x="1159.1" y="190.0" width="25.6" height="80" fill="#8f9aa4" stroke="#14181c"/><line x1="1171.9" y1="168.0" x2="1171.9" y2="292.0" stroke="#b00020" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1171.94" y="162.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#b00020" font-weight="bold">A</text><line x1="1230.0" y1="168.0" x2="1230.0" y2="292.0" stroke="#0a8f6f" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1230.00" y="162.00" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#0a8f6f" font-weight="bold">B</text><text x="1230.00" y="314.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#6b757e" font-weight="normal">plan view, looking down</text><rect x="40.0" y="100.0" width="1010.0" height="250.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="124.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#b00020" font-weight="bold">SECTION A-A — through a STRUT</text><rect x="52.0" y="162.0" width="98.0" height="124.0" fill="#3a3734"/><text x="101.00" y="224.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#cfc9c2" font-weight="normal" transform="rotate(-90.0 101.00 224.00)">FRIDGE</text><rect x="150.0" y="178.0" width="42.2" height="92.0" fill="none" stroke="#c9d1d8" stroke-width="0.8" stroke-dasharray="3 3"/><text x="171.08" y="285.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#6b757e" font-weight="bold">6.02</text><line x1="171.1" y1="173.0" x2="171.1" y2="177.0" stroke="#c9d1d8" stroke-width="0.7"/><text x="171.08" y="170.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#6b757e" font-weight="bold">air</text><rect x="192.2" y="178.0" width="21.2" height="92.0" fill="#b9c2c9" stroke="#14181c" stroke-width="1.1"/><text x="202.74" y="285.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#14181c" font-weight="bold">3.02</text><line x1="202.7" y1="157.0" x2="202.7" y2="177.0" stroke="#c9d1d8" stroke-width="0.7"/><text x="202.74" y="154.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#14181c" font-weight="bold">PLATE</text><rect x="213.3" y="178.0" width="144.5" height="92.0" fill="#8f9aa4" stroke="#14181c" stroke-width="1.1"/><text x="285.55" y="285.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#14181c" font-weight="bold">20.64</text><line x1="285.5" y1="173.0" x2="285.5" y2="177.0" stroke="#c9d1d8" stroke-width="0.7"/><text x="285.55" y="170.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#14181c" font-weight="bold">STRUT</text><rect x="357.8" y="178.0" width="30.5" height="92.0" fill="none" stroke="#c9d1d8" stroke-width="0.8" stroke-dasharray="3 3"/><text x="373.05" y="285.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#6b757e" font-weight="bold">4.36</text><line x1="373.0" y1="157.0" x2="373.0" y2="177.0" stroke="#c9d1d8" stroke-width="0.7"/><text x="373.05" y="154.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#6b757e" font-weight="bold">air</text><rect x="388.3" y="178.0" width="126.0" height="92.0" fill="#101820" stroke="#14181c" stroke-width="1.1"/><text x="451.32" y="285.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#14181c" font-weight="bold">18.00</text><line x1="451.3" y1="173.0" x2="451.3" y2="177.0" stroke="#c9d1d8" stroke-width="0.7"/><text x="451.32" y="170.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#14181c" font-weight="bold">display PANEL</text><line x1="150.0" y1="304.0" x2="514.3" y2="304.0" stroke="#b00020" stroke-width="1.5"/><line x1="150.0" y1="299.0" x2="150.0" y2="309.0" stroke="#b00020" stroke-width="1.5"/><line x1="514.3" y1="299.0" x2="514.3" y2="309.0" stroke="#b00020" stroke-width="1.5"/><text x="332.16" y="299.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#b00020" font-weight="bold">52.05 mm total</text><text x="373.05" y="322.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#6b757e" font-weight="normal">the strut stops 4.36 mm short of the panel — it is beside the box, not behind it</text><rect x="40.0" y="380.0" width="1010.0" height="250.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="404.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">SECTION B-B — through the CENTRE, where the box is</text><rect x="52.0" y="442.0" width="98.0" height="124.0" fill="#3a3734"/><text x="101.00" y="504.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#cfc9c2" font-weight="normal" transform="rotate(-90.0 101.00 504.00)">FRIDGE</text><rect x="150.0" y="458.0" width="42.2" height="92.0" fill="none" stroke="#c9d1d8" stroke-width="0.8" stroke-dasharray="3 3"/><text x="171.08" y="565.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#6b757e" font-weight="bold">6.02</text><line x1="171.1" y1="453.0" x2="171.1" y2="457.0" stroke="#c9d1d8" stroke-width="0.7"/><text x="171.08" y="450.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#6b757e" font-weight="bold">air + PADS</text><rect x="192.2" y="458.0" width="21.2" height="92.0" fill="#b9c2c9" stroke="#14181c" stroke-width="1.1"/><text x="202.74" y="565.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#14181c" font-weight="bold">3.02</text><line x1="202.7" y1="437.0" x2="202.7" y2="457.0" stroke="#c9d1d8" stroke-width="0.7"/><text x="202.74" y="434.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#14181c" font-weight="bold">PLATE</text><rect x="213.3" y="458.0" width="175.0" height="92.0" fill="#5b6b7d" stroke="#14181c" stroke-width="1.1"/><text x="300.82" y="565.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#14181c" font-weight="bold">25.00</text><line x1="300.8" y1="453.0" x2="300.8" y2="457.0" stroke="#c9d1d8" stroke-width="0.7"/><text x="300.82" y="450.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#14181c" font-weight="bold">REAR BOX — between the struts</text><rect x="388.3" y="458.0" width="126.0" height="92.0" fill="#101820" stroke="#14181c" stroke-width="1.1"/><text x="451.32" y="565.00" font-family="Helvetica,Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#14181c" font-weight="bold">18.00</text><line x1="451.3" y1="437.0" x2="451.3" y2="457.0" stroke="#c9d1d8" stroke-width="0.7"/><text x="451.32" y="434.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="middle" fill="#14181c" font-weight="bold">display PANEL</text><line x1="150.0" y1="584.0" x2="514.3" y2="584.0" stroke="#0a8f6f" stroke-width="1.5"/><line x1="150.0" y1="579.0" x2="150.0" y2="589.0" stroke="#0a8f6f" stroke-width="1.5"/><line x1="514.3" y1="579.0" x2="514.3" y2="589.0" stroke="#0a8f6f" stroke-width="1.5"/><text x="332.16" y="579.00" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#0a8f6f" font-weight="bold">52.05 mm total</text><rect x="164.0" y="495.0" width="28.1" height="18" rx="2" fill="#4a545e" stroke="#14181c" stroke-width="1"/><rect x="192.2" y="500.0" width="77.2" height="8" fill="#4a545e" stroke="#14181c" stroke-width="0.8"/><line x1="178.0" y1="514.0" x2="178.0" y2="602.0" stroke="#14181c" stroke-width="0.7"/><text x="150.00" y="614.00" font-family="Helvetica,Arial,sans-serif" font-size="8.4" text-anchor="start" fill="#14181c" font-weight="normal">M4 into the VESA insert — its head lives in the 6.02 mm gap, and the pads sit at the plate CORNERS clear of it</text><rect x="1080.0" y="380.0" width="300.0" height="250.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="1096.00" y="404.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#b8860b" font-weight="bold">THE PADS</text><text x="1096.00" y="424.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">4 pads, 25 mm across, 6.02 thick —</text><text x="1096.00" y="437.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">at the plate corners, NOT a</text><text x="1096.00" y="450.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">covering sheet.</text><text x="1096.00" y="486.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">Nothing presses the plate against</text><text x="1096.00" y="499.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">the fridge, so there is nothing</text><text x="1096.00" y="512.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">here to compress. Their only job</text><text x="1096.00" y="525.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">is to stop bare steel meeting</text><text x="1096.00" y="538.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">paint if the plate ever flexes.</text><text x="1096.00" y="570.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">They clear the M4 heads by sitting</text><text x="1096.00" y="583.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">at the corners, away from the VESA</text><text x="1096.00" y="596.00" font-family="Helvetica,Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#6b757e" font-weight="normal">pattern.</text><rect x="40.0" y="660.0" width="1340.0" height="200.0" rx="7" fill="#fff" stroke="#c9d1d8" stroke-width="1"/><text x="56.00" y="684.00" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#0a8f6f" font-weight="bold">WHAT THIS BUYS</text><rect x="52" y="684.0" width="1316" height="34" fill="#f2f5f7"/><text x="64.00" y="702.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">display face, off the fridge panel</text><text x="430.00" y="702.00" font-family="Helvetica,Arial,sans-serif" font-size="11.0" text-anchor="end" fill="#0a8f6f" font-weight="bold">52.05 mm</text><text x="460.00" y="702.00" font-family="Helvetica,Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#6b757e" font-weight="normal">was 75.71 stacked — 23.66 mm closer, 31%</text><text x="64.00" y="740.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">of which the DISPLAY ITSELF is</text><text x="430.00" y="740.00" font-family="Helvetica,Arial,sans-serif" font-size="11.0" text-anchor="end" fill="#0a8f6f" font-weight="bold">43 mm</text><text x="460.00" y="740.00" font-family="Helvetica,Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#6b757e" font-weight="normal">box 25 + panel 18. No mount can remove this.</text><rect x="52" y="760.0" width="1316" height="34" fill="#f2f5f7"/><text x="64.00" y="778.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">of which the MOUNT adds</text><text x="430.00" y="778.00" font-family="Helvetica,Arial,sans-serif" font-size="11.0" text-anchor="end" fill="#0a8f6f" font-weight="bold">9.05 mm</text><text x="460.00" y="778.00" font-family="Helvetica,Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#6b757e" font-weight="normal">just the clamp gap. Stacked, the mount added 32.71.</text><text x="64.00" y="816.00" font-family="Helvetica,Arial,sans-serif" font-size="10.4" text-anchor="start" fill="#14181c" font-weight="bold">strut spacing, now DERIVED</text><text x="430.00" y="816.00" font-family="Helvetica,Arial,sans-serif" font-size="11.0" text-anchor="end" fill="#0a8f6f" font-weight="bold">187.28 mm</text><text x="460.00" y="816.00" font-family="Helvetica,Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#6b757e" font-weight="normal">box 134 + strut 41.27 + 12 clearance. Not a choice any more — the box has to pass through.</text></svg>