<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="980" viewBox="0 0 1720 980"><rect width="1720" height="980" fill="#f7f8fa"/><rect width="1720" height="26" fill="#8a1c1c"/><text x="860.0" y="18.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">REFERENCE ONLY — a sizing study. Rated pulls are vendor figures on thick bare steel; every candidate is derated the same 35 %.</text><text x="40.0" y="62.0" font-family="Helvetica, Arial, sans-serif" font-size="21" text-anchor="start" fill="#111" font-weight="bold">RIGHT-SIZING THE MAGNETS — what they actually do, against what they could be</text><text x="40.0" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#5b6166" font-weight="normal">In a hook the magnets carry no weight and no shear. They hold the plate flat: a touch press, the CG&#x27;s peel, and whatever someone does to the bottom edge.</text><rect x="40" y="104" width="620" height="230" rx="7" fill="#fff" stroke="#d0d4d8"/><text x="56.0" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#111" font-weight="bold">WHAT ONE MAGNET HAS TO HOLD</text><text x="56.0" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="9.6" text-anchor="start" fill="#5b6166" font-weight="normal">4 body magnets fitted; each duty lands on a PAIR</text><text x="56.0" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="10.8" text-anchor="start" fill="#111" font-weight="bold">touch torsion, 5 lb at the screen edge</text><text x="640.0" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" fill="#111" font-weight="bold">1.65 lb / magnet</text><text x="56.0" y="186.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="normal">32.0 in-lb over 246 mm, shared by a pair</text><text x="56.0" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="10.8" text-anchor="start" fill="#111" font-weight="bold">peel from the display&#x27;s CG offset</text><text x="640.0" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" fill="#111" font-weight="bold">1.12 lb / magnet</text><text x="56.0" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="normal">2.24 lb total on the bottom pair</text><text x="56.0" y="252.0" font-family="Helvetica, Arial, sans-serif" font-size="10.8" text-anchor="start" fill="#111" font-weight="bold">grab the bottom edge and pull, 20 lb</text><text x="640.0" y="252.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" fill="#111" font-weight="bold">10.00 lb / magnet</text><text x="56.0" y="266.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="normal">ASSUMED abuse case, not a use case; the bottom pair takes it</text><text x="56.0" y="296.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="start" fill="#5b6166" font-weight="normal">Derate chain: rated x 0.35 (painted 0.6-0.9 mm sheet, paint gap). Shear is not a duty here — the arm carries the weight.</text><rect x="690" y="104" width="990" height="230" rx="7" fill="#fff" stroke="#d0d4d8"/><text x="706.0" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#111" font-weight="bold">THE LADDER — male-stud pot magnets, derated the same way</text><text x="706.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="start" fill="#5b6166" font-weight="bold">part</text><text x="830.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="start" fill="#5b6166" font-weight="bold">O x h mm</text><text x="920.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="start" fill="#5b6166" font-weight="bold">stud</text><text x="985.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="start" fill="#5b6166" font-weight="bold">rated</text><text x="1060.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="start" fill="#5b6166" font-weight="bold">derated</text><text x="1140.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="start" fill="#5b6166" font-weight="bold">$ each</text><text x="1205.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="start" fill="#5b6166" font-weight="bold">x4</text><text x="1290.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="start" fill="#5b6166" font-weight="bold">SF 1</text><text x="1380.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="start" fill="#5b6166" font-weight="bold">SF 2</text><text x="1470.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="start" fill="#5b6166" font-weight="bold">SF 3</text><text x="1560.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" text-anchor="start" fill="#5b6166" font-weight="bold">pad = h</text><text x="706.0" y="164.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" text-anchor="start" fill="#5b6166" font-weight="normal">SF 1 touch · SF 2 peel · SF 3 grab — derated pull / per-magnet duty</text><text x="706.0" y="186.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">MM-C-20</text><text x="830.0" y="186.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">20 x 7.0</text><text x="920.0" y="186.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">M4</text><text x="985.0" y="186.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">29 lb</text><text x="1060.0" y="186.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="bold">10.0 lb</text><text x="1140.0" y="186.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">n/a</text><text x="1205.0" y="186.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">n/a</text><text x="1290.0" y="186.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#0b7a4b" font-weight="bold">6.1x</text><text x="1380.0" y="186.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#0b7a4b" font-weight="bold">9.0x</text><text x="1470.0" y="186.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#b00020" font-weight="bold">1.0x</text><text x="1560.0" y="186.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">7.00 mm</text><text x="706.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">MM-C-25</text><text x="830.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">25 x 8.0</text><text x="920.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">M5</text><text x="985.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">48 lb</text><text x="1060.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="bold">17.0 lb</text><text x="1140.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">$5.04</text><text x="1205.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">$20.16</text><text x="1290.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#0b7a4b" font-weight="bold">10.3x</text><text x="1380.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#0b7a4b" font-weight="bold">15.2x</text><text x="1470.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#b00020" font-weight="bold">1.7x</text><text x="1560.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">8.00 mm</text><text x="706.0" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">MM-C-32</text><text x="830.0" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">32 x 8.0</text><text x="920.0" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">M6</text><text x="985.0" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">75 lb</text><text x="1060.0" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="bold">26.2 lb</text><text x="1140.0" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">$7.64</text><text x="1205.0" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">$30.56</text><text x="1290.0" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#0b7a4b" font-weight="bold">15.9x</text><text x="1380.0" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#0b7a4b" font-weight="bold">23.4x</text><text x="1470.0" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#c8791a" font-weight="bold">2.6x</text><text x="1560.0" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">8.00 mm</text><text x="706.0" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">MM-C-36</text><text x="830.0" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">36 x 8.0</text><text x="920.0" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">M6</text><text x="985.0" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">90 lb</text><text x="1060.0" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="bold">31.6 lb</text><text x="1140.0" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">$9.72</text><text x="1205.0" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">$38.88</text><text x="1290.0" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#0b7a4b" font-weight="bold">19.2x</text><text x="1380.0" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#0b7a4b" font-weight="bold">28.3x</text><text x="1470.0" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#c8791a" font-weight="bold">3.2x</text><text x="1560.0" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">8.00 mm</text><text x="706.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="bold">3506K67 (fitted)</text><text x="830.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">48 x 11.5</text><text x="920.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">5/16-18</text><text x="985.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">175 lb</text><text x="1060.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="bold">61.2 lb</text><text x="1140.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">$23.92</text><text x="1205.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">$95.68</text><text x="1290.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#0b7a4b" font-weight="bold">37.1x</text><text x="1380.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#0b7a4b" font-weight="bold">54.7x</text><text x="1470.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#0b7a4b" font-weight="bold">6.1x</text><text x="1560.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">11.51 mm</text><text x="706.0" y="312.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" text-anchor="start" fill="#5b6166" font-weight="normal">green &gt;= 4x · amber 2-4x · red &lt; 2x, on the DERATED figure</text><rect x="40" y="354" width="1640" height="300" rx="7" fill="#fff" stroke="#d0d4d8"/><text x="56.0" y="378.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#111" font-weight="bold">WHAT CHANGES IF THE MAGNET SHRINKS — the three things nobody prices</text><text x="56.0" y="404.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="bold">1. The standoff is the pad.</text><text x="56.0" y="420.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">The magnet body height is the plate-to-panel gap, and the pad must match it within -0.60/+0.30 mm (CLAUDE.md 1.5). The O48 is 11.51 mm, which 7/16 in</text><text x="56.0" y="434.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">foam (11.11) meets. Every K&amp;J candidate is 8 mm: that is 5/16 in foam (7.94, -0.06 — in band) — stocked at McMaster, not yet sourced cheaper. So a</text><text x="56.0" y="448.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">smaller magnet is not a swap, it is a pad change too.</text><text x="56.0" y="478.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="bold">2. The stud is the hole.</text><text x="56.0" y="494.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">The plate is cut with O8.5 holes for a 5/16-18 stud. An M6 stud wants O6.5 (O8.5 would let it wander 1.25 mm each way before the washer stops it).</text><text x="56.0" y="508.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">That is a one-parameter change in the generator, but it must be made BEFORE the plate is cut, and it throws away the fastener matrix&#x27;s 39 permutations</text><text x="56.0" y="522.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">— redo it for M6 nyloc + fender washer.</text><text x="56.0" y="552.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="bold">3. Margin is where the money went.</text><text x="56.0" y="568.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">The O48 gives 37x on the touch case. MM-C-36 gives 19x and MM-C-32 16x — still comfortable — and on the 20 lb grab they read 3.2x and 2.6x, which is</text><text x="56.0" y="582.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">where a real choice lives: does the bottom edge have to survive a deliberate pull, or just a press? Four MM-C-36 cost $38.88 against $95.68.</text><rect x="40" y="674" width="1640" height="230" rx="7" fill="#fff" stroke="#d0d4d8"/><text x="56.0" y="698.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#111" font-weight="bold">WHERE THIS LEAVES THE DECISION</text><text x="56.0" y="722.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">For designs 1 and 3 the O48 stays: the plate is cut for its stud, the 7/16 in pad matches its height, and the fastener stack is proven. The saving from four MM-C-36</text><text x="56.0" y="736.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">is about $57 and costs a plate parameter, a new pad thickness and a redone fastener study — worth it only if the plate has not been cut yet AND the grab case is</text><text x="56.0" y="750.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">accepted at ~2x rather than ~7x.</text><text x="56.0" y="776.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">For design 4 (aluminium angle + flat bars) the magnets sit on 2 in bars, where an O48 does not fit and an MM-C-36 does. That design starts from the small magnet and</text><text x="56.0" y="790.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">its 8 mm pad, so nothing is thrown away.</text><text x="56.0" y="816.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">What would change this study: a measured grab load (what does a child actually pull with?), a measured pull-off on the real panel with one magnet (the 35 % derate is</text><text x="56.0" y="830.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">a rule of thumb from the brief, not a measurement), and a decision on whether pull-off is a safety case or a nuisance case.</text><text x="40.0" y="950.0" font-family="Helvetica, Arial, sans-serif" font-size="9.4" text-anchor="start" fill="#5b6166" font-weight="normal">Sources: K&amp;J product pages 2026-09-02 (MM-C-25 $5.04, MM-C-32 $7.64, MM-C-36 $9.72); McMaster 3506K67 $23.92 2026-08-27; duties from bracket_params.json.</text></svg>